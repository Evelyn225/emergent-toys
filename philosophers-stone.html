<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-16x16.png">
  <link rel="manifest" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/site.webmanifest">
  <title>Reaction Diffusion</title>
  <style>
    @font-face {
      font-family: 'GrapeSoda';
      src: url('GrapeSoda.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    :root {
      --c:       rgba(127, 233, 255, 0.88);
      --c-mid:   rgba(127, 233, 255, 0.50);
      --c-dim:   rgba(127, 233, 255, 0.30);
      --c-faint: rgba(127, 233, 255, 0.13);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* ── HUD ─────────────────────────────────────
       No panel, no border, no glow. Bare pixel text
       over the sim, like physarum. */

    #hud, #keys {
      position: fixed;
      left: 14px;
      z-index: 100;
      font-family: 'GrapeSoda', 'Courier New', monospace;
      font-size: 16px;
      line-height: 1;
      color: var(--c);
      text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
      -webkit-font-smoothing: none;
      font-smooth: never;
      user-select: none;
    }

    #hud  { top: 14px; width: 186px; }
    #keys { bottom: 14px; color: var(--c-mid); pointer-events: none; }

    body.ui-hidden #hud,
    body.ui-hidden #keys { display: none; }

    .hud-title {
      color: var(--c);
      margin-bottom: 14px;
    }

    .hud-title::after {
      content: '';
      display: inline-block;
      width: 7px;
      height: 11px;
      margin-left: 5px;
      vertical-align: -1px;
      background: var(--c);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--c-mid);
      margin-bottom: 7px;
    }

    .row .v {
      color: var(--c);
      text-align: right;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .field + .field { margin-top: 13px; }

    /* ── sliders: flat, square, pixel-sized ── */

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 2px;
      background: var(--c-faint);
      outline: none;
      cursor: crosshair;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 6px;
      height: 12px;
      border: 0;
      border-radius: 0;
      background: var(--c);
      cursor: crosshair;
    }

    input[type="range"]::-moz-range-thumb {
      width: 6px;
      height: 12px;
      border: 0;
      border-radius: 0;
      background: var(--c);
      cursor: crosshair;
    }

    input[type="range"]::-moz-range-track {
      background: transparent;
      border: none;
    }

    #keys div + div { margin-top: 7px; }
    #keys b {
      font-weight: normal;
      color: var(--c);
    }
  </style>
</head>

<body>
  <!-- Home button -->
  <a href="/"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.2)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.2)'">
  <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-title">REACTION-DIFFUSION</div>

    <div class="field">
      <div class="row"><span>PARTICLES</span><span class="v" id="particleCount">500</span></div>
      <input type="range" id="particleSlider" min="10" max="1000" value="500">
    </div>
    <div class="field">
      <div class="row"><span>SPAWN</span><span class="v" id="spawnAmountValue">5</span></div>
      <input type="range" id="spawnAmountSlider" min="1" max="30" value="5">
    </div>
    <div class="field">
      <div class="row"><span>SPEED</span><span class="v" id="speedValue">1.0</span></div>
      <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1.0">
    </div>
    <div class="field">
      <div class="row"><span>DIFFUSION</span><span class="v" id="diffusionValue">0.25</span></div>
      <input type="range" id="diffusionSlider" min="0.05" max="0.5" step="0.05" value="0.25">
    </div>
    <div class="field">
      <div class="row"><span>REACTION</span><span class="v" id="reactionValue">0.10</span></div>
      <input type="range" id="reactionSlider" min="0.01" max="0.9" step="0.01" value="0.1">
    </div>
    <div class="field">
      <div class="row"><span>DECAY</span><span class="v" id="decayValue">0.950</span></div>
      <input type="range" id="decaySlider" min="0.85" max="0.999" step="0.001" value="0.95">
    </div>
  </div>

  <div id="keys">
    <div><b>[DRAG]</b> SPAWN</div>
    <div><b>[SHIFT+DRAG]</b> ANTI</div>
    <div><b>[R]</b> RESET</div>
    <div><b>[H]</b> HIDE UI</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const gridResolution = 4;
    const gridWidth = Math.ceil(canvas.width / gridResolution);
    const gridHeight = Math.ceil(canvas.height / gridResolution);

    let gridA = Array(gridWidth * gridHeight).fill(0);
    let gridB = Array(gridWidth * gridHeight).fill(0);
    let gridA_next = Array(gridWidth * gridHeight).fill(0);
    let gridB_next = Array(gridWidth * gridHeight).fill(0);
    let params = {
      particleCount: 500,
      speed: 1.0,
      diffusionA: 0.16,
      diffusionB: 0.05,
      feedRate: 0.055,
      killRate: 0.062,
      decayRate: 0.999,
      speedMultiplier: 1.0,
      reactionRate: 0.10,
      spawnAmount: 5
    };
    // Track mouse state for continuous spawn
    let mouseDown = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let spawnIntervalId = null;

    class Particle {
      constructor(x, y, isAnti = false) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.angle = Math.random() * Math.PI * 2;
        this.isAnti = isAnti;
        this.trailSize = isAnti ? 0.5 : 1;
      }

      update() {
        const gridX = Math.floor(this.x / gridResolution);
        const gridY = Math.floor(this.y / gridResolution);

        const sensorDistance = 10 + (params.reactionRate * 25);
        let bestAngle = this.angle;
        let bestValue = -Infinity;

        for (let offset = -Math.PI / 4; offset <= Math.PI / 4; offset += Math.PI / 4) {
          const senseAngle = this.angle + offset;
          const sx = Math.floor((this.x + Math.cos(senseAngle) * sensorDistance) / gridResolution);
          const sy = Math.floor((this.y + Math.sin(senseAngle) * sensorDistance) / gridResolution);

          if (sx >= 0 && sx < gridWidth && sy >= 0 && sy < gridHeight) {
            const idx = sx + sy * gridWidth;
            let value = gridB[idx];

            if (this.isAnti) {
              value = -value;
              if (gridB[idx] > 0) {
                value -= gridB[idx] * params.reactionRate * 8;
              }
            } else {
              if (gridB[idx] < 0) {
                value -= (-gridB[idx]) * params.reactionRate * 8;
              }
            }

            if (value > bestValue) {
              bestValue = value;
              bestAngle = senseAngle;
            }
          }
        }

        const clusteringThreshold = params.reactionRate;

        if (bestValue > 0.001) {
          let steeringStrength;

          if (clusteringThreshold < 0.15) {
            steeringStrength = Math.min(0.15, Math.pow(bestValue, 2.5) * 1);
          } else if (clusteringThreshold < 0.35) {
            steeringStrength = Math.min(0.5, Math.pow(bestValue, 1.5) * 2.5);
          } else {
            steeringStrength = Math.min(0.8, Math.pow(bestValue, 1.3) * 4);
          }

          this.angle += (bestAngle - this.angle) * steeringStrength;
        } else {
          const wanderStrength = clusteringThreshold < 0.15 ? 0.8 : 0.3;
          this.angle += (Math.random() - 0.5) * wanderStrength;
        }

        this.x += Math.cos(this.angle) * params.speed * params.speedMultiplier;
        this.y += Math.sin(this.angle) * params.speed * params.speedMultiplier;
        if (this.x < 0) this.x += canvas.width;
        if (this.x >= canvas.width) this.x -= canvas.width;
        if (this.y < 0) this.y += canvas.height;
        if (this.y >= canvas.height) this.y -= canvas.height;
      }

      deposit() {
        const gridX = Math.floor(this.x / gridResolution);
        const gridY = Math.floor(this.y / gridResolution);

        if (gridX >= 0 && gridX < gridWidth && gridY >= 0 && gridY < gridHeight) {
          const idx = gridX + gridY * gridWidth;
          const currentTrail = gridB[idx];
          const depositAmount = this.isAnti ? -this.trailSize : this.trailSize;

          let consumedTrail = currentTrail;

          if ((this.isAnti && currentTrail > 0) || (!this.isAnti && currentTrail < 0)) {
            const consumptionRate = params.reactionRate * 2;
            const consumed = Math.abs(currentTrail) * consumptionRate;
            consumedTrail = currentTrail + Math.sign(depositAmount) * consumed;
          }

          const newTrail = consumedTrail + depositAmount * 0.5;
          gridB[idx] = Math.max(-1, Math.min(1, newTrail));
        }
      }

      // Square 3px blocks in the two chemistry colours - no antialiased
      // circles, no rainbow hues, so the particles read as part of the
      // same pixel grid the trails are drawn on.
      draw() {
        ctx.fillStyle = this.isAnti ? 'rgba(255, 120, 210, 0.85)' : 'rgba(150, 250, 255, 0.9)';
        ctx.fillRect(Math.floor(this.x) - 1, Math.floor(this.y) - 1, 3, 3);
      }
    }

    let particles = [];

    function initializeParticles() {
      particles = [];
      for (let i = 0; i < params.particleCount; i++) {
        particles.push(new Particle(
          Math.random() * canvas.width,
          Math.random() * canvas.height,
          Math.random() < 0.45
        ));
      }
    }

    function diffuseGrid() {
      for (let y = 1; y < gridHeight - 1; y++) {
        for (let x = 1; x < gridWidth - 1; x++) {
          const idx = x + y * gridWidth;

          const b = gridB[idx];
          const bNeighbors =
            gridB[(x - 1) + y * gridWidth] +
            gridB[(x + 1) + y * gridWidth] +
            gridB[x + (y - 1) * gridWidth] +
            gridB[x + (y + 1) * gridWidth];

          gridB_next[idx] = b + (bNeighbors / 4 - b) * params.diffusionB;
        }
      }

      [gridB, gridB_next] = [gridB_next, gridB];
    }

    function computeReaction() {
      for (let i = 0; i < gridB.length; i++) {
        gridB[i] *= params.decayRate;
      }
    }

    function updateSimulation() {
      for (let p of particles) {
        p.update();
        p.deposit();
      }

      diffuseGrid();
      computeReaction();
    }

    function render() {
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      const data = imageData.data;
      for (let y = 0; y < gridHeight; y++) {
        for (let x = 0; x < gridWidth; x++) {
          const idx = x + y * gridWidth;
          const b = gridB[idx];
          let r = 0, g = 0, bl = 0;
          // No brightness floor on either channel - a floor on the positive
          // side used to wash the whole field green, since diffusion leaves
          // a trace of B almost everywhere. Both ramps now fall to black.
          if (b > 0) {
            r = Math.floor(b * 70);
            g = Math.floor(b * 205);
            bl = Math.floor(b * 255);
          } else if (b < 0) {
            r = Math.floor(-b * 255);
            g = Math.floor(-b * 80);
            bl = Math.floor(-b * 195);
          }
          for (let dy = 0; dy < gridResolution; dy++) {
            for (let dx = 0; dx < gridResolution; dx++) {
              const px = x * gridResolution + dx;
              const py = y * gridResolution + dy;
              const pixelIdx = (py * canvas.width + px) * 4;
              if (pixelIdx >= 0 && pixelIdx < data.length) {
                data[pixelIdx] = r;
                data[pixelIdx + 1] = g;
                data[pixelIdx + 2] = bl;
                data[pixelIdx + 3] = 255;
              }
            }
          }
        }
      }
      ctx.putImageData(imageData, 0, 0);
      for (let p of particles) {
        p.draw();
      }
    }

    // Animation loop
    function animate() {
      updateSimulation();
      render();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const newGridWidth = Math.ceil(canvas.width / gridResolution);
      const newGridHeight = Math.ceil(canvas.height / gridResolution);

      if (newGridWidth !== gridWidth || newGridHeight !== gridHeight) {
        window.location.reload();
      }
    });

    function spawnParticlesAt(x, y, amount, isAnti) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 20;
        particles.push(new Particle(
          x + Math.cos(angle) * dist,
          y + Math.sin(angle) * dist,
          isAnti
        ));
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      mouseDown = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      spawnParticlesAt(e.clientX, e.clientY, params.spawnAmount, e.shiftKey);
      // Start interval for continuous spawn
      if (spawnIntervalId) clearInterval(spawnIntervalId);
      spawnIntervalId = setInterval(() => {
        if (mouseDown) {
          spawnParticlesAt(lastMouseX, lastMouseY, params.spawnAmount, e.shiftKey);
        }
      }, 60); // ~16 FPS
    });

    canvas.addEventListener('mouseup', () => {
      mouseDown = false;
      if (spawnIntervalId) clearInterval(spawnIntervalId);
    });

    canvas.addEventListener('mouseleave', () => {
      mouseDown = false;
      if (spawnIntervalId) clearInterval(spawnIntervalId);
    });

    canvas.addEventListener('mousemove', (e) => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (e.buttons & 1) {
        spawnParticlesAt(e.clientX, e.clientY, params.spawnAmount, e.shiftKey);
      }
      if (e.buttons & 2) {
        spawnParticlesAt(e.clientX, e.clientY, params.spawnAmount, true);
      }
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      spawnParticlesAt(e.clientX, e.clientY, params.spawnAmount, true);
    });

    // ── slider wiring ──────────────────────────
    // Each track paints its own fill, so the bar doubles as a readout
    // without any extra chrome.
    function paintTrack(el) {
      const min = parseFloat(el.min), max = parseFloat(el.max);
      const pct = ((parseFloat(el.value) - min) / (max - min)) * 100;
      el.style.background =
        `linear-gradient(to right, var(--c-mid) 0 ${pct}%, var(--c-faint) ${pct}% 100%)`;
    }

    function bindSlider(id, readoutId, format, apply) {
      const el = document.getElementById(id);
      const out = document.getElementById(readoutId);
      const sync = () => {
        const v = parseFloat(el.value);
        out.textContent = format(v);
        apply(v);
        paintTrack(el);
      };
      el.addEventListener('input', sync);
      return sync;
    }

    bindSlider('particleSlider', 'particleCount',
      v => String(v),
      (v) => {
        const newCount = Math.round(v);
        const oldCount = particles.length;
        if (newCount > oldCount) {
          for (let i = 0; i < newCount - oldCount; i++) {
            particles.push(new Particle(
              Math.random() * canvas.width,
              Math.random() * canvas.height,
              Math.random() < 0.25
            ));
          }
        } else if (newCount < oldCount) {
          particles = particles.slice(0, newCount);
        }
        params.particleCount = newCount;
      });

    const syncSpawn = bindSlider('spawnAmountSlider', 'spawnAmountValue',
      v => String(v), v => { params.spawnAmount = Math.round(v); });

    const syncSpeed = bindSlider('speedSlider', 'speedValue',
      v => v.toFixed(1), v => { params.speedMultiplier = v; });

    const syncDiffusion = bindSlider('diffusionSlider', 'diffusionValue',
      v => v.toFixed(2), v => { params.diffusionB = v; });

    const syncReaction = bindSlider('reactionSlider', 'reactionValue',
      v => v.toFixed(2), v => { params.reactionRate = v; });

    const syncDecay = bindSlider('decaySlider', 'decayValue',
      v => v.toFixed(3), v => { params.decayRate = v; });

    function resetSimulation() {
      gridA.fill(0);
      gridB.fill(0);
      particles = [];
      initializeParticles();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') resetSimulation();
      if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('ui-hidden');
    });

    function initializeControls() {
      const defaults = {
        particleSlider: 500,
        spawnAmountSlider: 5,
        speedSlider: 1.0,
        diffusionSlider: 0.25,
        reactionSlider: 0.10,
        decaySlider: 0.950
      };
      for (const [id, value] of Object.entries(defaults)) {
        document.getElementById(id).value = value;
      }
      // particleCount is applied by initializeParticles(), not the slider sync
      params.particleCount = 500;
      syncSpawn(); syncSpeed(); syncDiffusion(); syncReaction(); syncDecay();
      paintTrack(document.getElementById('particleSlider'));
      document.getElementById('particleCount').textContent = 500;
    }

    initializeControls();
    initializeParticles();

    animate();
  </script>
<script defer src="/_vercel/insights/script.js"></script>
</body>

</html>

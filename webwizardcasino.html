    <script>
        // Unified wavy animation for 'Processing...' and ellipses
        function animateProgressLabel() {
            const label = document.getElementById('progressLabel');
            if (!label) return;
            const baseText = 'Processing';
            let ellipsisIndex = 0;
            let time = 0;
            function render() {
                // Build full text with ellipses
                const fullText = baseText + '.'.repeat(ellipsisIndex);
                label.innerHTML = fullText.split('').map((char, i) => {
                    // Unified sine wave for all characters
                    const offset = Math.sin((time/8) + i * 0.35) * 7;
                    return `<span style="display:inline-block;transform:translateY(${offset}px);transition:transform 0.1s;">${char}</span>`;
                }).join('');
            }
            render();
            setInterval(() => {
                time++;
                render();
            }, 60);
            setInterval(() => {
                ellipsisIndex = (ellipsisIndex + 1) % 4;
                render();
            }, 400);
        }
        document.addEventListener('DOMContentLoaded', animateProgressLabel);
        let consoleCommands = [];
        let consoleCommandsLoaded = false;
        (async () => {
            try {
                const response = await fetch('/casino-assets/console-commands.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}: Failed to load console-commands.json`);
                const data = await response.json();
                consoleCommands = Array.isArray(data.commands) ? data.commands : [];
                consoleCommandsLoaded = true;
                console.log('✓ Console commands loaded successfully');
            } catch (error) {
                console.error('✗ Error loading console-commands.json:', error);
            }
        })();

        // API endpoints - uses Vercel serverless functions
        const RANDOM_WORDS_ENDPOINT = '/api/random-words.js';
        const GENERATE_ENDPOINT = '/api/generate.js';

        // Shuffle message array for randomization
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        let currentGeneration = {
            theme: '',
            code: ''
        };
        let isGenerating = false;
        let hasContent = false;
        let currentIframe = null;
        let consoleCommandInterval = null;
        let displayedGenerationId = 0;
        let previewStartedAt = 0;
        let previewCanAutoRepair = true;

        window.addEventListener('message', (event) => {
            if (event.data?.type !== 'web-wizard-runtime-error'
                || !currentIframe
                || event.source !== currentIframe.contentWindow) return;
            const message = String(event.data.message || 'unknown script error').slice(0, 4000);
            console.error('Generated site runtime error:', message);
            if (previewCanAutoRepair && Date.now() - previewStartedAt <= 2000 && !isGenerating) {
                previewCanAutoRepair = false;
                showErrorToast('Site error found. Trying an automatic repair...');
                void generateWebsite(`Fix this startup error without changing the experience: ${message}`, true);
            } else {
                showErrorToast('Runtime error: ' + message);
            }
        });

        function pauseCurrentSite() {
            if (!currentIframe) return;
            try { currentIframe.contentWindow.noLoop(); } catch(e) {}
            currentIframe.style.visibility = 'hidden';
        }

        function resumeCurrentSite() {
            if (!currentIframe) return;
            currentIframe.style.visibility = 'visible';
            try { currentIframe.contentWindow.loop(); } catch(e) {}
        }

        function updateThemeScreenClose() {
            const btn = document.getElementById('themeScreenClose');
            if (btn) btn.style.display = hasContent ? 'flex' : 'none';
        }

        // Helper function to set regenerate button text with wave animation
        function setRegenerateButtonText(text) {
            const regenerateButton = document.getElementById('regenerateButton');
            if (text === 'generating...') {
                // Create wave animation with spans
                const chars = text.split('');
                regenerateButton.innerHTML = chars.map((char, index) => {
                    const delay = (index * 0.1) % 1.2;
                    return `<span class="button-wave-char" style="animation-delay: ${delay}s">${char}</span>`;
                }).join('');
                regenerateButton.disabled = false;
            } else {
                regenerateButton.textContent = text;
                regenerateButton.disabled = false;
            }
        }

        // Update progress bar
        function setProgressBar(percent) {
            const progressBar = document.querySelector('.progress-bar');
            if (progressBar) {
                progressBar.style.width = Math.max(0, Math.min(100, percent)) + '%';
                progressBar.style.animation = 'none'; // Stop the animation
            }
        }

        async function readGenerationStream(response, onProgress, onRetry) {
            if (!response.body) throw new Error('Streaming is unavailable in this browser.');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let html = '';
            let completed = false;

            const handleFrame = (frame) => {
                const data = frame.split(/\r?\n/)
                    .filter(line => line.startsWith('data:'))
                    .map(line => line.slice(5).trimStart())
                    .join('\n');
                if (!data) return;

                const event = JSON.parse(data);
                if (event.type === 'chunk') {
                    html += event.text || '';
                    onProgress(html.length);
                } else if (event.type === 'retry') {
                    html = '';
                    onProgress(0);
                    onRetry?.();
                } else if (event.type === 'error') {
                    throw new Error(event.message || 'Generation failed.');
                } else if (event.type === 'done') {
                    if (typeof event.html === 'string') html = event.html;
                    completed = true;
                }
            };

            while (true) {
                const { value, done } = await reader.read();
                buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                let boundary;
                while ((boundary = buffer.search(/\r?\n\r?\n/)) !== -1) {
                    const frame = buffer.slice(0, boundary);
                    const delimiter = buffer.slice(boundary).match(/^\r?\n\r?\n/)[0];
                    buffer = buffer.slice(boundary + delimiter.length);
                    handleFrame(frame);
                }
                if (done) break;
            }

            if (buffer.trim()) handleFrame(buffer);
            if (!completed || !html) throw new Error('The generation stream ended before the site was complete.');
            return html;
        }

        // Random console messages for loading (loaded from /casino-assets/console-commands.json)

        let currentTypingInterval = null; // Track active typing animation

        function typeText(element, text, speed = 60) {
            return new Promise((resolve) => {
                // Cancel any existing typing animation on this element
                if (currentTypingInterval !== null) {
                    clearInterval(currentTypingInterval);
                    currentTypingInterval = null;
                }
                
                let i = 0;
                element.textContent = '';
                
                const interval = setInterval(() => {
                    if (i < text.length) {
                        element.textContent += text[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        currentTypingInterval = null;
                        resolve();
                    }
                }, speed);
                
                currentTypingInterval = interval;
            });
        }

        function typeConsoleCommand(text, type = 'normal', speed = 30) {
            return new Promise((resolve) => {
                const consoleOutput = document.getElementById('consoleOutput');
                if (!consoleOutput) {
                    resolve();
                    return;
                }
                
                const line = document.createElement('div');
                line.className = 'console-line';
                if (type !== 'normal') line.classList.add(type);
                
                consoleOutput.appendChild(line);
                
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        line.textContent += text[i];
                        i++;
                    } else {
                        clearInterval(interval);
                        
                        // Remove old lines if too many (keep last 5 lines)
                        const lines = consoleOutput.querySelectorAll('.console-line');
                        if (lines.length > 5) {
                            lines[0].classList.add('fading');
                            setTimeout(() => {
                                if (lines[0].parentNode) {
                                    lines[0].remove();
                                }
                            }, 600);
                        }
                        resolve();
                    }
                }, speed);
            });
        }

        function addConsoleCommand(text, type = 'normal') {
            // Just add text without typing - used for status updates
            const consoleOutput = document.getElementById('consoleOutput');
            if (!consoleOutput) return;
            
            const line = document.createElement('div');
            line.className = 'console-line';
            if (type !== 'normal') line.classList.add(type);
            line.textContent = text;
            
            consoleOutput.appendChild(line);
            
            // Remove old lines if too many (keep last 6 lines)
            const lines = consoleOutput.querySelectorAll('.console-line');
            if (lines.length > 6) {
                lines[0].classList.add('fading');
                setTimeout(() => {
                    if (lines[0].parentNode) {
                        lines[0].remove();
                    }
                }, 600);
            }
        }

        function disableGeneratedContextMenu(container, iframe = null) {
            if (!container) return;

            if (!container.dataset.contextMenuDisabled) {
                container.addEventListener('contextmenu', (event) => event.preventDefault());
                container.dataset.contextMenuDisabled = 'true';
            }

            if (iframe) {
                try {
                    const doc = iframe.contentDocument;
                    if (doc) {
                        doc.addEventListener('contextmenu', (event) => event.preventDefault());
                        if (doc.body) {
                            doc.body.addEventListener('contextmenu', (event) => event.preventDefault());
                        }
                    }
                } catch (error) {
                    // Sandboxed generated pages have an opaque origin.
                }
            }
        }

        function startConsoleCommands() {
            stopConsoleCommands(); // Ensure no previous interval is running
            // Clear console output before starting new commands
            const consoleOutput = document.getElementById('consoleOutput');
            if (consoleOutput) {
                consoleOutput.innerHTML = '';
            }
            let lastCommand = null;
            // Add initial commands with typing animation
            (async () => {
                await typeConsoleCommand('System initialized', 'status', 30);
                await new Promise(r => setTimeout(r, 500));
                await typeConsoleCommand('Connecting to AI engine...', 'normal', 30);
                // Continue with random commands (no fake "Connection established" here)
                consoleCommandInterval = setInterval(async () => {
                    if (!consoleCommandsLoaded || consoleCommands.length === 0) return;
                    let randomCommand;
                    let attempts = 0;
                    do {
                        randomCommand = consoleCommands[Math.floor(Math.random() * consoleCommands.length)];
                        attempts++;
                    } while (randomCommand === lastCommand && attempts < 10);
                    lastCommand = randomCommand;
                    await typeConsoleCommand(randomCommand, 'normal', 25);
                }, 4000);
            })();
        }

        function showErrorToast(message) {
            const toast = document.getElementById('errorToast');
            if (!toast) return;
            clearTimeout(toast._hideTimer);
            toast.textContent = message;
            toast.classList.add('visible');
            toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
        }

        function stopConsoleCommands() {
            if (consoleCommandInterval) {
                clearInterval(consoleCommandInterval);
                consoleCommandInterval = null;
            }
        }

        // Generic loading messages
        function getLoadingMessages() {
            return [
                "Generating creative code...",
                "Summoning digital muses...",
                "Drawing pixels from the void...",
                "Brewing up generative magic...",
                "Composing a new experience...",
                "Building your site...",
                "Unleashing creative chaos...",
                "Rendering the impossible...",
                "Inventing new patterns...",
                "Almost ready..."
            ];
        }

        // Get random theme from AI
        async function getRandomTheme() {
            const response = await fetch(RANDOM_WORDS_ENDPOINT, {});
            if (!response.ok) {
                throw new Error('Failed to fetch random theme');
            }
            const data = await response.json();
            return data.theme;
        }

        function setDisplayedGeneration(gen, allowAutoRepair = true) {
            const generationId = ++displayedGenerationId;
            displayedGeneration = gen;
            const container = document.getElementById('generatedContent');
            clearAndSandbox(container);
            container.style.display = 'block';
            const loadingOverlay = document.getElementById('loadingOverlay');
            // Hide overlay first, then inject site
            loadingOverlay.classList.add('hidden');
            setTimeout(() => {
                if (generationId !== displayedGenerationId) return;
                updateSaveButton();
                // Keep generated scripts inside an opaque-origin iframe so they cannot
                // navigate or rewrite the wizard itself.
                const iframe = document.createElement('iframe');
                iframe.style.cssText = 'width:100%;height:100%;border:none;background:#000;display:block;';
                iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-pointer-lock');
                container.appendChild(iframe);
                
                // Fail-safe polyfill script injected to prevent readyState / window.onload race conditions
                const polyfillScript = `<script>
(function() {
  const origAdd = window.addEventListener;
  window.addEventListener = function(type, listener, options) {
    if ((type === 'load' || type === 'DOMContentLoaded') && (document.readyState === 'complete' || document.readyState === 'interactive')) {
      setTimeout(function() { try { listener(); } catch(e) { console.error(e); } }, 5);
    } else {
      origAdd.call(window, type, listener, options);
    }
  };
})();
<\/script>`;

                const errorReporter = `<script>
function reportWizardError(message) {
  parent.postMessage({ type: 'web-wizard-runtime-error', message: String(message).slice(0, 4000) }, '*');
}
window.onerror = function(message, source, line, column, error) {
  reportWizardError((error && error.stack) || (message + ' (' + source + ':' + line + ':' + column + ')'));
  return false;
};
window.addEventListener('unhandledrejection', function(event) {
  var reason = event.reason;
  reportWizardError((reason && (reason.stack || reason.message)) || String(reason));
});
window.addEventListener('error', function(event) {
  if (event.target && event.target !== window) {
    var resource = event.target.src || event.target.href || event.target.tagName || 'resource';
    reportWizardError('Failed to load ' + resource);
  }
}, true);
<\/script>`;
                
                let codeToWrite = gen.code || '';
                if (!/<(?:!doctype\s+html|html\b)/i.test(codeToWrite)) {
                    codeToWrite = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}canvas{display:block;width:100%;height:100%;}</style>${polyfillScript}${errorReporter}</head><body>${codeToWrite}</body></html>`;
                } else if (/<head(?:\s[^>]*)?>/i.test(codeToWrite)) {
                    codeToWrite = codeToWrite.replace(/<head(?:\s[^>]*)?>/i, match => match + polyfillScript + errorReporter);
                } else {
                    codeToWrite = codeToWrite.replace(/<html(?:\s[^>]*)?>/i, match => match + '<head>' + polyfillScript + errorReporter + '</head>');
                }

                currentIframe = iframe;
                previewStartedAt = Date.now();
                previewCanAutoRepair = allowAutoRepair;
                iframe.srcdoc = codeToWrite;
                disableGeneratedContextMenu(container, iframe);
                hasContent = true;
                updateThemeScreenClose();
            }, 120); // Delay to ensure overlay is hidden first
        }
        
        // Utility to sandbox and clear preview or generated site
        function clearAndSandbox(container) {
            // Remove all child nodes and scripts
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            currentIframe = null;
            // Remove any lingering p5.js instances
            if (window.p5Instance) {
                window.p5Instance.remove();
                window.p5Instance = null;
            }
            // Remove all canvas elements from the document
            const canvases = document.querySelectorAll('canvas');
            canvases.forEach(canvas => {
                if (canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            });
        }



        // Call AI API to generate a site for a theme
        // editRequest: when set, revise currentGeneration instead of making a new site
        async function generateWebsite(editRequest = null, autoRepairPass = false) {
            if (isGenerating) return;
            const editSource = editRequest ? currentGeneration : null;

            const loadingOverlay = document.getElementById('loadingOverlay');
            const regenerateButton = document.getElementById('regenerateButton');
            const generatedContent = document.getElementById('generatedContent');
            const themeInput = document.getElementById('themeInput');
            const themeScreen = document.getElementById('themeScreen');
            const topBar = document.getElementById('topBar');
            // Require a theme - no silent random fallback
            if (!editRequest && !themeInput.value.trim()) {
                themeInput.classList.remove('input-error');
                void themeInput.offsetWidth; // force reflow to restart animation
                themeInput.classList.add('input-error');
                themeInput.addEventListener('animationend', () => themeInput.classList.remove('input-error'), { once: true });
                themeInput.focus();
                return;
            }
            // Hide theme screen, show loading overlay
            themeScreen.style.display = 'none';
            loadingOverlay.classList.remove('hidden');
            pauseCurrentSite();
            topBar.style.display = 'flex';
            document.getElementById('saveButton').style.display = 'none';
            document.getElementById('favoritesButton').style.display = 'none';
            document.getElementById('editButton').style.display = 'none';
            closeEditPanel();
            setRegenerateButtonText('generating...');
            regenerateButton.disabled = true;
            // ...existing code...
            generatedContent.innerHTML = '';
            isGenerating = true;
            wasLoadingWhenGenerated = true;
            setProgressBar(2);
            document.getElementById('consoleOutput').innerHTML = '';
            const currentMessage = document.getElementById('currentMessage');
            currentMessage.textContent = 'Connecting to the wizard...';
            let themeValue = editSource ? editSource.theme : themeInput.value.trim();
            const themeStatus = document.getElementById('themeStatus');
            themeStatus.textContent = editSource ? `${themeValue} → ${editRequest}` : themeValue;
            themeStatus.style.display = 'block';
            startConsoleCommands();
            if (window.p5Instance) {
                window.p5Instance.remove();
                window.p5Instance = null;
            }
            previousGeneration = null;
            backgroundGeneration = null;
            try {
                const response = await fetch(GENERATE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(editSource
                        ? { theme: themeValue, editRequest, currentHtml: editSource.code }
                        : { theme: themeValue })
                });
                if (!response.ok) {
                    let message = 'Failed to generate site';
                    try { message = (await response.json()).error || message; } catch {}
                    throw new Error(message);
                }
                addConsoleCommand('Connection established', 'status');
                const html = await readGenerationStream(response, (charactersReceived) => {
                    const progress = Math.min(94, 4 + 90 * (1 - Math.exp(-charactersReceived / 18000)));
                    setProgressBar(progress);
                    currentMessage.textContent = `${charactersReceived.toLocaleString()} characters received`;
                }, () => {
                    addConsoleCommand('First pass incomplete; trying a compact version', 'info');
                    currentMessage.textContent = 'The first pass was incomplete. Retrying...';
                });
                currentGeneration = {
                    theme: themeValue,
                    code: html
                };
                setProgressBar(100);
                currentMessage.textContent = 'Site ready';
                document.getElementById('themeStatus').style.display = 'none';
                setRegenerateButtonText('generate');
                regenerateButton.disabled = false;
                isGenerating = false;
                document.getElementById('favoritesButton').style.display = '';
                updateSaveButton();
                // Single canonical injection
                setDisplayedGeneration(currentGeneration, !autoRepairPass);
            } catch (error) {
                stopConsoleCommands();
                setProgressBar(0);
                addConsoleCommand('Error: ' + (error.message || 'connection failed'), 'error');
                document.getElementById('themeStatus').style.display = 'none';
                setRegenerateButtonText('generate');
                regenerateButton.disabled = false;
                isGenerating = false;
                document.getElementById('favoritesButton').style.display = '';
                // Return to theme screen after showing the error briefly
                setTimeout(() => {
                    if (editSource) {
                        // Edit failed: put the unedited site back
                        updateSaveButton();
                        setDisplayedGeneration(editSource, !autoRepairPass);
                        showErrorToast('edit failed');
                        return;
                    }
                    loadingOverlay.classList.add('hidden');
                    themeScreen.style.display = 'flex';
                    resumeCurrentSite();
                    showErrorToast("couldn't connect");
                }, 2500);
            }
        }

        // ── Favorites ────────────────────────────────────────────
        const FAV_KEY = 'wwc-favorites';
        const MAX_FAVS = 30;

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
            catch { return []; }
        }

        function saveFavorites(arr) {
            localStorage.setItem(FAV_KEY, JSON.stringify(arr));
        }

        function formatRelDate(iso) {
            const diff = Date.now() - new Date(iso).getTime();
            if (diff < 60000)      return 'just now';
            if (diff < 3600000)    return Math.floor(diff / 60000) + 'm ago';
            if (diff < 86400000)   return Math.floor(diff / 3600000) + 'h ago';
            return Math.floor(diff / 86400000) + 'd ago';
        }

        function isCurrentSaved() {
            if (!currentGeneration.code) return false;
            return getFavorites().some(f => f.code === currentGeneration.code);
        }

        function updateSaveButton() {
            const btn = document.getElementById('saveButton');
            if (!btn) return;
            const hasSite = !!currentGeneration.code;
            btn.style.display = hasSite ? 'flex' : 'none';
            document.getElementById('editButton').style.display = hasSite ? 'flex' : 'none';
            if (hasSite) {
                const saved = isCurrentSaved();
                btn.textContent = saved ? '✓ saved' : '★ save';
                btn.classList.toggle('is-saved', saved);
            }
        }

        function renderFavorites() {
            const favs = getFavorites();
            const list = document.getElementById('favoritesList');
            const empty = document.getElementById('favoritesEmpty');
            const favBtn = document.getElementById('favoritesButton');
            if (!list) return;

            favBtn.textContent = favs.length > 0 ? `saved (${favs.length})` : 'saved';
            favBtn.classList.toggle('has-items', favs.length > 0);

            list.querySelectorAll('.fav-item').forEach(el => el.remove());
            empty.style.display = favs.length === 0 ? 'block' : 'none';

            [...favs].reverse().forEach(fav => {
                const item = document.createElement('div');
                item.className = 'fav-item';
                item.innerHTML = `
                    <div class="fav-meta">
                        <span class="fav-theme" title="${fav.theme.replace(/"/g,'&quot;')}">${fav.theme}</span>
                        <span class="fav-date">${formatRelDate(fav.savedAt)}</span>
                    </div>
                    <button class="fav-btn load-btn">load</button>
                    <button class="fav-btn delete-btn">×</button>
                `;
                item.querySelector('.load-btn').addEventListener('click', () => loadFavorite(fav));
                item.querySelector('.delete-btn').addEventListener('click', () => deleteFavorite(fav.id));
                list.appendChild(item);
            });
        }

        function toggleSaveCurrent() {
            if (!currentGeneration.code) return;
            if (isCurrentSaved()) {
                saveFavorites(getFavorites().filter(f => f.code !== currentGeneration.code));
                renderFavorites();
                updateSaveButton();
            } else {
                addToFavorites();
            }
        }

        function addToFavorites() {
            if (!currentGeneration.code || isCurrentSaved()) return;
            const favs = getFavorites();
            if (favs.length >= MAX_FAVS) favs.shift();
            favs.push({ id: Date.now().toString(), theme: currentGeneration.theme, code: currentGeneration.code, savedAt: new Date().toISOString() });
            saveFavorites(favs);
            renderFavorites();
            updateSaveButton();
        }

        function deleteFavorite(id) {
            saveFavorites(getFavorites().filter(f => f.id !== id));
            renderFavorites();
            updateSaveButton();
        }

        function loadFavorite(fav) {
            closeFavoritesPanel();
            currentGeneration = { theme: fav.theme, code: fav.code };
            document.getElementById('themeScreen').style.display = 'none';
            document.getElementById('topBar').style.display = 'flex';
            setDisplayedGeneration(currentGeneration);
        }

        function toggleFavoritesPanel() {
            const panel = document.getElementById('favoritesPanel');
            if (panel.classList.contains('open')) {
                closeFavoritesPanel();
            } else {
                renderFavorites();
                panel.classList.add('open');
                document.getElementById('favoritesButton').classList.add('panel-open');
            }
        }

        function closeFavoritesPanel() {
            document.getElementById('favoritesPanel').classList.remove('open');
            document.getElementById('favoritesButton').classList.remove('panel-open');
        }
        // ─────────────────────────────────────────────────────────

        function toggleEditPanel() {
            const panel = document.getElementById('editPanel');
            if (panel.classList.contains('open')) return closeEditPanel();
            closeFavoritesPanel();
            panel.classList.add('open');
            document.getElementById('editButton').classList.add('panel-open');
            document.getElementById('editInput').focus();
        }

        function closeEditPanel() {
            document.getElementById('editPanel').classList.remove('open');
            document.getElementById('editButton').classList.remove('panel-open');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const regenerateButton = document.getElementById('regenerateButton');
            const randomThemeButton = document.getElementById('randomThemeButton');
            const themeInput = document.getElementById('themeInput');
            const themeScreen = document.getElementById('themeScreen');
            const startGenerationButton = document.getElementById('startGenerationButton');
            const topBar = document.getElementById('topBar');

            // Show theme screen initially, show top bar, hide loading overlay
            themeScreen.style.display = 'flex';
            topBar.style.display = 'flex';
            document.getElementById('loadingOverlay').classList.add('hidden');

            regenerateButton.addEventListener('click', () => {
                const themeScreen = document.getElementById('themeScreen');
                if (isGenerating) {
                    // During generation: show the loading overlay, hide theme screen
                    document.getElementById('loadingOverlay').classList.remove('hidden');
                    themeScreen.style.display = 'none';
                } else if (themeScreen.style.display === 'flex') {
                    // Overlay is open - only dismiss if a site exists
                    if (hasContent) {
                        themeScreen.style.display = 'none';
                        resumeCurrentSite();
                    }
                    // else: first visit, cannot dismiss
                } else {
                    // Overlay is closed - open it (do NOT clear generatedContent)
                    themeScreen.style.display = 'flex';
                    pauseCurrentSite();
                }
            });
            document.getElementById('saveButton').addEventListener('click', toggleSaveCurrent);
            document.getElementById('favoritesButton').addEventListener('click', () => { closeEditPanel(); toggleFavoritesPanel(); });
            document.getElementById('editButton').addEventListener('click', toggleEditPanel);
            const editInput = document.getElementById('editInput');
            editInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('editForm').requestSubmit(); }
                if (e.key === 'Escape') closeEditPanel();
            });
            document.getElementById('editForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const request = editInput.value.trim();
                if (!request || !currentGeneration.code) return editInput.focus();
                editInput.value = '';
                generateWebsite(request);
            });
            document.addEventListener('click', (e) => {
                const panel = document.getElementById('favoritesPanel');
                const btn = document.getElementById('favoritesButton');
                if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
                    closeFavoritesPanel();
                }
                const editPanel = document.getElementById('editPanel');
                if (editPanel.classList.contains('open') && !editPanel.contains(e.target)
                    && !document.getElementById('editButton').contains(e.target)) {
                    closeEditPanel();
                }
            });
            renderFavorites();
            updateSaveButton();

            // Global error handler for generated content (registered once)
            window.addEventListener('error', function(event) {
                const container = document.getElementById('generatedContent');
                if (!container) return;
                if (event.target instanceof Node && container.contains(event.target)) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'error-overlay';
                    errorDiv.textContent = 'Site error: ' + event.message;
                    container.appendChild(errorDiv);
                }
            });

            document.getElementById('themeScreenClose').addEventListener('click', () => {
                document.getElementById('themeScreen').style.display = 'none';
                resumeCurrentSite();
            });

            randomThemeButton.addEventListener('click', async () => {
                topBar.style.display = 'flex'; // Always show topBar when themeScreen is visible
                setRegenerateButtonText('generate');
                regenerateButton.disabled = false;
                randomThemeButton.disabled = true;
                randomThemeButton.textContent = '...';
                try {
                    const theme = await getRandomTheme();
                    themeInput.value = theme;
                } catch (e) {
                    themeInput.value = 'nothing found';
                }
                randomThemeButton.disabled = false;
                randomThemeButton.textContent = 'random';
                topBar.style.display = 'flex'; // Always show topBar when themeScreen is visible
            });
            startGenerationButton.addEventListener('click', () => {
                setRegenerateButtonText('generate');
                regenerateButton.disabled = false;
                generateWebsite();
            });
        });
    </script>
<script defer src="/_vercel/insights/script.js"></script>
</body>

</html>

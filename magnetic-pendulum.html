  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; }
    @font-face { font-family: 'w95'; src: url('w95font.woff') format('woff'); }
    #magnet-count {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      font-family: 'w95', monospace;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      user-select: none;
    }
    #magnet-count span { padding: 0 8px; }
    #magnet-count button {
      font: inherit;
      width: 30px;
      height: 28px;
      background: rgba(255, 255, 255, 0.06);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 3px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #magnet-count button:disabled { opacity: 0.3; cursor: default; }
    @media (hover: hover) {
      #magnet-count button:not(:disabled):hover { background: rgba(255, 255, 255, 0.16); }
    }
  </style>

<body>

<a href="index.html"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.2)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.2)'">
  <img src="/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>

<div id="magnet-count" title="sets the number of magnets and lays them out evenly">
  <button id="fewer" aria-label="fewer magnets">&minus;</button>
  <span id="count-label">3 magnets</span>
  <button id="more" aria-label="more magnets">+</button>
</div>

<!-- Worker source: not executed by the browser, grabbed as text to create a Blob URL -->
<script id="worker-src" type="javascript/worker">
onmessage = function(e) {
  const { cols, rows, canvasW, canvasH, pixelSize, simScale,
          mx, hOffSq, kR, fri, dt, dtH, dt6, maxSteps, sspSq, srSq,
          cellStart, cellEnd } = e.data;
  const n = mx.length >> 1;   // magnets, as x0,y0,x1,y1,...
  const halfW=canvasW*0.5, halfH=canvasH*0.5;
  const half=Math.min(halfW, halfH);   // one scale for both axes, so nothing squishes
  const BATCH = 1000;
  let buf = new Int32Array(BATCH * 2);
  let bc=0, bStart=cellStart;

  for (let i = cellStart; i < cellEnd; i++) {
    const col = i % cols;
    const row = (i - col) / cols;
    const px  = col*pixelSize + pixelSize*0.5;
    const py  = row*pixelSize + pixelSize*0.5;
    const sx  =  (px - halfW) / half * simScale;
    const sy  = -((py - halfH) / half) * simScale;

    let x=sx, y=sy, vx=0, vy=0, dx, dy, r2, mag=-1, st=maxSteps;
    sim: for (let s = 0; s < maxSteps; s++) {
      // k1 - force at current state
      let ax0=-kR*x-fri*vx, ay0=-kR*y-fri*vy;
      for (let k = 0; k < n; k++) {
        dx=mx[2*k]-x; dy=mx[2*k+1]-y; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax0+=dx/r2; ay0+=dy/r2;
      }
      // k2 - force at midpoint (RK2 midpoint method - half the sqrt calls of RK4)
      const x2=x+dtH*vx, y2=y+dtH*vy, vx2=vx+dtH*ax0, vy2=vy+dtH*ay0;
      let ax2=-kR*x2-fri*vx2, ay2=-kR*y2-fri*vy2;
      for (let k = 0; k < n; k++) {
        dx=mx[2*k]-x2; dy=mx[2*k+1]-y2; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax2+=dx/r2; ay2+=dy/r2;
      }
      // advance full step using midpoint slope
      x+=dt*vx2; y+=dt*vy2; vx+=dt*ax2; vy+=dt*ay2;
      // settle check (squared, no sqrt)
      if (vx*vx+vy*vy < sspSq) {
        for (let k = 0; k < n; k++) {
          dx=x-mx[2*k]; dy=y-mx[2*k+1]; if(dx*dx+dy*dy<srSq){mag=k;st=s+1;break sim;}
        }
      }
    }

    buf[bc*2]=mag; buf[bc*2+1]=st; bc++;
    if (bc === BATCH) {
      postMessage({ type:'batch', start:bStart, data:buf }, [buf.buffer]);
      buf = new Int32Array(BATCH * 2);
      bStart=i+1; bc=0;
    }
  }
  if (bc > 0) {
    const tail = buf.slice(0, bc*2);
    postMessage({ type:'batch', start:bStart, data:tail }, [tail.buffer]);
  }
  postMessage({ type:'done' });
};
</script>

<script>
let fractalgfx;
let dragIdx = -1;
let workers = [];
let workerBlobURL = null;
let currentCols, currentRows, currentPixelSize;
let pendingRestart = false;
let workersDone = 0, workersTotal = 0, workersDoneCallback = null;
let hintAlpha = 100;
let currentHues = [];   // magnet colours as of the running render
const NUM_WORKERS = navigator.hardwareConcurrency || 4;

const PIXEL_SIZE       = 6;
const PIXEL_COARSE     = 16;
const SIM_SCALE        = 3.0;
const H_OFFSET         = 0.4;
const K_RESTORE        = 0.5;
const FRICTION         = 0.25;
const DT               = 0.14;
const MAX_STEPS        = 2000;
const SETTLE_RADIUS    = 0.35;
const SETTLE_SPEED     = 0.02;
const GRAB_PX          = 56;   // large enough for fat fingers
// first three are the original red / cyan / yellow; the rest are picked to
// stay apart from them and each other
const MAGNET_HUES      = [0, 190, 50, 280, 120, 320, 220, 90];
const MIN_MAGNETS      = 2;
const MAX_MAGNETS      = MAGNET_HUES.length;
const H_OFFSET_SQ      = H_OFFSET * H_OFFSET;
const SETTLE_SPEED_SQ  = SETTLE_SPEED * SETTLE_SPEED;
const SETTLE_RADIUS_SQ = SETTLE_RADIUS * SETTLE_RADIUS;
const DT_HALF          = DT * 0.5;
const DT_SIXTH         = DT / 6.0;
const LOG_MAX          = Math.log(MAX_STEPS + 1);

// Each magnet keeps its own colour, so removing one doesn't repaint the rest
const MAGNETS = [];

// n magnets evenly round a circle, the first at the top. The circle grows
// with the count: packed tighter, the basins outside the ring shrink below
// a pixel and the picture turns to noise.
function arrangeMagnets(n) {
  MAGNETS.length = 0;
  const r = 1 + (n - 3) * 0.12;
  for (let k = 0; k < n; k++) {
    const a = Math.PI / 2 + k * 2 * Math.PI / n;
    MAGNETS.push({ x: r * Math.cos(a), y: r * Math.sin(a), hue: MAGNET_HUES[k] });
  }
  updateCountUI();
}

function freeHue() {
  return MAGNET_HUES.find(h => !MAGNETS.some(m => m.hue === h));
}

function updateCountUI() {
  const n = MAGNETS.length;
  document.getElementById('count-label').textContent = n + ' magnets';
  document.getElementById('fewer').disabled = n <= MIN_MAGNETS;
  document.getElementById('more').disabled = n >= MAX_MAGNETS;
}

// The simulation spans ±SIM_SCALE across the shorter side of the screen and
// uses the same scale on both axes, so a tall phone shows more of the plane
// instead of squashing it.
function halfSpan() { return Math.min(width, height) / 2; }

function pixelToSim(px, py) {
  return {
    sx:  (px - width  / 2) / halfSpan() * SIM_SCALE,
    sy: -((py - height / 2) / halfSpan()) * SIM_SCALE
  };
}

function simToPixel(sx, sy) {
  return {
    px:  sx / SIM_SCALE * halfSpan() + width  / 2,
    py: -sy / SIM_SCALE * halfSpan() + height / 2
  };
}

function initWorkerBlob() {
  const src = document.getElementById('worker-src').textContent;
  workerBlobURL = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
}

function startWorkersAt(ps, callback) {
  for (const w of workers) w.terminate();
  workers = [];
  workersDone = 0;
  workersTotal = 0;
  workersDoneCallback = callback || null;
  if (!fractalgfx) return;
  currentPixelSize = ps;
  currentHues = MAGNETS.map(m => m.hue);
  currentCols = Math.ceil(width  / ps);
  currentRows = Math.ceil(height / ps);
  const totalCells = currentCols * currentRows;
  const chunkSize  = Math.ceil(totalCells / NUM_WORKERS);
  const baseJob = {
    cols: currentCols, rows: currentRows,
    canvasW: width,    canvasH: height,
    pixelSize: ps, simScale: SIM_SCALE,
    mx: MAGNETS.flatMap(m => [m.x, m.y]),
    hOffSq: H_OFFSET_SQ, kR: K_RESTORE, fri: FRICTION,
    dt: DT, dtH: DT_HALF, dt6: DT_SIXTH, maxSteps: MAX_STEPS,
    sspSq: SETTLE_SPEED_SQ, srSq: SETTLE_RADIUS_SQ
  };
  for (let wi = 0; wi < NUM_WORKERS; wi++) {
    const cellStart = wi * chunkSize;
    if (cellStart >= totalCells) break;
    const w = new Worker(workerBlobURL);
    w.onmessage = handleWorkerMessage;
    w.postMessage({ ...baseJob, cellStart, cellEnd: Math.min(cellStart + chunkSize, totalCells) });
    workers.push(w);
    workersTotal++;
  }
}

function startWorkers() {
  startWorkersAt(PIXEL_COARSE, () => startWorkersAt(PIXEL_SIZE));
}

function handleWorkerMessage(e) {
  if (e.data.type === 'done') {
    workersDone++;
    if (workersDone === workersTotal && workersDoneCallback) {
      const cb = workersDoneCallback;
      workersDoneCallback = null;
      cb();
    }
    return;
  }
  if (e.data.type !== 'batch') return;
  const { start, data } = e.data;
  const count = data.length >> 1;
  const ps = currentPixelSize;
  fractalgfx.noStroke();
  for (let j = 0; j < count; j++) {
    const i   = start + j;
    const col = i % currentCols;
    const row = (i - col) / currentCols;
    const mag = data[j*2], st = data[j*2+1];
    if (mag >= 0) {
      fractalgfx.fill(currentHues[mag], 85, map(Math.log(st+1), 0, LOG_MAX, 100, 15));
    } else {
      fractalgfx.fill(0, 0, 5);
    }
    fractalgfx.rect(col * ps, row * ps, ps, ps);
  }
}

function scheduleWorker() {
  if (!pendingRestart) {
    pendingRestart = true;
    requestAnimationFrame(() => { pendingRestart = false; startWorkers(); });
  }
}

function drawMagnets() {
  noStroke();
  const pulse = sin(frameCount * 0.06) * 3;
  for (let m = 0; m < MAGNETS.length; m++) {
    const { px, py } = simToPixel(MAGNETS[m].x, MAGNETS[m].y);
    const grabbed = m === dragIdx;
    fill(MAGNETS[m].hue, 70, 100, grabbed ? 33 : 18);
    circle(px, py, (grabbed ? 56 : 38) + (grabbed ? 0 : pulse));
    fill(MAGNETS[m].hue, 50, 100, grabbed ? 95 : 72);
    circle(px, py, grabbed ? 22 : 15);
  }
}

function magnetAt(x, y) {
  let best = -1, bestD = GRAB_PX;
  for (let m = 0; m < MAGNETS.length; m++) {
    const { px, py } = simToPixel(MAGNETS[m].x, MAGNETS[m].y);
    const d = Math.hypot(x - px, y - py);
    if (d < bestD) { best = m; bestD = d; }
  }
  return best;
}

function addMagnet(x, y) {
  if (MAGNETS.length >= MAX_MAGNETS) return;
  const { sx, sy } = pixelToSim(x, y);
  MAGNETS.push({ x: sx, y: sy, hue: freeHue() });
  updateCountUI();
  scheduleWorker();
}

function removeMagnet(m) {
  if (m < 0 || MAGNETS.length <= MIN_MAGNETS) return;
  MAGNETS.splice(m, 1);
  updateCountUI();
  scheduleWorker();
}

// Mouse and touch alike: drag a magnet to move it, tap empty space to add
// one, hold a magnet still (touch) or right-click it to remove it.
let press = null;
function setupPointer(el) {
  const DRAG_START = 6;
  const HOLD_MS = 500;
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => {
    if (press) return;   // one finger at a time
    hintAlpha = 0;
    if (e.pointerType === 'mouse' && e.button === 2) { removeMagnet(magnetAt(e.clientX, e.clientY)); return; }
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    el.setPointerCapture(e.pointerId);
    const m = magnetAt(e.clientX, e.clientY);
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, magnet: m, moved: false, done: false };
    dragIdx = m;
    if (m >= 0 && e.pointerType !== 'mouse') {
      const p = press;
      p.timer = setTimeout(() => {
        if (press !== p || p.moved) return;
        p.done = true;
        dragIdx = -1;
        removeMagnet(p.magnet);
      }, HOLD_MS);
    }
  });
  el.addEventListener('pointermove', (e) => {
    if (!press || e.pointerId !== press.id || press.done) return;
    if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) < DRAG_START) return;
    press.moved = true;
    clearTimeout(press.timer);
    if (press.magnet < 0) return;
    const { sx, sy } = pixelToSim(e.clientX, e.clientY);
    MAGNETS[press.magnet].x = sx;
    MAGNETS[press.magnet].y = sy;
    scheduleWorker();
  });
  const release = (e, tap) => {
    if (!press || e.pointerId !== press.id) return;
    clearTimeout(press.timer);
    if (tap && !press.moved && !press.done && press.magnet < 0) addMagnet(press.x, press.y);
    press = null;
    dragIdx = -1;
  };
  el.addEventListener('pointerup', (e) => release(e, true));
  el.addEventListener('pointercancel', (e) => release(e, false));
}

function makeFractalGfx() {
  if (fractalgfx) fractalgfx.remove();
  fractalgfx = createGraphics(width, height);
  fractalgfx.colorMode(HSB, 360, 100, 100, 100);
  fractalgfx.pixelDensity(1);
  fractalgfx.noStroke();
  fractalgfx.background(0);
}

function setup() {
  const cnv = createCanvas(windowWidth, windowHeight);
  setupPointer(cnv.elt);
  arrangeMagnets(3);
  document.getElementById('fewer').addEventListener('click', () => {
    if (MAGNETS.length > MIN_MAGNETS) { arrangeMagnets(MAGNETS.length - 1); scheduleWorker(); }
  });
  document.getElementById('more').addEventListener('click', () => {
    if (MAGNETS.length < MAX_MAGNETS) { arrangeMagnets(MAGNETS.length + 1); scheduleWorker(); }
  });
  colorMode(HSB, 360, 100, 100, 100);
  pixelDensity(1);
  noStroke();
  frameRate(60);
  initWorkerBlob();
  makeFractalGfx();
  startWorkers();
}

function draw() {
  background(0);
  image(fractalgfx, 0, 0);
  drawMagnets();
  if (hintAlpha > 0) {
    noStroke();
    textAlign(CENTER, BOTTOM);
    textFont('w95');
    textSize(13);
    fill(0, 0, 100, hintAlpha);
    text(matchMedia('(pointer: coarse)').matches
      ? 'drag a magnet · tap to add · hold to remove'
      : 'drag a magnet · click to add one · right-click to remove', width / 2, height - 52);
    hintAlpha = max(0, hintAlpha - 0.25);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeFractalGfx();
  startWorkers();
}
</script>
</body>
</html>

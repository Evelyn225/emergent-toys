<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-16x16.png">
  <link rel="manifest" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/site.webmanifest">
  <title>Magnetic Pendulum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<a href="index.html"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         padding: 8px; background: rgba(0,0,0,0.8); color: white;
         border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
         text-decoration: none; font-family: sans-serif; font-size: 18px;
         transition: all 0.3s cubic-bezier(0.68,-0.55,0.265,1.55);
         line-height: 1; display: flex; align-items: center; justify-content: center;"
  onmouseover="this.style.transform='scale(1.2) rotate(5deg)';
               this.style.background='rgba(20,250,170,0.8)';
               this.style.borderColor='rgba(255,255,255,0.6)'"
  onmouseout="this.style.transform='scale(1) rotate(0deg)';
              this.style.background='rgba(0,0,0,0.8)';
              this.style.borderColor='rgba(255,255,255,0.3)'"
  onmousedown="this.style.transform='scale(0.9) rotate(-5deg)'"
  onmouseup="this.style.transform='scale(1.2) rotate(5deg)'">
  <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png"
       alt="home" style="width: 18px; height: 18px; object-fit: contain;">
</a>

<script>
let fractalgfx;
let grid = [];
let cols, rows, totalCells, renderIdx;

let trace = {
  state:         'IDLE',  // 'IDLE' | 'TRACING' | 'SETTLED' | 'FADING'
  x:             0,
  y:             0,
  vx:            0,
  vy:            0,
  trail:         [],      // array of { px, py }
  settledMagnet: -1,
  trailAlpha:    100,
  flashAmt:      0,       // 0..1, drives magnet glow pulse
  labelText:     '',
  labelPx:       0,
  labelPy:       0
};

// --- Physics constants ---
const PIXEL_SIZE      = 6;
const SIM_SCALE       = 3.0;
const H_OFFSET        = 0.4;
const STRENGTH        = 1.0;
const K_RESTORE       = 0.5;
const FRICTION        = 0.25;
const DT              = 0.05;
const MAX_STEPS       = 10000;
const SETTLE_RADIUS   = 0.3;
const SETTLE_SPEED    = 0.01;
const CELLS_PER_FRAME = 80;
const TRACE_STEPS_PER_FRAME = 30;
const FADE_RATE       = 0.8;
const MAGNET_HUES     = [0, 180, 50];  // red, cyan, gold

// Equilateral triangle, one vertex pointing up
// Angles: 90°, 210°, 330° at radius 1.0
const MAGNETS = [
  { x:  0.000,  y:  1.000 },  // top     - red
  { x: -0.866,  y: -0.500 },  // bot-left  - cyan
  { x:  0.866,  y: -0.500 }   // bot-right - gold
];

function pixelToSim(px, py) {
  return {
    sx:  (px - width  / 2) / (width  / 2) * SIM_SCALE,
    sy: -((py - height / 2) / (height / 2)) * SIM_SCALE
  };
}

function simToPixel(sx, sy) {
  return {
    px:  sx / SIM_SCALE * (width  / 2) + width  / 2,
    py: -sy / SIM_SCALE * (height / 2) + height / 2
  };
}

function acceleration(x, y, vx, vy) {
  let ax = 0, ay = 0;
  for (let m of MAGNETS) {
    const dx = m.x - x, dy = m.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy + H_OFFSET * H_OFFSET);
    const d3 = dist * dist * dist;
    ax += STRENGTH * dx / d3;
    ay += STRENGTH * dy / d3;
  }
  ax -= K_RESTORE * x;
  ay -= K_RESTORE * y;
  ax -= FRICTION * vx;
  ay -= FRICTION * vy;
  return { ax, ay };
}

function rk4Step(x, y, vx, vy) {
  const a1 = acceleration(x, y, vx, vy);
  const k1x = vx, k1y = vy, k1vx = a1.ax, k1vy = a1.ay;

  const x2  = x  + 0.5 * DT * k1x,  y2  = y  + 0.5 * DT * k1y;
  const vx2 = vx + 0.5 * DT * k1vx, vy2 = vy + 0.5 * DT * k1vy;
  const a2  = acceleration(x2, y2, vx2, vy2);
  const k2x = vx2, k2y = vy2, k2vx = a2.ax, k2vy = a2.ay;

  const x3  = x  + 0.5 * DT * k2x,  y3  = y  + 0.5 * DT * k2y;
  const vx3 = vx + 0.5 * DT * k2vx, vy3 = vy + 0.5 * DT * k2vy;
  const a3  = acceleration(x3, y3, vx3, vy3);
  const k3x = vx3, k3y = vy3, k3vx = a3.ax, k3vy = a3.ay;

  const x4  = x  + DT * k3x,  y4  = y  + DT * k3y;
  const vx4 = vx + DT * k3vx, vy4 = vy + DT * k3vy;
  const a4  = acceleration(x4, y4, vx4, vy4);
  const k4x = vx4, k4y = vy4, k4vx = a4.ax, k4vy = a4.ay;

  return {
    x:  x  + (DT / 6) * (k1x  + 2 * k2x  + 2 * k3x  + k4x),
    y:  y  + (DT / 6) * (k1y  + 2 * k2y  + 2 * k3y  + k4y),
    vx: vx + (DT / 6) * (k1vx + 2 * k2vx + 2 * k3vx + k4vx),
    vy: vy + (DT / 6) * (k1vy + 2 * k2vy + 2 * k3vy + k4vy)
  };
}

function simulateCell(sx, sy) {
  let x = sx, y = sy, vx = 0, vy = 0;
  for (let i = 0; i < MAX_STEPS; i++) {
    const r = rk4Step(x, y, vx, vy);
    x = r.x; y = r.y; vx = r.vx; vy = r.vy;
    const speed = Math.sqrt(vx * vx + vy * vy);
    if (speed < SETTLE_SPEED) {
      for (let m = 0; m < 3; m++) {
        const dx = x - MAGNETS[m].x, dy = y - MAGNETS[m].y;
        if (Math.sqrt(dx * dx + dy * dy) < SETTLE_RADIUS) {
          return { magnet: m, steps: i + 1 };
        }
      }
    }
  }
  return { magnet: null, steps: MAX_STEPS };
}

function drawMagnets(flashMagnet = -1, flashAmt = 0) {
  noStroke();
  for (let m = 0; m < 3; m++) {
    const { px, py } = simToPixel(MAGNETS[m].x, MAGNETS[m].y);
    const hue        = MAGNET_HUES[m];
    const isFlash    = m === flashMagnet;
    const baseAlpha  = 70;
    const alpha      = isFlash ? map(flashAmt, 0, 1, baseAlpha, 100) : baseAlpha;
    const glowSize   = isFlash ? map(flashAmt, 0, 1, 36, 60) : 36;
    const coreSize   = isFlash ? map(flashAmt, 0, 1, 14, 22) : 14;

    // outer glow ring
    fill(hue, 70, 100, alpha * 0.35);
    circle(px, py, glowSize);

    // inner core
    fill(hue, 50, 100, alpha);
    circle(px, py, coreSize);
  }
}

function mouseClicked() {
  const { sx, sy } = pixelToSim(mouseX, mouseY);
  trace.state         = 'TRACING';
  trace.x             = sx;
  trace.y             = sy;
  trace.vx            = 0;
  trace.vy            = 0;
  trace.trail         = [];
  trace.trailAlpha    = 100;
  trace.flashAmt      = 0;
  trace.settledMagnet = -1;
  trace.labelText     = '';
}

function updateTrace() {
  if (trace.state === 'IDLE') return;

  if (trace.state === 'TRACING') {
    for (let s = 0; s < TRACE_STEPS_PER_FRAME; s++) {
      const r = rk4Step(trace.x, trace.y, trace.vx, trace.vy);
      trace.x = r.x; trace.y = r.y; trace.vx = r.vx; trace.vy = r.vy;

      const { px, py } = simToPixel(trace.x, trace.y);
      trace.trail.push({ px, py });

      const speed = Math.sqrt(trace.vx * trace.vx + trace.vy * trace.vy);
      if (speed < SETTLE_SPEED) {
        for (let m = 0; m < 3; m++) {
          const dx = trace.x - MAGNETS[m].x, dy = trace.y - MAGNETS[m].y;
          if (Math.sqrt(dx * dx + dy * dy) < SETTLE_RADIUS) {
            trace.state         = 'SETTLED';
            trace.settledMagnet = m;
            trace.flashAmt      = 1;
            trace.labelText     = `magnet ${m + 1}`;
            trace.labelPx       = px;
            trace.labelPy       = py;
            break;
          }
        }
        if (trace.state === 'SETTLED') break;
      }

      if (trace.trail.length > 3000) { trace.state = 'FADING'; break; }
    }
  }

  if (trace.state === 'SETTLED') {
    trace.flashAmt -= 0.03;
    if (trace.flashAmt <= 0) {
      trace.flashAmt = 0;
      trace.state    = 'FADING';
    }
  }

  if (trace.state === 'FADING') {
    trace.trailAlpha -= FADE_RATE;
    if (trace.trailAlpha <= 0) {
      trace.state = 'IDLE';
      trace.trail = [];
      return;
    }
  }

  // Draw trail (white dots, opacity tapers toward head)
  noStroke();
  const n = trace.trail.length;
  for (let i = 0; i < n; i++) {
    const t  = trace.trail[i];
    const ta = trace.state === 'FADING' ? trace.trailAlpha : 100;
    fill(0, 0, 100, ta * (i / n));
    circle(t.px, t.py, 3);
  }

  // Draw label
  if (trace.labelText && trace.state !== 'IDLE') {
    const la = trace.state === 'FADING' ? trace.trailAlpha : 100;
    fill(0, 0, 100, la);
    noStroke();
    textFont('monospace');
    textSize(12);
    textAlign(LEFT, CENTER);
    text(trace.labelText, trace.labelPx + 14, trace.labelPy);
  }
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  pixelDensity(1);
  noStroke();
  frameRate(60);

  initGrid();
}

function initGrid() {
  if (fractalgfx) fractalgfx.remove();
  fractalgfx = createGraphics(width, height);
  fractalgfx.colorMode(HSB, 360, 100, 100, 100);
  fractalgfx.pixelDensity(1);
  fractalgfx.noStroke();
  fractalgfx.background(0);

  cols       = Math.ceil(width  / PIXEL_SIZE);
  rows       = Math.ceil(height / PIXEL_SIZE);
  totalCells = cols * rows;
  grid       = new Array(totalCells).fill(null);
  renderIdx  = 0;
}

function draw() {
  // Compute new cells into the fractal buffer
  if (renderIdx < totalCells) {
    const end = Math.min(renderIdx + CELLS_PER_FRAME, totalCells);
    for (let i = renderIdx; i < end; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const px  = col * PIXEL_SIZE + PIXEL_SIZE / 2;
      const py  = row * PIXEL_SIZE + PIXEL_SIZE / 2;
      const { sx, sy } = pixelToSim(px, py);
      const result = simulateCell(sx, sy);
      grid[i] = result;

      if (result.magnet !== null) {
        const brightness = map(result.steps, 0, MAX_STEPS, 100, 20);
        fractalgfx.fill(MAGNET_HUES[result.magnet], 90, brightness);
      } else {
        fractalgfx.fill(0, 0, 5);
      }
      fractalgfx.rect(col * PIXEL_SIZE, row * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
    }
    renderIdx = end;
  }

  // Stamp fractal buffer, then draw dynamic elements on top
  background(0);
  image(fractalgfx, 0, 0);
  drawMagnets(trace.settledMagnet, trace.flashAmt);
  updateTrace();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  initGrid();
  trace.state         = 'IDLE';
  trace.trail         = [];
  trace.settledMagnet = -1;
  trace.flashAmt      = 0;
}
</script>
</body>
</html>

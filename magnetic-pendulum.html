<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32"

  <link rel="icon" type="image/png" sizes="16x16"

  <title>Magnetic Pendulum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    @font-face { font-family: 'w95'; src: url('w95font.woff') format('woff'); }
  </style>
</head>
<body>

<a href="index.html"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.12)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.12)'">
  <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>

<!-- Worker source: not executed by the browser, grabbed as text to create a Blob URL -->
<script id="worker-src" type="javascript/worker">
onmessage = function(e) {
  const { cols, rows, canvasW, canvasH, pixelSize, simScale,
          mx, hOffSq, kR, fri, dt, dtH, dt6, maxSteps, sspSq, srSq,
          cellStart, cellEnd } = e.data;
  const m0x=mx[0],m0y=mx[1], m1x=mx[2],m1y=mx[3], m2x=mx[4],m2y=mx[5];
  const halfW=canvasW*0.5, halfH=canvasH*0.5;
  const BATCH = 1000;
  let buf = new Int32Array(BATCH * 2);
  let bc=0, bStart=cellStart;

  for (let i = cellStart; i < cellEnd; i++) {
    const col = i % cols;
    const row = (i - col) / cols;
    const px  = col*pixelSize + pixelSize*0.5;
    const py  = row*pixelSize + pixelSize*0.5;
    const sx  =  (px - halfW) / halfW * simScale;
    const sy  = -((py - halfH) / halfH) * simScale;

    let x=sx, y=sy, vx=0, vy=0, dx, dy, r2, mag=-1, st=maxSteps;
    sim: for (let s = 0; s < maxSteps; s++) {
      // k1 - force at current state
      dx=m0x-x; dy=m0y-y; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2);
      let ax0=dx/r2-kR*x-fri*vx, ay0=dy/r2-kR*y-fri*vy;
      dx=m1x-x; dy=m1y-y; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax0+=dx/r2; ay0+=dy/r2;
      dx=m2x-x; dy=m2y-y; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax0+=dx/r2; ay0+=dy/r2;
      // k2 - force at midpoint (RK2 midpoint method - half the sqrt calls of RK4)
      const x2=x+dtH*vx, y2=y+dtH*vy, vx2=vx+dtH*ax0, vy2=vy+dtH*ay0;
      dx=m0x-x2; dy=m0y-y2; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2);
      let ax2=dx/r2-kR*x2-fri*vx2, ay2=dy/r2-kR*y2-fri*vy2;
      dx=m1x-x2; dy=m1y-y2; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax2+=dx/r2; ay2+=dy/r2;
      dx=m2x-x2; dy=m2y-y2; r2=dx*dx+dy*dy+hOffSq; r2=r2*Math.sqrt(r2); ax2+=dx/r2; ay2+=dy/r2;
      // advance full step using midpoint slope
      x+=dt*vx2; y+=dt*vy2; vx+=dt*ax2; vy+=dt*ay2;
      // settle check (squared, no sqrt)
      if (vx*vx+vy*vy < sspSq) {
        dx=x-m0x; dy=y-m0y; if(dx*dx+dy*dy<srSq){mag=0;st=s+1;break sim;}
        dx=x-m1x; dy=y-m1y; if(dx*dx+dy*dy<srSq){mag=1;st=s+1;break sim;}
        dx=x-m2x; dy=y-m2y; if(dx*dx+dy*dy<srSq){mag=2;st=s+1;break sim;}
      }
    }

    buf[bc*2]=mag; buf[bc*2+1]=st; bc++;
    if (bc === BATCH) {
      postMessage({ type:'batch', start:bStart, data:buf }, [buf.buffer]);
      buf = new Int32Array(BATCH * 2);
      bStart=i+1; bc=0;
    }
  }
  if (bc > 0) {
    const tail = buf.slice(0, bc*2);
    postMessage({ type:'batch', start:bStart, data:tail }, [tail.buffer]);
  }
  postMessage({ type:'done' });
};
</script>

<script>
let fractalgfx;
let dragIdx = -1;
let workers = [];
let workerBlobURL = null;
let currentCols, currentRows, currentPixelSize;
let pendingRestart = false;
let workersDone = 0, workersTotal = 0, workersDoneCallback = null;
let hintAlpha = 100;
const NUM_WORKERS = navigator.hardwareConcurrency || 4;

const PIXEL_SIZE       = 6;
const PIXEL_COARSE     = 16;
const SIM_SCALE        = 3.0;
const H_OFFSET         = 0.4;
const K_RESTORE        = 0.5;
const FRICTION         = 0.25;
const DT               = 0.14;
const MAX_STEPS        = 2000;
const SETTLE_RADIUS    = 0.35;
const SETTLE_SPEED     = 0.02;
const GRAB_PX          = 56;   // large enough for fat fingers
const MAGNET_HUES      = [0, 190, 50];
const H_OFFSET_SQ      = H_OFFSET * H_OFFSET;
const SETTLE_SPEED_SQ  = SETTLE_SPEED * SETTLE_SPEED;
const SETTLE_RADIUS_SQ = SETTLE_RADIUS * SETTLE_RADIUS;
const DT_HALF          = DT * 0.5;
const DT_SIXTH         = DT / 6.0;
const LOG_MAX          = Math.log(MAX_STEPS + 1);

const MAGNETS = [
  { x:  0.000,  y:  1.000 },
  { x: -0.866,  y: -0.500 },
  { x:  0.866,  y: -0.500 }
];

function pixelToSim(px, py) {
  return {
    sx:  (px - width  / 2) / (width  / 2) * SIM_SCALE,
    sy: -((py - height / 2) / (height / 2)) * SIM_SCALE
  };
}

function simToPixel(sx, sy) {
  return {
    px:  sx / SIM_SCALE * (width  / 2) + width  / 2,
    py: -sy / SIM_SCALE * (height / 2) + height / 2
  };
}

function initWorkerBlob() {
  const src = document.getElementById('worker-src').textContent;
  workerBlobURL = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
}

function startWorkersAt(ps, callback) {
  for (const w of workers) w.terminate();
  workers = [];
  workersDone = 0;
  workersTotal = 0;
  workersDoneCallback = callback || null;
  if (!fractalgfx) return;
  currentPixelSize = ps;
  currentCols = Math.ceil(width  / ps);
  currentRows = Math.ceil(height / ps);
  const totalCells = currentCols * currentRows;
  const chunkSize  = Math.ceil(totalCells / NUM_WORKERS);
  const baseJob = {
    cols: currentCols, rows: currentRows,
    canvasW: width,    canvasH: height,
    pixelSize: ps, simScale: SIM_SCALE,
    mx: [MAGNETS[0].x, MAGNETS[0].y, MAGNETS[1].x, MAGNETS[1].y, MAGNETS[2].x, MAGNETS[2].y],
    hOffSq: H_OFFSET_SQ, kR: K_RESTORE, fri: FRICTION,
    dt: DT, dtH: DT_HALF, dt6: DT_SIXTH, maxSteps: MAX_STEPS,
    sspSq: SETTLE_SPEED_SQ, srSq: SETTLE_RADIUS_SQ
  };
  for (let wi = 0; wi < NUM_WORKERS; wi++) {
    const cellStart = wi * chunkSize;
    if (cellStart >= totalCells) break;
    const w = new Worker(workerBlobURL);
    w.onmessage = handleWorkerMessage;
    w.postMessage({ ...baseJob, cellStart, cellEnd: Math.min(cellStart + chunkSize, totalCells) });
    workers.push(w);
    workersTotal++;
  }
}

function startWorkers() {
  startWorkersAt(PIXEL_COARSE, () => startWorkersAt(PIXEL_SIZE));
}

function handleWorkerMessage(e) {
  if (e.data.type === 'done') {
    workersDone++;
    if (workersDone === workersTotal && workersDoneCallback) {
      const cb = workersDoneCallback;
      workersDoneCallback = null;
      cb();
    }
    return;
  }
  if (e.data.type !== 'batch') return;
  const { start, data } = e.data;
  const count = data.length >> 1;
  const ps = currentPixelSize;
  fractalgfx.noStroke();
  for (let j = 0; j < count; j++) {
    const i   = start + j;
    const col = i % currentCols;
    const row = (i - col) / currentCols;
    const mag = data[j*2], st = data[j*2+1];
    if (mag >= 0) {
      fractalgfx.fill(MAGNET_HUES[mag], 85, map(Math.log(st+1), 0, LOG_MAX, 100, 15));
    } else {
      fractalgfx.fill(0, 0, 5);
    }
    fractalgfx.rect(col * ps, row * ps, ps, ps);
  }
}

function scheduleWorker() {
  if (!pendingRestart) {
    pendingRestart = true;
    requestAnimationFrame(() => { pendingRestart = false; startWorkers(); });
  }
}

function drawMagnets() {
  noStroke();
  const pulse = sin(frameCount * 0.06) * 3;
  for (let m = 0; m < 3; m++) {
    const { px, py } = simToPixel(MAGNETS[m].x, MAGNETS[m].y);
    const grabbed = m === dragIdx;
    fill(MAGNET_HUES[m], 70, 100, grabbed ? 33 : 18);
    circle(px, py, (grabbed ? 56 : 38) + (grabbed ? 0 : pulse));
    fill(MAGNET_HUES[m], 50, 100, grabbed ? 95 : 72);
    circle(px, py, grabbed ? 22 : 15);
  }
}

function mousePressed() {
  for (let m = 0; m < 3; m++) {
    const { px, py } = simToPixel(MAGNETS[m].x, MAGNETS[m].y);
    if (dist(mouseX, mouseY, px, py) < GRAB_PX) {
      dragIdx = m;
      hintAlpha = 0;
      return false;
    }
  }
}

function mouseDragged() {
  if (dragIdx < 0) return;
  const { sx, sy } = pixelToSim(mouseX, mouseY);
  MAGNETS[dragIdx].x = sx;
  MAGNETS[dragIdx].y = sy;
  scheduleWorker();
  return false;
}

function mouseReleased() { dragIdx = -1; return false; }

function touchStarted(e) { if (e && e.target && e.target.closest('a')) return true; mousePressed(); return false; }
function touchMoved(e)   { if (e && e.target && e.target.closest('a')) return true; mouseDragged(); return false; }
function touchEnded()    { mouseReleased(); return false; }

function makeFractalGfx() {
  if (fractalgfx) fractalgfx.remove();
  fractalgfx = createGraphics(width, height);
  fractalgfx.colorMode(HSB, 360, 100, 100, 100);
  fractalgfx.pixelDensity(1);
  fractalgfx.noStroke();
  fractalgfx.background(0);
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  pixelDensity(1);
  noStroke();
  frameRate(60);
  initWorkerBlob();
  makeFractalGfx();
  startWorkers();
}

function draw() {
  background(0);
  image(fractalgfx, 0, 0);
  drawMagnets();
  if (hintAlpha > 0) {
    noStroke();
    textAlign(CENTER, BOTTOM);
    textFont('w95');
    textSize(13);
    fill(0, 0, 100, hintAlpha);
    text('drag a magnet', width / 2, height - 18);
    hintAlpha = max(0, hintAlpha - 0.25);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeFractalGfx();
  startWorkers();
}
</script>
</body>
</html>

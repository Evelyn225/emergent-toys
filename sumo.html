<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>

      border-radius: 50%;

      touch-action: none;
    }
    #touch button.on { background: #ff6b57; color: #1b1424; }
  </style>

<body>

<a href="/"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         padding: 8px; background: rgba(0,0,0,0.8); color: white;
         border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
         text-decoration: none; font-family: sans-serif; font-size: 18px;
         transition: all 0.3s cubic-bezier(0.68,-0.55,0.265,1.55);
         line-height: 1; display: flex; align-items: center; justify-content: center;"
  onmouseover="this.style.transform='scale(1.2) rotate(5deg)';this.style.background='rgba(255,107,87,0.9)';this.style.borderColor='rgba(255,255,255,0.6)'"
  onmouseout="this.style.transform='scale(1) rotate(0deg)';this.style.background='rgba(0,0,0,0.8)';this.style.borderColor='rgba(255,255,255,0.3)'"
  onmousedown="this.style.transform='scale(0.9) rotate(-5deg)'"
  onmouseup="this.style.transform='scale(1.2) rotate(5deg)'">
  <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png"
       alt="home" style="width: 18px; height: 18px; object-fit: contain;">
</a>

<canvas id="c"></canvas>

<div id="touch">
  <div class="grp">
    <button data-k="KeyA">&#9664;</button>
    <button data-k="KeyD">&#9654;</button>
  </div>
  <div class="grp">
    <button data-k="KeyW">&#9650;</button>
    <button data-k="KeyS">&#9679;</button>
  </div>
</div>

<script>
'use strict';
// ── Soft Body Sumo ───────────────────────────────────────────────────
// Two jelly blobs on a dohyo. Push the other one off.
//
// Each blob is a ring of 22 point masses integrated with Verlet at
// 8 substeps per frame, held together by three soft constraints:
//   · edge springs        — keep the skin from tearing
//   · gas pressure        — shoelace area vs. target area, pushed out
//                           along vertex normals (this is the "jelly")
//   · shape matching      — a gentle pull toward the best-fit rotated
//                           rest circle, so blobs never turn inside out
// Blob-vs-blob contact is real polygon collision: every skin point
// inside the other blob is pushed out to the nearest edge, with the
// correction split between the point and that edge's two endpoints.
//
// Slam = hold to crouch (pressure drops, blob squashes), release to
// spike the pressure and shove whatever you're touching.

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

// ── World + tuning ──────────────────────────────────────────────────
const WW = 1000, WH = 600;                 // logical world size
const PX0 = 200, PX1 = 800, PY = 420, TH = 46; // dohyo platform
const N = 28, R = 44;                      // skin points, rest radius
const SUB = 8, DT = 1 / 60, H = DT / SUB;  // fixed step + substeps
const G = 2300, DAMP = 0.9995;
const KS = 0.02;   // shape-matching stiffness (lower = wobblier)
const KE = 0.32;   // edge spring stiffness
const KP = 0.3;    // pressure stiffness
const FR = 0.08;   // ground friction per substep
const MOVE = 1700, AIRMOVE = 650, ROLL = 1600, MAXV = 430, JUMP = 830;
const CHARGE_T = 0.75, SLAM_CD = 0.55, SLAM_RANGE = R * 2.7, WIN = 3;
const OUT_Y = PY + 170;
const TAU = Math.PI * 2;

// One palette for everything. Solids are INK with a CREAM rim light;
// the only saturated colours on screen belong to the two wrestlers.
const PAL = {
  ink:   '#1b1424',
  ink2:  '#33253f',  // distant silhouettes, ring top face
  cream: '#f4e7cf',  // rim light, eyes, sun, text
  sky0:  '#2a1c3b',
  sky1:  '#4a2848',
  sky2:  '#77344f',
  sky3:  '#a84a54',
};
const COLORS = [
  { line: '#ff6b57', rgb: '255,107,87', name: 'RED' },
  { line: '#43c6ac', rgb: '67,198,172', name: 'JADE' },
];

// ── Body ────────────────────────────────────────────────────────────
function makeBody(cx, cy, idx) {
  const b = {
    idx, col: COLORS[idx],
    x:  new Float32Array(N), y:  new Float32Array(N),
    px: new Float32Array(N), py: new Float32Array(N),
    rx: new Float32Array(N), ry: new Float32Array(N), // rest offsets
    nx: new Float32Array(N), ny: new Float32Array(N), // scratch normals
    cx, cy, lcx: cx, lcy: cy, vx: 0, vy: 0,
    minX: 0, maxX: 0, minY: 0, maxY: 0,
    pressure: 1, charge: 0, charging: false,
    puffT: 0, puffAmt: 1, cd: 0, stun: 0, jumpCd: 0,
    ax: 0, roll: 0, touch: false, onGround: false,
    ai: { t: 0, move: 0, slam: false, target: 0.6, jump: false },
  };
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU;
    b.rx[i] = Math.cos(a) * R;
    b.ry[i] = Math.sin(a) * R;
    b.x[i] = b.px[i] = cx + b.rx[i];
    b.y[i] = b.py[i] = cy + b.ry[i];
  }
  b.A0 = area(b);
  b.L0 = 2 * R * Math.sin(Math.PI / N);
  centre(b);
  return b;
}

function area(b) {
  let a = 0;
  for (let i = 0, j = N - 1; i < N; j = i++) a += b.x[j] * b.y[i] - b.x[i] * b.y[j];
  return a * 0.5;
}

function centre(b) {
  let sx = 0, sy = 0, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < N; i++) {
    const x = b.x[i], y = b.y[i];
    sx += x; sy += y;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  b.cx = sx / N; b.cy = sy / N;
  b.minX = x0; b.maxX = x1; b.minY = y0; b.maxY = y1;
}

// Verlet step. Movement is a uniform push plus a tangential "roll"
// force around the centroid, so blobs grip the clay and tumble.
function integrate(b) {
  const h2 = H * H, ax = b.ax, roll = b.roll / R;
  for (let i = 0; i < N; i++) {
    const ox = b.x[i] - b.cx, oy = b.y[i] - b.cy;
    const vx = (b.x[i] - b.px[i]) * DAMP;
    const vy = (b.y[i] - b.py[i]) * DAMP;
    b.px[i] = b.x[i]; b.py[i] = b.y[i];
    b.x[i] += vx + (ax - oy * roll) * h2;
    b.y[i] += vy + (G  + ox * roll) * h2;
  }
}

function constrain(b) {
  const s = Math.sqrt(b.pressure); // linear scale of the rest shape
  centre(b);
  const cx = b.cx, cy = b.cy;

  // Shape matching: best-fit rotation of rest shape, then pull toward it
  let num = 0, den = 0;
  for (let i = 0; i < N; i++) {
    const ox = b.x[i] - cx, oy = b.y[i] - cy;
    num += b.rx[i] * oy - b.ry[i] * ox;
    den += b.rx[i] * ox + b.ry[i] * oy;
  }
  const ang = Math.atan2(num, den);
  const c = Math.cos(ang) * s, sn = Math.sin(ang) * s;
  for (let i = 0; i < N; i++) {
    const tx = cx + b.rx[i] * c - b.ry[i] * sn;
    const ty = cy + b.rx[i] * sn + b.ry[i] * c;
    b.x[i] += (tx - b.x[i]) * KS;
    b.y[i] += (ty - b.y[i]) * KS;
  }

  // Edge springs
  const L = b.L0 * s;
  for (let i = 0; i < N; i++) {
    const j = i === N - 1 ? 0 : i + 1;
    const dx = b.x[j] - b.x[i], dy = b.y[j] - b.y[i];
    const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const k = (d - L) / d * 0.5 * KE;
    b.x[i] += dx * k; b.y[i] += dy * k;
    b.x[j] -= dx * k; b.y[j] -= dy * k;
  }

  // Pressure: area deficit spread over the perimeter, along normals
  let perim = 0;
  for (let i = 0; i < N; i++) {
    const p = i === 0 ? N - 1 : i - 1, n = i === N - 1 ? 0 : i + 1;
    const tx = b.x[n] - b.x[p], ty = b.y[n] - b.y[p];
    const l = Math.sqrt(tx * tx + ty * ty) || 1e-6;
    b.nx[i] = ty / l; b.ny[i] = -tx / l;
    perim += l * 0.5;
  }
  const push = (b.A0 * b.pressure - area(b)) / perim * KP;
  for (let i = 0; i < N; i++) {
    b.x[i] += b.nx[i] * push;
    b.y[i] += b.ny[i] * push;
  }
}

function inside(b, X, Y) {
  let r = false;
  for (let i = 0, j = N - 1; i < N; j = i++) {
    const yi = b.y[i], yj = b.y[j];
    if ((yi > Y) !== (yj > Y) &&
        X < (b.x[j] - b.x[i]) * (Y - yi) / (yj - yi) + b.x[i]) r = !r;
  }
  return r;
}

// Push every point of `a` that's inside `b` out to b's nearest edge.
function collide(a, b) {
  if (a.maxX < b.minX || a.minX > b.maxX || a.maxY < b.minY || a.minY > b.maxY) return;
  for (let i = 0; i < N; i++) {
    const X = a.x[i], Y = a.y[i];
    if (X < b.minX || X > b.maxX || Y < b.minY || Y > b.maxY) continue;
    if (!inside(b, X, Y)) continue;
    let best = 1e18, bj = 0, bt = 0, qx = 0, qy = 0;
    for (let j = 0; j < N; j++) {
      const k = j === N - 1 ? 0 : j + 1;
      const ex = b.x[k] - b.x[j], ey = b.y[k] - b.y[j];
      let t = ((X - b.x[j]) * ex + (Y - b.y[j]) * ey) / (ex * ex + ey * ey || 1e-6);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const cx = b.x[j] + ex * t, cy = b.y[j] + ey * t;
      const d2 = (cx - X) * (cx - X) + (cy - Y) * (cy - Y);
      if (d2 < best) { best = d2; bj = j; bt = t; qx = cx; qy = cy; }
    }
    const bk = bj === N - 1 ? 0 : bj + 1;
    const dx = qx - X, dy = qy - Y;
    a.x[i] += dx * 0.5; a.y[i] += dy * 0.5;
    const w0 = 1 - bt, w1 = bt, f = 0.5 / (w0 * w0 + w1 * w1);
    b.x[bj] -= dx * f * w0; b.y[bj] -= dy * f * w0;
    b.x[bk] -= dx * f * w1; b.y[bk] -= dy * f * w1;
  }
}

function ground(b) {
  for (let i = 0; i < N; i++) {
    const X = b.x[i], Y = b.y[i];
    if (X <= PX0 || X >= PX1 || Y <= PY || Y >= PY + TH) continue;
    const dTop = Y - PY, dL = X - PX0, dR = PX1 - X, dBot = PY + TH - Y;
    const m = Math.min(dTop, dL, dR, dBot);
    if (m === dTop) {
      b.y[i] = PY;
      b.px[i] = b.x[i] - (b.x[i] - b.px[i]) * (1 - FR); // friction
      b.touch = true;
    } else if (m === dL) b.x[i] = PX0;
    else if (m === dR)   b.x[i] = PX1;
    else                 b.y[i] = PY + TH;
  }
}

function physics() {
  const [A, B] = bodies;
  A.touch = B.touch = false;
  for (let s = 0; s < SUB; s++) {
    centre(A); integrate(A);
    centre(B); integrate(B);
    constrain(A); constrain(B);
    centre(A); centre(B);
    collide(A, B); collide(B, A);
    ground(A); ground(B);
  }
  centre(A); centre(B);
}

// ── Game state ──────────────────────────────────────────────────────
let mode = 'title';       // title | ready | fight | ringout | over
let vsCPU = true;
let bodies = [];
let scores = [0, 0];
let stateT = 0, msg = '', msgT = 0, loser = -1;
let timeScale = 1, shake = 0, titleReset = 0;
const parts = [];
const impacts = [];   // comic impact stars on slam hits

function newRound() {
  bodies = [makeBody(PX0 + 150, PY - R - 4, 0), makeBody(PX1 - 150, PY - R - 4, 1)];
  if (mode !== 'title' && mode !== 'over') {
    mode = 'ready'; stateT = 1.0; msg = 'READY'; msgT = 1.0;
  }
  timeScale = 1;
}
function startMatch(cpu) {
  vsCPU = cpu; scores = [0, 0]; mode = 'ready'; newRound();
}
function toTitle() {
  mode = 'title'; msg = ''; msgT = 0; newRound();
}

// ── Input ───────────────────────────────────────────────────────────
const keys = {}, hit = {};
const BLOCK = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (!e.repeat) hit[e.code] = true;
  keys[e.code] = true;
  unlockAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function humanCtl(p) {
  if (p === 0) {
    const ar = vsCPU; // vs CPU, player 1 can use arrows too
    return {
      left:  keys.KeyA || (ar && keys.ArrowLeft),
      right: keys.KeyD || (ar && keys.ArrowRight),
      jump:  hit.KeyW  || (ar && hit.ArrowUp),
      slam:  keys.KeyS || (ar && keys.ArrowDown),
    };
  }
  return { left: keys.ArrowLeft, right: keys.ArrowRight, jump: hit.ArrowUp, slam: keys.ArrowDown };
}

// Touch controls (player 1)
const touchEl = document.getElementById('touch');
if (matchMedia('(pointer: coarse)').matches) touchEl.style.display = 'flex';
touchEl.querySelectorAll('button').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; hit[k] = true; btn.classList.add('on'); unlockAudio(); };
  const up   = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
});
cv.addEventListener('pointerdown', () => {
  unlockAudio();
  if (mode === 'title') startMatch(true);
  else if (mode === 'over') startMatch(vsCPU);
});

// ── CPU ─────────────────────────────────────────────────────────────
function aiCtl(b, o, dt) {
  const s = b.ai;
  s.t -= dt;
  const dx = o.cx - b.cx, dy = o.cy - b.cy, dist = Math.hypot(dx, dy);
  const mid = (PX0 + PX1) / 2;
  const myEdge = Math.min(b.cx - PX0, PX1 - b.cx);
  if (s.t <= 0) {
    s.t = 0.07 + Math.random() * 0.13; // reaction time
    s.move = Math.sign(dx) || 1;
    if (b.cx < PX0 + 20 || b.cx > PX1 - 20) s.move = Math.sign(mid - b.cx);
    if (o.charging && dist < R * 3 && myEdge > 110 && Math.random() < 0.45) s.move = -Math.sign(dx);
    if (!s.slam && b.cd <= 0 && dist < R * 3.4 && Math.random() < 0.55) {
      s.slam = true; s.target = 0.3 + Math.random() * 0.7;
    }
    if (myEdge < 70 && o.charging && b.onGround && Math.random() < 0.5) s.jump = true;
    if (dy < -50 && dist < R * 3 && Math.random() < 0.25) s.jump = true;
    if (Math.random() < 0.015) s.jump = true;
  }
  const c = { left: s.move < 0, right: s.move > 0, jump: s.jump, slam: false };
  s.jump = false;
  if (s.slam) {
    if (b.charge >= s.target || (b.charging && dist < R * 2.15 && b.charge > 0.3) || b.cd > 0) s.slam = false;
    else c.slam = true;
  }
  return c;
}

// ── Controls → forces ───────────────────────────────────────────────
function applyCtl(b, o, c, dt) {
  b.jumpCd -= dt; b.cd -= dt; b.puffT -= dt;
  if (b.stun > 0) { b.stun -= dt; c = {}; }
  const dir = (c.right ? 1 : 0) - (c.left ? 1 : 0);
  const slow = b.charging ? 0.45 : 1;
  let ax = dir * (b.onGround ? MOVE : AIRMOVE) * slow;
  if (dir * b.vx > MAXV * slow) ax = 0;
  b.ax = ax;
  b.roll = dir * ROLL * slow * (b.onGround ? 1 : 0.25);

  if (c.jump && b.onGround && b.jumpCd <= 0 && !b.charging) {
    for (let i = 0; i < N; i++) b.py[i] += JUMP * H;
    b.jumpCd = 0.3;
    sfx('jump');
  }

  if (c.slam && b.cd <= 0) {
    if (!b.charging) { b.charging = true; b.charge = 0; }
    b.charge = Math.min(1, b.charge + dt / CHARGE_T);
  } else if (b.charging) {
    release(b, o);
  }

  // Crouch deflates, slam over-inflates, otherwise relax to 1
  const target = b.charging ? 1 - 0.3 * b.charge : (b.puffT > 0 ? b.puffAmt : 1);
  b.pressure += (target - b.pressure) * (b.puffT > 0 ? 0.55 : 0.2);
}

function release(b, o) {
  const c = Math.max(0.2, b.charge);
  b.charging = false; b.charge = 0; b.cd = SLAM_CD;
  b.puffT = 0.14; b.puffAmt = 1 + 0.75 * c;
  const dx = o.cx - b.cx, dy = o.cy - b.cy, d = Math.hypot(dx, dy) || 1;
  if (d < SLAM_RANGE) {
    const nx = dx / d, ny = dy / d;
    const F = 420 + 1000 * c, lift = 150 + 300 * c;
    const vx = nx * F, vy = ny * F * 0.35 - lift;
    for (let i = 0; i < N; i++) {
      o.px[i] -= vx * H; o.py[i] -= vy * H;   // shove target
      b.px[i] += vx * 0.22 * H;               // recoil
    }
    o.stun = 0.15 + 0.25 * c;
    shake = Math.max(shake, 5 + 12 * c);
    const hx = (b.cx + o.cx) / 2, hy = (b.cy + o.cy) / 2;
    burst(hx, hy, (10 + 14 * c) | 0, b.col.rgb, 260 + 260 * c);
    impacts.push({ x: hx, y: hy, r: 26 + 34 * c, rot: Math.random() * TAU, t: 0, life: 0.2 });
    sfx('slam', c);
  } else {
    burst(b.cx, b.maxY, 6, b.col.rgb, 120);
    sfx('puff');
  }
}

function post(b, dt) {
  const vyBefore = b.vy;
  b.vx = (b.cx - b.lcx) / dt; b.vy = (b.cy - b.lcy) / dt;
  b.lcx = b.cx; b.lcy = b.cy;
  const was = b.onGround;
  b.onGround = b.touch;
  if (b.onGround && !was && vyBefore > 350) {
    burst(b.cx, PY, 8, '244,231,207', 160);
    sfx('land');
  }
}

// ── Particles ───────────────────────────────────────────────────────
function burst(x, y, n, rgb, spd) {
  for (let i = 0; i < n && parts.length < 400; i++) {
    const a = Math.random() * TAU, s = spd * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3,
                 life: 1, decay: 1.2 + Math.random() * 1.5, size: 2 + Math.random() * 3, rgb });
  }
}

// ── Update ──────────────────────────────────────────────────────────
function update(dt) {
  if (mode === 'title') {
    if (hit.Digit1 || hit.Numpad1) startMatch(true);
    else if (hit.Digit2 || hit.Numpad2) startMatch(false);
  } else if (mode === 'over' && (hit.Space || hit.Enter)) {
    startMatch(vsCPU);
  }
  if (hit.Escape && mode !== 'title') toTitle();
  if (hit.KeyM) muted = !muted;

  const [A, B] = bodies;
  let ca = {}, cb = {};
  if (mode === 'title') {
    ca = aiCtl(A, B, dt); cb = aiCtl(B, A, dt); // attract mode
  } else if (mode !== 'ready') {
    ca = humanCtl(0);
    cb = vsCPU ? aiCtl(B, A, dt) : humanCtl(1);
  }
  applyCtl(A, B, ca, dt);
  applyCtl(B, A, cb, dt);
  physics();
  post(A, dt); post(B, dt);

  stateT -= dt; msgT -= dt;
  const outA = A.cy > OUT_Y, outB = B.cy > OUT_Y;

  if (mode === 'title' || mode === 'over') {
    // free play: just respawn whoever falls
    if ((outA || outB) && titleReset <= 0) titleReset = 1.2;
    if (titleReset > 0 && (titleReset -= dt) <= 0) newRound();
  } else if (mode === 'ready' && stateT <= 0) {
    mode = 'fight'; msg = 'SUMO!'; msgT = 0.7; sfx('go');
  } else if (mode === 'fight' && (outA || outB)) {
    loser = outA && outB ? -1 : outA ? 0 : 1;
    mode = 'ringout'; stateT = 0.7; timeScale = 0.35;
    msg = loser < 0 ? 'DOUBLE OUT' : 'RING OUT'; msgT = 0.7;
    shake = Math.max(shake, 10);
    sfx('out');
  } else if (mode === 'ringout' && stateT <= 0) {
    timeScale = 1;
    if (loser >= 0) scores[1 - loser]++;
    if (scores[0] >= WIN || scores[1] >= WIN) {
      const w = scores[0] >= WIN ? 0 : 1;
      mode = 'over';
      msg = (w === 1 && vsCPU ? 'CPU' : COLORS[w].name) + ' WINS';
      msgT = 1e9;
      sfx('win');
      newRound();
    } else {
      newRound();
    }
  }

  for (let i = impacts.length - 1; i >= 0; i--) {
    if ((impacts[i].t += dt) >= impacts[i].life) impacts.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if ((p.life -= p.decay * dt) <= 0) parts.splice(i, 1);
  }
  shake *= 0.85;
  for (const k in hit) delete hit[k];
}

// ── Audio (tiny synth blips) ────────────────────────────────────────
let AC = null, muted = false;
function unlockAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function sfx(type, amt = 1) {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  const env = (f0, f1, dur, vol, wave) => {
    o.type = wave;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  };
  switch (type) {
    case 'jump': env(220, 560, 0.13, 0.10, 'sine'); break;
    case 'land': env(110, 45, 0.10, 0.12, 'sine'); break;
    case 'puff': env(300, 120, 0.08, 0.05, 'triangle'); break;
    case 'slam': env(160 + 60 * amt, 40, 0.22, 0.10 + 0.08 * amt, 'square'); break;
    case 'go':   env(520, 780, 0.18, 0.08, 'square'); break;
    case 'out':  env(440, 70, 0.70, 0.12, 'triangle'); break;
    case 'win':  env(392, 1046, 0.50, 0.08, 'square'); break;
  }
}

// ── Render ──────────────────────────────────────────────────────────
// Flat silhouette style: no gradients, no blur, no alpha fades.
// Every solid is INK with a 2px CREAM rim on its lit edge. Wrestlers are
// ink bodies wrapped in a thick outline in their own colour; the outline
// is stroked first and the fill laid on top, so it only shows outside.
let DPR = 1, SW = 0, SH = 0, SCALE = 1, OX = 0, OY = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cv.width = SW * DPR; cv.height = SH * DPR;
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
  SCALE = Math.min(SW / WW, SH / WH);
  OX = (SW - WW * SCALE) / 2; OY = (SH - WH * SCALE) / 2;
}
addEventListener('resize', resize);

const HILLS = [[-3000, 400], [-200, 380], [60, 330], [170, 368], [300, 338], [420, 384],
               [580, 348], [720, 390], [860, 334], [1000, 372], [1200, 344], [4000, 400]];

function drawSky() {
  // flat sunset bands (drawn huge so they also fill any letterbox)
  const bands = [[-3000, 150, PAL.sky0], [150, 250, PAL.sky1], [250, 330, PAL.sky2], [330, 4000, PAL.sky3]];
  for (const [y0, y1, c] of bands) { ctx.fillStyle = c; ctx.fillRect(-3000, y0, 7000, y1 - y0); }

  // sun, sliced by sky-coloured stripes
  ctx.fillStyle = PAL.cream;
  ctx.beginPath(); ctx.arc(WW / 2, 300, 150, 0, TAU); ctx.fill();
  ctx.fillStyle = PAL.sky3;
  for (let i = 0; i < 4; i++) ctx.fillRect(WW / 2 - 160, 338 + i * 20, 320, 3 + i * 3);

  // far hills
  ctx.fillStyle = PAL.ink2;
  ctx.beginPath();
  ctx.moveTo(-3000, 4000);
  for (const [x, y] of HILLS) ctx.lineTo(x, y);
  ctx.lineTo(4000, 4000);
  ctx.fill();
}

function drawTassel(x, color) {
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 112); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, 124, 6, 12, 0, 0, TAU);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 3; ctx.stroke();
}

function drawArena() {
  // hanging roof: cables, silhouette, cream rim, player-coloured tassels
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(330, -300); ctx.lineTo(330, 60);
  ctx.moveTo(670, -300); ctx.lineTo(670, 60);
  ctx.stroke();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath();
  ctx.moveTo(236, 100); ctx.lineTo(764, 100); ctx.lineTo(700, 64); ctx.lineTo(300, 64);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(316, 56, 368, 9);
  ctx.fillStyle = PAL.cream;
  ctx.fillRect(316, 56, 368, 2);
  drawTassel(250, COLORS[0].line);
  drawTassel(750, COLORS[1].line);

  // pillar
  ctx.fillStyle = PAL.ink;
  ctx.beginPath();
  ctx.moveTo(PX0 + 12, PY + TH); ctx.lineTo(PX1 - 12, PY + TH);
  ctx.lineTo(PX1 - 72, WH + 600); ctx.lineTo(PX0 + 72, WH + 600);
  ctx.fill();

  // ring: top face, front face, rim, rope line
  ctx.fillStyle = PAL.ink2; ctx.fillRect(PX0, PY, PX1 - PX0, 10);
  ctx.fillStyle = PAL.ink;  ctx.fillRect(PX0, PY + 10, PX1 - PX0, TH - 10);
  ctx.fillStyle = PAL.cream; ctx.fillRect(PX0, PY, PX1 - PX0, 2);
  ctx.fillStyle = PAL.ink2; ctx.fillRect(PX0 + 14, PY + 26, PX1 - PX0 - 28, 3);

  // straw bales at the edge
  for (const x of [PX0, PX1 - 22]) {
    ctx.fillStyle = PAL.ink;   ctx.fillRect(x, PY - 7, 22, 9);
    ctx.fillStyle = PAL.cream; ctx.fillRect(x, PY - 7, 22, 2);
  }

  // shikiri-sen start lines, in each wrestler's colour
  ctx.fillStyle = COLORS[0].line; ctx.fillRect(WW / 2 - 54, PY + 4, 14, 3);
  ctx.fillStyle = COLORS[1].line; ctx.fillRect(WW / 2 + 40, PY + 4, 14, 3);
}

// Closed Catmull-Rom through the skin points → smooth, even outline
function blobPath(b, ox = 0, oy = 0) {
  const x = b.x, y = b.y;
  ctx.beginPath();
  ctx.moveTo(x[0] + ox, y[0] + oy);
  for (let i = 0; i < N; i++) {
    const i0 = i === 0 ? N - 1 : i - 1, i2 = (i + 1) % N, i3 = (i + 2) % N;
    ctx.bezierCurveTo(
      x[i] + (x[i2] - x[i0]) / 6 + ox,  y[i] + (y[i2] - y[i0]) / 6 + oy,
      x[i2] - (x[i3] - x[i]) / 6 + ox,  y[i2] - (y[i3] - y[i]) / 6 + oy,
      x[i2] + ox, y[i2] + oy);
  }
  ctx.closePath();
}

function drawShadow(b) {
  if (b.cx < PX0 + 10 || b.cx > PX1 - 10 || b.maxY > PY + 2) return;
  const h = Math.min(1, (PY - b.maxY) / 260);
  ctx.fillStyle = PAL.ink;
  ctx.beginPath();
  ctx.ellipse(b.cx, PY + 5, R * (0.85 - 0.5 * h), 3.5, 0, 0, TAU);
  ctx.fill();
}

function drawBody(b, o) {
  const col = b.col;
  const ew = b.maxX - b.minX, eh = b.maxY - b.minY;
  const OUT = 9 + (b.charging ? 6 * b.charge : 0) + (b.puffT > 0 ? 4 : 0);
  const kx = b.cx, ky = b.minY - 3; // topknot sits on the crown

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  // Outline pass (knot + body), then fill pass → one merged silhouette
  ctx.strokeStyle = col.line; ctx.lineWidth = OUT;
  ctx.beginPath(); ctx.ellipse(kx, ky, 8, 6.5, 0, 0, TAU); ctx.stroke();
  blobPath(b); ctx.stroke();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.ellipse(kx, ky, 8, 6.5, 0, 0, TAU); ctx.fill();
  blobPath(b); ctx.fill();

  ctx.save();
  blobPath(b); ctx.clip();

  // rim light: same path nudged down-right, stroked → crescent top-left
  blobPath(b, 4, 4);
  ctx.strokeStyle = PAL.cream; ctx.lineWidth = 3;
  ctx.stroke();

  // mawashi belt + fringe
  const by = b.cy + eh * 0.16, bh = Math.max(8, eh * 0.17);
  ctx.fillStyle = col.line;
  ctx.fillRect(b.minX - 10, by, ew + 20, bh);
  ctx.fillStyle = PAL.ink;
  ctx.fillRect(b.minX - 10, by + bh * 0.5 - 1, ew + 20, 2);
  ctx.fillStyle = col.line;
  for (let k = -2; k <= 2; k++) ctx.fillRect(b.cx + k * 7 - 1.5, by + bh, 3, eh * 0.11);
  ctx.restore();

  // face: stays upright while the skin tumbles, looks at the opponent
  const ex = ew * 0.17, ey = b.cy - eh * 0.12;
  const dx = o.cx - b.cx, dy = o.cy - b.cy, d = Math.hypot(dx, dy) || 1;
  const lx = dx / d * 2.6, ly = dy / d * 2.6;
  for (const s of [-1, 1]) {
    const X = b.cx + s * ex;
    if (b.stun > 0) {
      ctx.strokeStyle = PAL.cream; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(X - 5, ey - 5); ctx.lineTo(X + 5, ey + 5);
      ctx.moveTo(X + 5, ey - 5); ctx.lineTo(X - 5, ey + 5);
      ctx.stroke();
    } else {
      ctx.fillStyle = PAL.cream;
      ctx.beginPath(); ctx.ellipse(X, ey, 6.5, 7.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = PAL.ink;
      ctx.beginPath(); ctx.arc(X + lx, ey + ly + 0.5, 3.4, 0, TAU); ctx.fill();
      if (b.charging) { // angry lid slants down toward the middle
        ctx.beginPath();
        ctx.moveTo(X - s * 9, ey - 1);
        ctx.lineTo(X + s * 9, ey - 8);
        ctx.lineTo(X + s * 9, ey - 14);
        ctx.lineTo(X - s * 9, ey - 14);
        ctx.fill();
      }
    }
    // blush
    ctx.fillStyle = col.line;
    ctx.beginPath(); ctx.ellipse(X + s * 4, ey + 11, 4, 2, 0, 0, TAU); ctx.fill();
  }

  // mouth
  const my = ey + 14;
  if (b.puffT > 0 || b.stun > 0) {
    ctx.strokeStyle = PAL.cream; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(b.cx, my + 1, 3.5, 4.5, 0, 0, TAU); ctx.stroke();
  } else if (b.charging) { // gritted teeth
    ctx.fillStyle = PAL.cream; ctx.fillRect(b.cx - 6, my - 2, 12, 5);
    ctx.fillStyle = PAL.ink;
    ctx.fillRect(b.cx - 2.5, my - 2, 1.5, 5); ctx.fillRect(b.cx + 1, my - 2, 1.5, 5);
  } else {
    ctx.fillStyle = PAL.cream; ctx.fillRect(b.cx - 4, my, 8, 2);
  }

  // charge ring above the topknot
  if (b.charging) {
    const cy = ky - 24;
    ctx.lineCap = 'butt';
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(kx, cy, 9, 0, TAU); ctx.stroke();
    ctx.strokeStyle = b.charge >= 1 ? PAL.cream : col.line; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(kx, cy, 9, -Math.PI / 2, -Math.PI / 2 + TAU * b.charge); ctx.stroke();
    ctx.lineCap = 'round';
  }
}

function drawImpact(e) {
  const k = e.t / e.life, r = e.r * (0.6 + 0.6 * k);
  ctx.beginPath();
  for (let i = 0; i < 20; i++) {
    const a = e.rot + i / 20 * TAU, rr = i % 2 ? r * 0.45 : r;
    ctx[i ? 'lineTo' : 'moveTo'](e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.lineJoin = 'miter';
  ctx.lineWidth = 4; ctx.strokeStyle = PAL.ink; ctx.stroke();
  ctx.fillStyle = k < 0.5 ? PAL.cream : PAL.ink2;
  ctx.fill();
  ctx.lineJoin = 'round';
}

function text(str, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px W95, monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size * 0.18);
  ctx.strokeStyle = PAL.ink;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function drawHUD() {
  if (mode === 'title') {
    text('SOFT BODY SUMO', WW / 2, 182, 54, PAL.cream);
    if ((performance.now() / 500 | 0) % 2 === 0) {
      text('[1] VS CPU', WW / 2 - 110, 236, 18, COLORS[0].line);
      text('[2] TWO PLAYERS', WW / 2 + 90, 236, 18, COLORS[1].line);
    }
    text('P1   A D MOVE  ·  W JUMP  ·  HOLD S, RELEASE TO SLAM', WW / 2, 520, 13, COLORS[0].line);
    text('P2   ARROWS MOVE  ·  UP JUMP  ·  HOLD DOWN, RELEASE TO SLAM', WW / 2, 546, 13, COLORS[1].line);
    text('PUSH THEM OFF THE RING  ·  FIRST TO 3', WW / 2, 576, 11, PAL.cream);
    return;
  }

  // score pips
  text('P1', WW / 2 - 116, 30, 15, COLORS[0].line, 'right');
  text(vsCPU ? 'CPU' : 'P2', WW / 2 + 116, 30, 15, COLORS[1].line, 'left');
  for (let p = 0; p < 2; p++) {
    for (let k = 0; k < WIN; k++) {
      const x = WW / 2 + (p ? 1 : -1) * (28 + k * 24);
      ctx.beginPath(); ctx.arc(x, 30, 7, 0, TAU);
      ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
      ctx.fillStyle = k < scores[p] ? COLORS[p].line : PAL.ink; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = COLORS[p].line; ctx.stroke();
    }
  }

  if (msgT > 0) {
    const pop = msg === 'SUMO!' ? 1 + Math.max(0, msgT - 0.5) * 2 : 1;
    text(msg, WW / 2, 236, 58 * pop, PAL.cream);
  }
  if (mode === 'over') {
    text('[SPACE] REMATCH     [ESC] MENU', WW / 2, 288, 16, PAL.cream);
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PAL.ink2;
  ctx.fillRect(0, 0, SW, SH);

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, (OX + sx * SCALE) * DPR, (OY + sy * SCALE) * DPR);

  drawSky();
  drawArena();
  const [A, B] = bodies;
  drawShadow(A); drawShadow(B);
  drawBody(A, B); drawBody(B, A);

  for (const p of parts) {
    ctx.fillStyle = `rgb(${p.rgb})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6 * p.life + 0.5, 0, TAU); ctx.fill();
  }
  for (const e of impacts) drawImpact(e);
  drawHUD();
}

// ── Main loop: fixed timestep, slow-mo via timeScale ────────────────
let last = performance.now(), acc = 0;
function loop(now) {
  const frameDt = Math.min(0.1, (now - last) / 1000);
  last = now;
  acc += frameDt * timeScale;
  let steps = 0;
  while (acc >= DT && steps < 5) { update(DT); acc -= DT; steps++; }
  if (steps === 5) acc = 0;
  draw();
  requestAnimationFrame(loop);
}

resize();
newRound();
requestAnimationFrame(loop);
</script>
</body>
</html>

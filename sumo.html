<canvas id="c"></canvas>

<div id="touch">

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
//  SOFT BODY SUMO: HOW IT WORKS
// ════════════════════════════════════════════════════════════════════
//
// Two jelly blobs on a ring. Shove, slam, or bait the other one into
// falling off the bottom of the screen. First to 3 wins.
//
// ── Map of this file (top to bottom) ──
//   World + tuning      every number worth tweaking, with units
//   Body                makeBody() and the soft-body physics
//   Game state          whose turn it is, scores, round setup
//   Input / Touch       keyboard, mouse and phone buttons
//   CPU                 the computer player and its 3 difficulty levels
//   Controls → forces   turning "left / jump / slam" into physics
//   Update              one game step: input → physics → rules
//   Audio, Render       tiny synth blips; drawing everything
//   Main loop           calls update() at a fixed 60 steps per second
//
// ── The game loop ──
// loop() runs every screen refresh. It calls update(DT) as many times as
// needed to keep the game at exactly 60 steps per second (so physics
// behaves the same on a 60Hz or 144Hz screen), then draw() once.
// Each update(): read input for both players (playerInput / cpuInput)
// → applyInput() turns it into forces → stepPhysics() → afterPhysics()
// measures speed and ground contact → check who fell → advance `mode`:
//     title → ready → fight → ringout → (next round) … → over
//
// ── What a blob is ──
// A blob is just SKIN_POINTS points around a circle; there is no solid
// interior. Everything you see (squash, wobble, dents) comes from how
// those points are pushed around. Per blob:
//   x[i], y[i]          where point i is now
//   prevX[i], prevY[i]  where it was one substep ago (see Verlet below)
//   restX[i], restY[i]  its offset from the centre in the round rest shape
//   cx, cy              centre (average of all points)
//   vx, vy              centre velocity in px/s, measured each step
//   pressure            target "inflation": 1 normal, <1 crouch, >1 puff
//
// ── The physics, one substep at a time (stepPhysics, ×8 per step) ──
// 1. integrate(): Verlet integration. Velocity is never stored; it's
//    worked out as (where I am − where I was). Each point moves by that
//    plus gravity and any push:  next = x + (x − prevX) + accel·dt²
//    Handy consequence: to give something speed instantly (a jump, a
//    slam), you just move its prevX/prevY. You'll see that a lot.
// 2. constrain(): three soft rules pull the points back into a blob.
//    Each only corrects a fraction of the error per substep; that
//    fraction is the *_STIFFNESS constant, and it's why blobs are soft.
//    a. Shape matching: find the rotation that best lines the rest
//       circle up with the current points (the atan2 of summed cross and
//       dot products), then nudge every point toward its spot on that
//       rotated circle. Keeps blobs from collapsing or turning inside out.
//    b. Springs: neighbouring points try to stay a fixed distance apart.
//    c. Pressure: compare the blob's area (shoelace formula) with its
//       target area, and push every point outward or inward along its
//       normal to make up the difference. This is the "jelly" feel.
// 3. collideBodies(): any skin point inside the other blob (point-in-
//    polygon test) is pushed out to the nearest edge of that blob; the
//    point and the edge's two ends each move half the overlap.
// 4. collideGround(): points inside the ring bar are pushed back out
//    through the nearest face, with friction while on top.
//
// ── Controls → forces (applyInput) ──
//   Moving       pushes every point sideways AND spins them around the
//                centre (rollAccel), so blobs grip and roll like wheels.
//   Braking      a rolling wheel barely slows down on its own, so letting
//                go actively brakes and counter-spins (not while sliding
//                from a slam hit, so knockback is unaffected).
//   Slam         hold to charge: target pressure drops, so the blob
//                crouches and moves at half speed. Let go → release():
//                pressure spikes (the puff) and, if the opponent is in
//                SLAM_RANGE, they're shoved away and stunned briefly.
//                Power rises with charge, more slowly past half charge.
//   Jump         from the ground: normal jump. In the air, only if you
//                fell or got knocked off without jumping: one recovery
//                jump that cancels your fall and steers you back.
//
// ── The CPU (cpuInput) ──
// Every reactTime seconds it "thinks": walk toward you, maybe start a
// slam, maybe jump. Separately, every frame, it checks it isn't about to
// run off an edge. It returns the same {left, right, jump, slam} object a
// human's keys produce, so it plays by exactly the same rules.
// CPU_LEVELS holds the three difficulties; hard switches on extra skills
// (safeJumps, edgeCharge, cornered, punish), each explained where used.
//
// ── Drawing ──
// The world is a fixed 1000×600 box scaled to the screen (SCALE,
// offsetX/Y; portrait phones zoom in on the ring). Blobs are drawn as a
// smooth curve through the skin points, then eyes and a number on top.
//
// ── Where to tweak ──
// Feel, softness, speed: the constants just below this comment.
// Slam strength: `force` and `lift` in release().
// CPU behaviour: CPU_LEVELS, and the comments inside cpuInput().

const canvas  = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── World + tuning ──────────────────────────────────────────────────
// Units: world pixels and seconds. The world is a fixed 1000x600 box that
// gets scaled to fit the screen.
const WORLD_W = 1000, WORLD_H = 600;
const RING_LEFT = 200, RING_RIGHT = 800, RING_TOP = 420, RING_THICKNESS = 18; // the ring: one ink bar
const SKIN_POINTS = 28;            // points around each blob's outline
const RADIUS = 44;                 // blob radius at rest
const DT = 1 / 60;                 // one game step (60 per second)
const SUBSTEPS = 8;                // physics runs 8 times per step for stability
const SUBSTEP_DT = DT / SUBSTEPS;
const GRAVITY = 2300;              // px/s²
const DAMPING = 0.9995;            // tiny velocity loss per substep (air drag)

// Softness. Lower = wobblier. These are fractions of the error corrected
// per substep, so they're unitless and between 0 and 1.
const SHAPE_STIFFNESS = 0.012;     // pull toward the round rest shape
const SPRING_STIFFNESS = 0.2;      // springs between neighbouring skin points
const PRESSURE_STIFFNESS = 0.2;    // the "gas" keeping the area constant
const GROUND_FRICTION = 0.08;      // sideways grip of skin points on the ring

// Movement (px/s and px/s²)
const MOVE_ACCEL = 1700, AIR_MOVE_ACCEL = 650, ROLL_ACCEL = 1600;
const MAX_SPEED = 430, JUMP_SPEED = 830;
const BRAKE_ACCEL = 1800;          // braking when you let go / reverse

// Slam and match rules
const CHARGE_TIME = 0.75;          // seconds to reach full charge
const SLAM_COOLDOWN = 0.55;        // seconds before you can charge again
const SLAM_RANGE = RADIUS * 2.7;   // centre-to-centre distance a slam reaches
const WINS_NEEDED = 3;
const TAU = Math.PI * 2;

// Minimal palette: paper, ink, and one colour per wrestler.
const PALETTE = { paper: '#efe9df', ink: '#1d1b22' };
const COLORS = [
  { fill: '#e8553e', name: 'RED' },
  { fill: '#2a9d8f', name: 'GREEN' },
];

// ── Body ────────────────────────────────────────────────────────────
function makeBody(cx, cy, idx) {
  const body = {
    idx, color: COLORS[idx],
    x:  new Float32Array(SKIN_POINTS), y:  new Float32Array(SKIN_POINTS),
    prevX: new Float32Array(SKIN_POINTS), prevY: new Float32Array(SKIN_POINTS),
    restX: new Float32Array(SKIN_POINTS), restY: new Float32Array(SKIN_POINTS), // rest offsets
    normalX: new Float32Array(SKIN_POINTS), normalY: new Float32Array(SKIN_POINTS), // scratch normals
    cx, cy, lastCx: cx, lastCy: cy, vx: 0, vy: 0,
    minX: 0, maxX: 0, minY: 0, maxY: 0,
    pressure: 1, charge: 0, charging: false,
    puffTime: 0, puffAmount: 1, slamCooldown: 0, stunTime: 0, jumpCooldown: 0, airJump: true, knocked: false, knockGrace: 0,
    pushAccel: 0, rollAccel: 0, touchingGround: false, onGround: false,
    ai: { nextThink: 0, move: 0, slam: false, target: 0.6, jump: false },
  };
  for (let i = 0; i < SKIN_POINTS; i++) {
    const angle = i / SKIN_POINTS * TAU;
    body.restX[i] = Math.cos(angle) * RADIUS;
    body.restY[i] = Math.sin(angle) * RADIUS;
    body.x[i] = body.prevX[i] = cx + body.restX[i];
    body.y[i] = body.prevY[i] = cy + body.restY[i];
  }
  body.restArea = area(body);
  body.restEdge = 2 * RADIUS * Math.sin(Math.PI / SKIN_POINTS);
  measure(body);
  return body;
}

function area(body) {
  let sum = 0;
  for (let i = 0, j = SKIN_POINTS - 1; i < SKIN_POINTS; j = i++) sum += body.x[j] * body.y[i] - body.x[i] * body.y[j];
  return sum * 0.5;
}

function measure(body) {
  let sumX = 0, sumY = 0, left = 1e9, right = -1e9, top = 1e9, bottom = -1e9;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const x = body.x[i], y = body.y[i];
    sumX += x; sumY += y;
    if (x < left) left = x; if (x > right) right = x;
    if (y < top) top = y; if (y > bottom) bottom = y;
  }
  body.cx = sumX / SKIN_POINTS; body.cy = sumY / SKIN_POINTS;
  body.minX = left; body.maxX = right; body.minY = top; body.maxY = bottom;
}

// Verlet step. Movement is a uniform push plus a tangential "roll"
// force around the centroid, so blobs grip the clay and tumble.
function integrate(body) {
  const dtSq = SUBSTEP_DT * SUBSTEP_DT, push = body.pushAccel, spin = body.rollAccel / RADIUS;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const offX = body.x[i] - body.cx, offY = body.y[i] - body.cy;
    const vx = (body.x[i] - body.prevX[i]) * DAMPING;
    const vy = (body.y[i] - body.prevY[i]) * DAMPING;
    body.prevX[i] = body.x[i]; body.prevY[i] = body.y[i];
    body.x[i] += vx + (push - offY * spin) * dtSq;
    body.y[i] += vy + (GRAVITY  + offX * spin) * dtSq;
  }
}

function constrain(body) {
  const scale = Math.sqrt(body.pressure); // linear scale of the rest shape
  measure(body);
  const cx = body.cx, cy = body.cy;

  // Shape matching: best-fit rotation of rest shape, then pull toward it
  let crossSum = 0, dotSum = 0;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const offX = body.x[i] - cx, offY = body.y[i] - cy;
    crossSum += body.restX[i] * offY - body.restY[i] * offX;
    dotSum += body.restX[i] * offX + body.restY[i] * offY;
  }
  const angle = Math.atan2(crossSum, dotSum);
  const cosA = Math.cos(angle) * scale, sinA = Math.sin(angle) * scale;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const targetX = cx + body.restX[i] * cosA - body.restY[i] * sinA;
    const targetY = cy + body.restX[i] * sinA + body.restY[i] * cosA;
    body.x[i] += (targetX - body.x[i]) * SHAPE_STIFFNESS;
    body.y[i] += (targetY - body.y[i]) * SHAPE_STIFFNESS;
  }

  // Edge springs
  const edgeLength = body.restEdge * scale;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const j = i === SKIN_POINTS - 1 ? 0 : i + 1;
    const dx = body.x[j] - body.x[i], dy = body.y[j] - body.y[i];
    const d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    const correction = (d - edgeLength) / d * 0.5 * SPRING_STIFFNESS;
    body.x[i] += dx * correction; body.y[i] += dy * correction;
    body.x[j] -= dx * correction; body.y[j] -= dy * correction;
  }

  // Pressure: area deficit spread over the perimeter, along normals
  let perimeter = 0;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const prev = i === 0 ? SKIN_POINTS - 1 : i - 1, next = i === SKIN_POINTS - 1 ? 0 : i + 1;
    const tangentX = body.x[next] - body.x[prev], tangentY = body.y[next] - body.y[prev];
    const len = Math.sqrt(tangentX * tangentX + tangentY * tangentY) || 1e-6;
    body.normalX[i] = tangentY / len; body.normalY[i] = -tangentX / len;
    perimeter += len * 0.5;
  }
  const pressurePush = (body.restArea * body.pressure - area(body)) / perimeter * PRESSURE_STIFFNESS;
  for (let i = 0; i < SKIN_POINTS; i++) {
    body.x[i] += body.normalX[i] * pressurePush;
    body.y[i] += body.normalY[i] * pressurePush;
  }
}

function pointInBody(body, x, y) {
  let isInside = false;
  for (let i = 0, j = SKIN_POINTS - 1; i < SKIN_POINTS; j = i++) {
    const yi = body.y[i], yj = body.y[j];
    if ((yi > y) !== (yj > y) &&
        x < (body.x[j] - body.x[i]) * (y - yi) / (yj - yi) + body.x[i]) isInside = !isInside;
  }
  return isInside;
}

// Push every skin point of `body` that's inside `other` out to other's nearest edge.
function collideBodies(body, other) {
  if (body.maxX < other.minX || body.minX > other.maxX || body.maxY < other.minY || body.minY > other.maxY) return;
  for (let i = 0; i < SKIN_POINTS; i++) {
    const x = body.x[i], y = body.y[i];
    if (x < other.minX || x > other.maxX || y < other.minY || y > other.maxY) continue;
    if (!pointInBody(other, x, y)) continue;
    let bestDistSq = 1e18, edgeStart = 0, edgeT = 0, nearX = 0, nearY = 0;
    for (let j = 0; j < SKIN_POINTS; j++) {
      const next = j === SKIN_POINTS - 1 ? 0 : j + 1;
      const edgeX = other.x[next] - other.x[j], edgeY = other.y[next] - other.y[j];
      let t = ((x - other.x[j]) * edgeX + (y - other.y[j]) * edgeY) / (edgeX * edgeX + edgeY * edgeY || 1e-6);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const pointX = other.x[j] + edgeX * t, pointY = other.y[j] + edgeY * t;
      const distSq = (pointX - x) * (pointX - x) + (pointY - y) * (pointY - y);
      if (distSq < bestDistSq) { bestDistSq = distSq; edgeStart = j; edgeT = t; nearX = pointX; nearY = pointY; }
    }
    const edgeEnd = edgeStart === SKIN_POINTS - 1 ? 0 : edgeStart + 1;
    const dx = nearX - x, dy = nearY - y;
    body.x[i] += dx * 0.5; body.y[i] += dy * 0.5;
    const weightStart = 1 - edgeT, weightEnd = edgeT, share = 0.5 / (weightStart * weightStart + weightEnd * weightEnd);
    other.x[edgeStart] -= dx * share * weightStart; other.y[edgeStart] -= dy * share * weightStart;
    other.x[edgeEnd] -= dx * share * weightEnd; other.y[edgeEnd] -= dy * share * weightEnd;
  }
}

function collideGround(body) {
  for (let i = 0; i < SKIN_POINTS; i++) {
    const x = body.x[i], y = body.y[i];
    if (x <= RING_LEFT || x >= RING_RIGHT || y <= RING_TOP || y >= RING_TOP + RING_THICKNESS) continue;
    const dTop = y - RING_TOP, dL = x - RING_LEFT, dR = RING_RIGHT - x, dBot = RING_TOP + RING_THICKNESS - y;
    const nearest = Math.min(dTop, dL, dR, dBot);
    // came from above last substep → always land on top (no tunnelling
    // through the thin bar on hard falls)
    if (nearest === dTop || body.prevY[i] <= RING_TOP) {
      body.y[i] = RING_TOP;
      body.prevX[i] = body.x[i] - (body.x[i] - body.prevX[i]) * (1 - GROUND_FRICTION); // friction
      body.touchingGround = true;
    } else if (nearest === dL) body.x[i] = RING_LEFT;
    else if (nearest === dR)   body.x[i] = RING_RIGHT;
    else                 body.y[i] = RING_TOP + RING_THICKNESS;
  }
}

function stepPhysics() {
  const [p1, p2] = bodies;
  p1.touchingGround = p2.touchingGround = false;
  for (let step = 0; step < SUBSTEPS; step++) {
    measure(p1); integrate(p1);
    measure(p2); integrate(p2);
    constrain(p1); constrain(p2);
    measure(p1); measure(p2);
    collideBodies(p1, p2); collideBodies(p2, p1);
    collideGround(p1); collideGround(p2);
  }
  measure(p1); measure(p2);
}

// ── Game state ──────────────────────────────────────────────────────
let mode = 'title';       // title | ready | fight | ringout | over
let vsCPU = true;
let bodies = [];
let scores = [0, 0];
let stateTimer = 0, message = '', messageTimer = 0, loser = -1;
let shake = 0, respawnTimer = 0, winner = 0;
const rings = [];     // expanding impact rings on slam hits

function newRound() {
  bodies = [makeBody(RING_LEFT + 150, RING_TOP - RADIUS - 4, 0), makeBody(RING_RIGHT - 150, RING_TOP - RADIUS - 4, 1)];
  if (mode !== 'title' && mode !== 'over') {
    mode = 'ready'; stateTimer = 1.0; message = 'READY'; messageTimer = 1.0;
  }
}
function startMatch(cpu) {
  vsCPU = cpu; scores = [0, 0]; mode = 'ready'; newRound();
}
function toTitle() {
  mode = 'title'; message = ''; messageTimer = 0; newRound();
}

// ── Input ───────────────────────────────────────────────────────────
const keys = {}, pressed = {};
const BLOCKED_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', e => {
  if (BLOCKED_KEYS.includes(e.code)) e.preventDefault();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  unlockAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function playerInput(player) {
  if (player === 0) {
    const arrowsToo = vsCPU; // vs CPU, player 1 can use arrows too
    return {
      left:  keys.KeyA || (arrowsToo && keys.ArrowLeft),
      right: keys.KeyD || (arrowsToo && keys.ArrowRight),
      jump:  pressed.KeyW  || (arrowsToo && pressed.ArrowUp),
      slam:  keys.KeyS || (arrowsToo && keys.ArrowDown),
    };
  }
  return { left: keys.ArrowLeft, right: keys.ArrowRight, jump: pressed.ArrowUp, slam: keys.ArrowDown };
}

// ── Touch ───────────────────────────────────────────────────────────
// Phones get on-screen buttons for player 1 during a match only; menus
// become tap targets since there's no keyboard to read hints for.
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const touchEl = document.getElementById('touch');
let touchShown = false;
function updateTouchButtons() {
  const show = IS_TOUCH && (mode === 'ready' || mode === 'fight' || mode === 'ringout');
  if (show === touchShown) return;
  touchShown = show;
  touchEl.style.display = show ? 'flex' : 'none';
  if (!show) touchEl.querySelectorAll('button').forEach(btn => {
    keys[btn.dataset.k] = false; btn.classList.remove('on');
  });
}
touchEl.querySelectorAll('button').forEach(btn => {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); keys[k] = true; pressed[k] = true; btn.classList.add('on'); unlockAudio(); };
  const up   = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
});

// Menu taps / clicks, hit-tested against a text row's on-screen y
// Desktop title is a vertical menu: vs cpu / two players, then the
// difficulty row. Phones get "tap to play" + the difficulty row.
const MENU_CPU_Y = 226, MENU_2P_Y = 258;
const MENU_DIFF_Y = IS_TOUCH ? 284 : 296, MENU_BACK_Y = 298;
const onRow = (e, y) => Math.abs(e.clientY - (offsetY + y * SCALE)) < Math.max(24, 20 * SCALE);
// tighter hit for the two stacked mode rows so they don't overlap
const onTight = (e, y) => Math.abs(e.clientY - (offsetY + y * SCALE)) < 16 * SCALE;
const worldX = e => (e.clientX - offsetX) / SCALE;
let menuSelection = 0; // 0 = vs cpu, 1 = two players
function titleItem(e) {
  if (onRow(e, MENU_DIFF_Y)) return 'difficulty';
  if (IS_TOUCH || Math.abs(worldX(e) - WORLD_W / 2) > 160) return null;
  if (onTight(e, MENU_CPU_Y)) return 'cpu';
  if (onTight(e, MENU_2P_Y)) return '2p';
  return null;
}
let hoverItem = null;
canvas.addEventListener('pointermove', e => {
  hoverItem = mode === 'title' && !IS_TOUCH ? titleItem(e) : null;
  if (hoverItem === 'cpu') menuSelection = 0;
  if (hoverItem === '2p') menuSelection = 1;
  canvas.style.cursor = hoverItem ? 'pointer' : '';
});
canvas.addEventListener('pointerdown', e => {
  unlockAudio();
  if (mode === 'title') {
    const item = titleItem(e);
    if (item === 'difficulty') cycleDifficulty(1);
    else if (item === 'cpu') startMatch(true);
    else if (item === '2p') startMatch(false);
    else if (IS_TOUCH) startMatch(true); // phones: tap anywhere to play
    if (mode !== 'title') { hoverItem = null; canvas.style.cursor = ''; }
  } else if (mode === 'over') {
    if (IS_TOUCH && onRow(e, MENU_BACK_Y) && Math.abs(e.clientX - (offsetX + WORLD_W / 2 * SCALE)) < 70) toTitle();
    else startMatch(vsCPU);
  }
});

// ── CPU ─────────────────────────────────────────────────────────────
// Difficulty only changes how the CPU decides, never its physics.
// Tuned with a headless CPU-vs-CPU tournament (hard beats normal ~70% of
// rounds, normal beats easy ~90%). Most CPU rounds were lost to blunders,
// not slams: jumping near the edge (which spends the recovery jump) and
// charging near the edge (slow, can't jump). Hard's extra skills target
// exactly those, plus finishing off an opponent who's trying to recover.
const CPU_LEVELS = [
  // slow to react, often stands still, weak hesitant slams, never dodges
  { name: 'easy',   reactTime: [0.30, 0.25], slamChance: 0.35, slamReach: 3.4, target: [0.15, 0.40], dodge: 0,   edgeJump: 0.15, idle: 0.35, edgeSense: 0.4, recover: 0.35 },
  { name: 'normal', reactTime: [0.07, 0.13], slamChance: 0.75, slamReach: 3.4, target: [0.30, 0.70], dodge: 0.2, edgeJump: 0.5,  idle: 0,    edgeSense: 0.9, recover: 0.9 },
  // fast and careful: only jumps where it will land on the ring, never
  // charges with its back to the edge, quick-slams when cornered, and
  // tap-slams you while you're hanging off the edge trying to recover
  { name: 'hard',   reactTime: [0.03, 0.05], slamChance: 0.75, slamReach: 3.4, target: [0.30, 0.70], dodge: 0.2, edgeJump: 0.5,  idle: 0,    edgeSense: 1,   recover: 1,
    safeJumps: true, edgeCharge: true, cornered: true, punish: true, noRandomJumps: true },
];
let difficulty = 1;
try { const v = localStorage.getItem('sumo-diff'); if (v !== null && +v >= 0 && +v < CPU_LEVELS.length) difficulty = +v; } catch (e) {}
function cycleDifficulty(step) {
  difficulty = (difficulty + step + CPU_LEVELS.length) % CPU_LEVELS.length;
  try { localStorage.setItem('sumo-diff', difficulty); } catch (e) {}
}

function cpuInput(body, opponent, dt, level) {
  const ai = body.ai;
  ai.nextThink -= dt;
  const dx = opponent.cx - body.cx, dy = opponent.cy - body.cy, dist = Math.hypot(dx, dy);
  const ringMid = (RING_LEFT + RING_RIGHT) / 2;
  const myEdgeDist = Math.min(body.cx - RING_LEFT, RING_RIGHT - body.cx);
  if (ai.nextThink <= 0) {
    ai.nextThink = level.reactTime[0] + Math.random() * level.reactTime[1]; // reaction time
    ai.move = Math.random() < level.idle ? 0 : Math.sign(dx) || 1;
    if (body.cx < RING_LEFT + 20 || body.cx > RING_RIGHT - 20) ai.move = Math.sign(ringMid - body.cx);
    if (opponent.charging && dist < RADIUS * 3 && myEdgeDist > 160 && Math.random() < level.dodge) ai.move = -Math.sign(dx);
    // edgeCharge: don't start a full charge with your back near the edge
    // (charging halves your speed and blocks jumping; a big cause of falls)
    const backToEdge = myEdgeDist < 120 && Math.sign(dx) === Math.sign(ringMid - body.cx);
    if (!ai.slam && body.slamCooldown <= 0 && dist < RADIUS * level.slamReach && Math.random() < level.slamChance &&
        !(level.edgeCharge && backToEdge)) {
      ai.slam = true; ai.target = level.target[0] + Math.random() * level.target[1];
    }
    if (myEdgeDist < 70 && opponent.charging && body.onGround && Math.random() < level.edgeJump) ai.jump = true;
    // Don't hop after an opponent who jumped over you while you're running
    // at the edge; that's how the edge-bait trick threw the CPU off.
    const nearEdgeDir = body.cx < (RING_LEFT + RING_RIGHT) / 2 ? -1 : 1;
    const runningOut = myEdgeDist < 140 && Math.sign(body.vx) === nearEdgeDir && Math.abs(body.vx) > 60;
    if (!runningOut && dy < -50 && dist < RADIUS * 3 && Math.random() < 0.25) ai.jump = true;
    if (!runningOut && !level.noRandomJumps && Math.random() < 0.015) ai.jump = true;
    ai.edgeAware = Math.random() < level.edgeSense;
    // knocked off the ring and dropping: use the recovery jump
    const offRing = body.cx < RING_LEFT - 4 || body.cx > RING_RIGHT + 4;
    if (offRing && !body.onGround && body.airJump && body.vy > -60 && Math.random() < level.recover) {
      ai.jump = true; ai.slam = false; ai.quick = false; // can't jump while charging
    }
    // punish: opponent is hanging off the edge mid-recovery and in reach,
    // so tap-slam them away before they get back on
    const opponentOff = opponent.cx < RING_LEFT + 10 || opponent.cx > RING_RIGHT - 10;
    if (level.punish && opponentOff && !opponent.onGround && dist < SLAM_RANGE * 0.95 && body.slamCooldown <= 0 && body.onGround) {
      ai.slam = true; ai.quick = true; ai.target = 0.25;
    }
    // cornered: back near the edge with the opponent pressing in from the
    // middle, so fire a quick slam now instead of holding a charge
    if (level.cornered && myEdgeDist < 130 && Math.sign(dx) === Math.sign(ringMid - body.cx) &&
        dist < RADIUS * 2.6 && body.slamCooldown <= 0 && body.onGround && !ai.quick) {
      ai.slam = true; ai.quick = true; ai.target = 0.25;
    }
  }
  // Edge sense, checked every frame so it can brake in time: don't run
  // toward a nearby edge unless the opponent is on the ring between you
  // and it (then you're pushing them, not yourself, off).
  if (ai.edgeAware && ai.move !== 0 && body.onGround) {
    const edgeAhead = ai.move > 0 ? RING_RIGHT - body.cx : body.cx - RING_LEFT;
    const opponentBetween = opponent.onGround && Math.sign(dx) === ai.move && Math.abs(dx) < edgeAhead;
    const stopDist = 70 + Math.max(0, ai.move * body.vx) * 0.3;
    if (!opponentBetween && edgeAhead < stopDist) ai.move = -ai.move;
  }
  const input = { left: ai.move < 0, right: ai.move > 0, jump: ai.jump, slam: false };
  ai.jump = false;
  // safeJumps: a ground jump uses up the recovery jump, so only take one
  // if the predicted landing spot is safely on the ring
  if (level.safeJumps && input.jump && body.onGround) {
    const landX = body.cx + (body.vx + (input.right ? 250 : input.left ? -250 : 0)) * 0.72;
    if (landX < RING_LEFT + 40 || landX > RING_RIGHT - 40) input.jump = false;
  }
  // edgeCharge: sliding out near the edge mid-charge, so let go (puffs
  // harmlessly out of range) to get the recovery jump back
  if (level.edgeCharge && body.charging && myEdgeDist < 70 &&
      Math.sign(body.vx) === Math.sign(body.cx - ringMid) && Math.abs(body.vx) > 50) ai.slam = false;
  if (ai.slam) {
    const contact = dist < RADIUS * 2.15;
    const shouldRelease = ai.quick ? body.charge >= ai.target
      : body.charge >= ai.target || (body.charging && contact && body.charge > 0.3);
    if (shouldRelease || body.slamCooldown > 0) { ai.slam = false; ai.quick = false; }
    else input.slam = true;
  }
  return input;
}

// ── Controls → forces ───────────────────────────────────────────────
function applyInput(body, opponent, input, dt) {
  body.jumpCooldown -= dt; body.slamCooldown -= dt; body.puffTime -= dt;
  // stunned: no moving or jumping, but a held charge keeps building
  // (getting hit used to wipe your inputs and fire your slam early)
  if (body.stunTime > 0) { body.stunTime -= dt; input = { slam: input.slam }; }
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const slow = body.charging ? 0.45 : 1;
  // speed cap applies to the spin too (it used to roll on past MAX_SPEED)
  const capped = dir * body.vx > MAX_SPEED * slow;
  body.pushAccel = capped ? 0 : dir * (body.onGround ? MOVE_ACCEL : AIR_MOVE_ACCEL) * slow;
  body.rollAccel = capped ? 0 : dir * ROLL_ACCEL * slow * (body.onGround ? 1 : 0.25);

  // Ground braking. A blob is a wheel and a rolling wheel barely loses
  // speed, so you used to coast for ages. When you let go, push against
  // the motion and counter-spin; when you reverse, turn round harder.
  // Skipped while you're sliding from a slam hit (until you've slowed to
  // a crawl) so knockback distances don't change. The short grace period
  // covers the frame of the hit, before the new speed has registered.
  body.knockGrace -= dt;
  if (body.knocked && body.knockGrace <= 0 && Math.abs(body.vx) < 40) body.knocked = false;
  if (body.onGround && !body.knocked) {
    const velSign = Math.sign(body.vx), speed = Math.abs(body.vx);
    if (dir === 0 && speed > 5) {
      const ease = Math.min(1, speed / 120); // ease off near zero: no jitter
      body.pushAccel = -velSign * BRAKE_ACCEL * ease;
      body.rollAccel = -velSign * ROLL_ACCEL * ease;
    } else if (dir !== 0 && dir * body.vx < 0) {
      body.pushAccel += dir * BRAKE_ACCEL * 0.6;
    }
  }

  // slam first, so letting go of slam and pressing jump on the same
  // frame does both (a released charge no longer blocks the jump)
  if (input.slam && body.slamCooldown <= 0) {
    if (!body.charging) { body.charging = true; body.charge = 0; }
    body.charge = Math.min(1, body.charge + dt / CHARGE_TIME);
  } else if (body.charging) {
    release(body, opponent);
  }

  // re-arm the recovery jump only on a real landing (not the frame or two
  // you're still touching the floor right after a jump)
  if (body.onGround && body.jumpCooldown <= 0) body.airJump = true;
  if (input.jump && body.jumpCooldown <= 0 && !body.charging) {
    if (body.onGround) {
      for (let i = 0; i < SKIN_POINTS; i++) body.prevY[i] += JUMP_SPEED * SUBSTEP_DT;
      body.airJump = false;          // jumped on purpose: no recovery jump
      body.jumpCooldown = 0.3;
      sfx('jump');
    } else if (body.airJump) {
      // Recovery jump: only if you left the ground without jumping
      // (pushed or slammed off). Replaces your fall speed rather than
      // adding to it, and swaps most of the sideways knockback for a push
      // the way you're holding, so you can actually get back to the ring.
      const newVx = body.vx * 0.25 + dir * 300;
      for (let i = 0; i < SKIN_POINTS; i++) {
        body.prevY[i] += (body.vy + JUMP_SPEED) * SUBSTEP_DT;
        body.prevX[i] += (body.vx - newVx) * SUBSTEP_DT;
      }
      body.airJump = false;
      body.jumpCooldown = 0.3;
      rings.push({ x: body.cx, y: body.maxY, size: 30, age: 0, life: 0.22 });
      sfx('jump');
    }
  }

  // Crouch deflates, slam over-inflates, otherwise relax to 1
  const target = body.charging ? 1 - 0.3 * body.charge : (body.puffTime > 0 ? body.puffAmount : 1);
  body.pressure += (target - body.pressure) * (body.puffTime > 0 ? 0.55 : 0.2);
}

function release(body, opponent) {
  const chargeLevel = Math.max(0.2, body.charge);
  // Past half charge, power keeps rising but more slowly (full charge =
  // 0.8 power), so holding all the way pays off without being absurd.
  const power = chargeLevel <= 0.5 ? chargeLevel : 0.5 + (chargeLevel - 0.5) * 0.6;
  body.charging = false; body.charge = 0; body.slamCooldown = SLAM_COOLDOWN;
  body.puffTime = 0.14; body.puffAmount = 1 + 0.25 * power;
  const dx = opponent.cx - body.cx, dy = opponent.cy - body.cy, dist = Math.hypot(dx, dy) || 1;
  if (dist < SLAM_RANGE) {
    const dirX = dx / dist, dirY = dy / dist;
    const force = 180 + 683 * power, lift = 57 + 115 * power;
    const pushVx = dirX * force, pushVy = dirY * force * 0.35 - lift;
    for (let i = 0; i < SKIN_POINTS; i++) {
      opponent.prevX[i] -= pushVx * SUBSTEP_DT; opponent.prevY[i] -= pushVy * SUBSTEP_DT;   // shove target
      body.prevX[i] += pushVx * 0.22 * SUBSTEP_DT;               // recoil
    }
    opponent.stunTime = 0.08 + 0.14 * power;
    opponent.knocked = true; opponent.knockGrace = 0.15;       // let the knockback slide
    shake = Math.max(shake, 2 + 6 * chargeLevel);
    rings.push({ x: (body.cx + opponent.cx) / 2, y: (body.cy + opponent.cy) / 2, size: 34 + 36 * chargeLevel, age: 0, life: 0.28 });
    sfx('slam', chargeLevel);
  } else {
    sfx('puff');
  }
}

function afterPhysics(body, dt) {
  const vyBefore = body.vy;
  body.vx = (body.cx - body.lastCx) / dt; body.vy = (body.cy - body.lastCy) / dt;
  body.lastCx = body.cx; body.lastCy = body.cy;
  const wasOnGround = body.onGround;
  body.onGround = body.touchingGround;
  if (body.onGround && !wasOnGround && vyBefore > 350) {
    sfx('land');
  }
}

// ── Update ──────────────────────────────────────────────────────────
function update(dt) {
  if (mode === 'title') {
    if (pressed.Digit1 || pressed.Numpad1) startMatch(true);
    else if (pressed.Digit2 || pressed.Numpad2) startMatch(false);
    else if (pressed.ArrowUp || pressed.KeyW) menuSelection = 0;
    else if (pressed.ArrowDown || pressed.KeyS) menuSelection = 1;
    else if (pressed.Enter || pressed.Space) startMatch(menuSelection === 0);
    else if (pressed.ArrowLeft || pressed.KeyA) cycleDifficulty(-1);
    else if (pressed.ArrowRight || pressed.KeyD) cycleDifficulty(1);
  } else if (mode === 'over' && (pressed.Space || pressed.Enter)) {
    startMatch(vsCPU);
  }
  if (pressed.Escape && mode !== 'title') toTitle();
  if (pressed.KeyM) muted = !muted;

  const [p1, p2] = bodies;
  let input1 = {}, input2 = {};
  if (mode === 'title') {
    input1 = cpuInput(p1, p2, dt, CPU_LEVELS[1]); input2 = cpuInput(p2, p1, dt, CPU_LEVELS[1]); // attract mode
  } else if (mode === 'fight' || mode === 'ringout') {
    input1 = playerInput(0);
    input2 = vsCPU ? cpuInput(p2, p1, dt, CPU_LEVELS[difficulty]) : playerInput(1);
  } else if (mode === 'over') {
    // result screen: nobody fights (it read as the next match starting
    // under the old "wins" text); the winner just hops now and then
    const hop = { jump: Math.random() < 0.04 };
    if (winner === 0) input1 = hop; else input2 = hop;
  }
  applyInput(p1, p2, input1, dt);
  applyInput(p2, p1, input2, dt);
  stepPhysics();
  afterPhysics(p1, dt); afterPhysics(p2, dt);

  stateTimer -= dt; messageTimer -= dt;
  // You lose by falling out the bottom of the screen (whole blob gone),
  // not by crossing some line under the ring: hanging off the edge or
  // dropping a little is still alive. The bottom depends on framing.
  const bottom = Math.min(1400, (screenH - offsetY) / SCALE);
  const p1Out = p1.minY > bottom, p2Out = p2.minY > bottom;

  if (mode === 'title' || mode === 'over') {
    // free play: just respawn whoever falls
    if ((p1Out || p2Out) && respawnTimer <= 0) respawnTimer = 1.2;
    if (respawnTimer > 0 && (respawnTimer -= dt) <= 0) newRound();
  } else if (mode === 'ready' && stateTimer <= 0) {
    mode = 'fight'; message = 'SUMO!'; messageTimer = 0.7; sfx('go');
  } else if (mode === 'fight' && (p1Out || p2Out)) {
    // first one out loses; if both leave on the same frame, the one
    // further down left first. No draws.
    loser = p1Out && p2Out ? (p1.minY > p2.minY ? 0 : 1) : p1Out ? 0 : 1;
    mode = 'ringout'; stateTimer = 0.9; // short beat, next round
    message = (loser === 1 && vsCPU ? 'CPU' : COLORS[loser].name) + ' FELL'; messageTimer = 0.9;
    shake = Math.max(shake, 10);
    sfx('out');
  } else if (mode === 'ringout' && stateTimer <= 0) {
    scores[1 - loser]++;
    if (scores[0] >= WINS_NEEDED || scores[1] >= WINS_NEEDED) {
      const winnerIdx = scores[0] >= WINS_NEEDED ? 0 : 1;
      winner = winnerIdx;
      mode = 'over';
      message = (winnerIdx === 1 && vsCPU ? 'CPU' : COLORS[winnerIdx].name) + ' WINS';
      messageTimer = 1e9;
      sfx('win');
      newRound();
    } else {
      newRound();
    }
  }

  for (let i = rings.length - 1; i >= 0; i--) {
    if ((rings[i].age += dt) >= rings[i].life) rings.splice(i, 1);
  }
  shake *= 0.85;
  updateTouchButtons();
  for (const k in pressed) delete pressed[k];
}

// ── Audio (tiny synth blips) ────────────────────────────────────────
let audioCtx = null, muted = false;
function unlockAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function sfx(type, amount = 1) {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const env = (f0, f1, dur, vol, wave) => {
    osc.type = wave;
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(f1, now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now); osc.stop(now + dur + 0.02);
  };
  switch (type) {
    case 'jump': env(220, 560, 0.13, 0.10, 'sine'); break;
    case 'land': env(110, 45, 0.10, 0.12, 'sine'); break;
    case 'puff': env(300, 120, 0.08, 0.05, 'triangle'); break;
    case 'slam': env(160 + 60 * amount, 40, 0.22, 0.10 + 0.08 * amount, 'square'); break;
    case 'go':   env(520, 780, 0.18, 0.08, 'square'); break;
    case 'out':  env(440, 70, 0.70, 0.12, 'triangle'); break;
    case 'win':  env(392, 1046, 0.50, 0.08, 'square'); break;
  }
}

// ── Render ──────────────────────────────────────────────────────────
// Minimal: flat paper, one ink bar for the ring, flat-colour blobs with a
// uniform ink outline and two dot eyes. Expression lives in the eyes and
// the outline weight only.
let DPR = 1, screenW = 0, screenH = 0, SCALE = 1, offsetX = 0, offsetY = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  screenW = innerWidth; screenH = innerHeight;
  canvas.width = screenW * DPR; canvas.height = screenH * DPR;
  canvas.style.width = screenW + 'px'; canvas.style.height = screenH + 'px';
  // Portrait: frame just the ring (700 wide) instead of squeezing the
  // whole 1000-wide world into a thin strip, and sit it a bit high so the
  // thumb buttons get the bottom of the screen.
  const portrait = screenW < screenH;
  SCALE = Math.min(screenW / (portrait ? 700 : WORLD_W), screenH / WORLD_H);
  offsetX = (screenW - WORLD_W * SCALE) / 2;
  offsetY = (screenH - WORLD_H * SCALE) * (portrait ? 0.38 : 0.5);
}
addEventListener('resize', resize);

function drawRing() {
  ctx.fillStyle = PALETTE.ink;
  ctx.beginPath();
  ctx.roundRect(RING_LEFT, RING_TOP, RING_RIGHT - RING_LEFT, RING_THICKNESS, RING_THICKNESS / 2);
  ctx.fill();
}

// Closed Catmull-Rom through the skin points → smooth, even outline
function blobPath(body) {
  const x = body.x, y = body.y;
  ctx.beginPath();
  ctx.moveTo(x[0], y[0]);
  for (let i = 0; i < SKIN_POINTS; i++) {
    const i0 = i === 0 ? SKIN_POINTS - 1 : i - 1, i2 = (i + 1) % SKIN_POINTS, i3 = (i + 2) % SKIN_POINTS;
    ctx.bezierCurveTo(
      x[i] + (x[i2] - x[i0]) / 6,  y[i] + (y[i2] - y[i0]) / 6,
      x[i2] - (x[i3] - x[i]) / 6,  y[i2] - (y[i3] - y[i]) / 6,
      x[i2], y[i2]);
  }
  ctx.closePath();
}

function drawBody(body, opponent) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  blobPath(body);
  ctx.fillStyle = body.color.fill;
  ctx.fill();
  ctx.lineWidth = 4 + (body.charging ? 4 * body.charge : 0);
  ctx.strokeStyle = PALETTE.ink;
  ctx.stroke();

  // eyes stay upright while the skin tumbles, and track the opponent
  const width = body.maxX - body.minX, height = body.maxY - body.minY;
  const eyeSpread = width * 0.16, eyeY = body.cy - height * 0.12;
  const dx = opponent.cx - body.cx, dy = opponent.cy - body.cy, dist = Math.hypot(dx, dy) || 1;
  const lookX = dx / dist * 2, lookY = dy / dist * 2;
  ctx.fillStyle = PALETTE.ink; ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3.5;
  for (const side of [-1, 1]) {
    const eyeX = body.cx + side * eyeSpread;
    if (body.stunTime > 0) {                    // dazed: flat
      ctx.beginPath(); ctx.moveTo(eyeX - 4, eyeY); ctx.lineTo(eyeX + 4, eyeY); ctx.stroke();
    } else if (body.charging) {             // straining: slanted toward centre
      ctx.beginPath(); ctx.moveTo(eyeX - side * 4, eyeY + 2); ctx.lineTo(eyeX + side * 4, eyeY - 2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(eyeX + lookX, eyeY + lookY, body.puffTime > 0 ? 4.5 : 3.5, 0, TAU); ctx.fill();
    }
  }

  // player label: 1 / 2, or "cpu" for the computer
  const isCPU = body.idx === 1 && vsCPU && mode !== 'title';
  const label = isCPU ? 'cpu' : String(body.idx + 1);
  const size = Math.min(isCPU ? 17 : 26, height * (isCPU ? 0.2 : 0.3));
  ctx.font = `700 ${Math.round(size)}px Fredoka, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(label, body.cx, body.cy + height * 0.2);
}

function drawRings() {
  ctx.strokeStyle = PALETTE.ink;
  for (const ring of rings) {
    const progress = ring.age / ring.life, ease = 1 - (1 - progress) * (1 - progress);
    ctx.lineWidth = 5 * (1 - progress);
    ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.size * (0.3 + 0.7 * ease), 0, TAU); ctx.stroke();
  }
}

const MIN_TEXT_PX = 11;
function text(str, x, y, size, alpha = 1, align = 'center', color = PALETTE.ink) {
  size = Math.max(size, MIN_TEXT_PX / SCALE);
  ctx.globalAlpha = alpha;
  ctx.font = `600 ${size}px Fredoka, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const diffName = CPU_LEVELS[difficulty].name;
  if (mode === 'title') {
    text('soft body sumo', WORLD_W / 2, IS_TOUCH ? 190 : 176, 40);
    if (IS_TOUCH) {
      text('tap to play', WORLD_W / 2, 240, 16, 0.7);
      text(`cpu   \u2039 ${diffName} \u203a`, WORLD_W / 2, MENU_DIFF_Y, 15, 0.55);
      text('\u25c0 \u25b6 move    \u25b2 jump    hold \u25cf to slam', WORLD_W / 2, 512, 12, 0.45);
    } else {
      // selected option: full ink + a dot marker; the other is faded
      const opt = (label, y, i) => {
        const selected = menuSelection === i;
        text(label, WORLD_W / 2, y, 17, selected ? 1 : 0.4);
        if (selected) {
          const width = ctx.measureText(label).width;
          ctx.fillStyle = PALETTE.ink;
          ctx.beginPath(); ctx.arc(WORLD_W / 2 - width / 2 - 16, y, 4, 0, TAU); ctx.fill();
        }
      };
      opt('vs cpu', MENU_CPU_Y, 0);
      opt('two players', MENU_2P_Y, 1);
      // difficulty only matters vs cpu, so it fades when 2p is selected
      text(`cpu   \u2039 ${diffName} \u203a`, WORLD_W / 2, MENU_DIFF_Y, 14,
           menuSelection === 1 ? 0.25 : hoverItem === 'difficulty' ? 0.9 : 0.55);
      text('\u2191 \u2193 choose     \u2190 \u2192 difficulty     enter start', WORLD_W / 2, 474, 11, 0.4);
      text('p1   a d move   w jump   hold s to slam', WORLD_W / 2, 500, 12, 0.45);
      text('p2   arrows move   \u2191 jump   hold \u2193 to slam', WORLD_W / 2, 524, 12, 0.45);
    }
    return;
  }

  // score: label + three pips per side. Pinned near the top of the
  // screen, which in portrait is well above the world's own top edge.
  const scoreY = Math.min(40, (34 - offsetY) / SCALE);
  text('p1', WORLD_W / 2 - 104, scoreY, 12, 0.6, 'right');
  text(vsCPU ? `cpu \u00b7 ${diffName}` : 'p2', WORLD_W / 2 + 104, scoreY, 12, 0.6, 'left');
  ctx.lineWidth = 2.5; ctx.strokeStyle = PALETTE.ink;
  for (let p = 0; p < 2; p++) {
    for (let k = 0; k < WINS_NEEDED; k++) {
      const x = WORLD_W / 2 + (p ? 1 : -1) * (26 + k * 20);
      ctx.beginPath(); ctx.arc(x, scoreY, 6, 0, TAU);
      if (k < scores[p]) { ctx.fillStyle = COLORS[p].fill; ctx.fill(); }
      ctx.stroke();
    }
  }

  if (messageTimer > 0) {
    const pop = message === 'SUMO!' ? 1 + Math.max(0, messageTimer - 0.5) * 1.5 : 1;
    text(message.toLowerCase(), WORLD_W / 2, mode === 'over' ? 196 : 240, 44 * pop);
  }
  if (mode === 'over') {
    if (IS_TOUCH) {
      text('tap to rematch', WORLD_W / 2, 246, 14, 0.6);
      // "menu" gets an outlined pill so it reads as its own button
      const height = Math.max(30, 34 / SCALE), width = height * 2.6;
      ctx.lineWidth = Math.max(2.5, 2 / SCALE); ctx.strokeStyle = PALETTE.ink; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.roundRect(WORLD_W / 2 - width / 2, MENU_BACK_Y - height / 2, width, height, height / 2); ctx.stroke();
      ctx.globalAlpha = 1;
      text('menu', WORLD_W / 2, MENU_BACK_Y, 14, 0.6);
    } else {
      text('space  rematch      esc  menu', WORLD_W / 2, 246, 13, 0.55);
    }
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(0, 0, screenW, screenH);

  const shakeX = (Math.random() - 0.5) * shake, shakeY = (Math.random() - 0.5) * shake;
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, (offsetX + shakeX * SCALE) * DPR, (offsetY + shakeY * SCALE) * DPR);

  drawRing();
  const [p1, p2] = bodies;
  drawBody(p1, p2); drawBody(p2, p1);
  drawRings();
  drawHUD();
}

// ── Main loop: fixed timestep ───────────────────────────────────
let lastTime = performance.now(), accumulator = 0;
function loop(now) {
  const frameDt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  accumulator += frameDt;
  let steps = 0;
  while (accumulator >= DT && steps < 5) { update(DT); accumulator -= DT; steps++; }
  if (steps === 5) accumulator = 0;
  draw();
  requestAnimationFrame(loop);
}

resize();
newRound();
document.fonts.load('600 20px Fredoka');
document.fonts.load('700 20px Fredoka');
requestAnimationFrame(loop);
</script>
</body>

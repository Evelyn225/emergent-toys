<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16"
    href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-16x16.png">
  <link rel="manifest" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/site.webmanifest">
  <title>ASCII City</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; position: fixed; inset: 0; z-index: 1; }
  </style>
</head>
<body>
<a href="index.html" id="home"
  style="display: none; position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.2)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.2)'">
  <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>
<canvas id="c"></canvas>
<script src="ascii-city.bundle.js"></script>
</body>
</html>

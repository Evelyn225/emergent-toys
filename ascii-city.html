  onmouseover="this.style.transform='scale(1.2)'"

       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
// City: 1 unit ~ 10m, eye ~1.7m. Interiors: 1 unit = 1m.
const FS = 12, MAXD = 40, FOV = 1.1, RAMP = '.:-=+*#%@', NONE = 255;

const hash = (a, b, c = 0) => {
  let h = (a * 374761393 + b * 668265263 + c * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const fract = v => v - Math.floor(v), mod = (v, m) => ((v % m) + m) % m, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function noise(x, y, s) { // smooth value noise
  const xi = Math.floor(x), yi = Math.floor(y), u = x - xi, v = y - yi, su = u * u * (3 - 2 * u), sv = v * v * (3 - 2 * v);
  const h = (a, b) => hash(a, b, s);
  return (h(xi, yi) * (1 - su) + h(xi + 1, yi) * su) * (1 - sv) + (h(xi, yi + 1) * (1 - su) + h(xi + 1, yi + 1) * su) * sv;
}
const pick = a => a[Math.random() * a.length | 0];
const NB = 16, N = NB * 8; // the city is NB x NB blocks of 8x8 cells, repeating forever
const rel = v => mod(v + N / 2, N) - N / 2; // nearest copy in the repeating world

// ---- colors: palette index = base*16 + brightness(0..15); NONE = no background
const BASES = [[200,200,230],[255,210,90],[230,50,50],[60,110,255],[240,240,240],[255,200,0],[60,200,90],
               [230,170,130],[255,170,60],[40,230,255],[255,60,220],[170,80,55],[255,120,30]];
const [GRAY, YEL, RED, BLUE, WHITE, TAXI, GREEN, SKIN, WARM, CYAN, MAG, BRICK, ORANGE] = BASES.keys();
const PAL = [], PALRGB = [];
for (const [r, gg, b] of BASES) for (let i = 0; i < 16; i++) {
  const f = 0.1 + i / 15 * 0.9, c = [r * f | 0, gg * f | 0, b * f | 0];
  PALRGB.push(c); PAL.push(`rgb(${c})`);
}
const C = (b, l) => b << 4 | clamp(l | 0, 0, 15);
const NEON = [MAG, CYAN, RED, GREEN], ITEM_COL = [RED, YEL, GREEN, BLUE, MAG, ORANGE, CYAN, WHITE];

// ---- shops
const WORDS = ['HOTEL','BAR','PIZZA','24/7','CAFE','RAMEN','PAWN','DELI','LIQUOR','BOOKS','ARCADE','NOODLES',
  'LAUNDRY','BARBER','PHARMACY','TATTOO','SUSHI','TACOS','FLORIST','RECORDS','GYM','DINER','BANK','VIDEO',
  'PHONES','KEBAB','DONUTS','THAI','CINEMA','MOTEL','KARAOKE','DUMPLINGS','PET SHOP','HARDWARE','COFFEE','PHO'];
const PRODUCE = ['GROCERY','MARKET','FRUIT','BAKERY','BODEGA'];
const GLYPHS = { BOOKS: '|][|', RECORDS: '()O', VIDEO: '[]', LIQUOR: 'il!', BAR: 'il!Y', PHARMACY: '+=o', PHONES: '[]#',
  HARDWARE: 'T7/', FLORIST: '*@&', 'PET SHOP': '~>o', ARCADE: '[]#', TATTOO: '*%', LAUNDRY: 'O@' };
const LINES = ['Welcome to {}!', 'Looking for anything special?', 'Cash only, sorry.', 'Nice weather, huh?', 'We close at 2am.'];
// storefront kinds: lit display, closed shutter, neon interior, produce stand out front, apartment lobby door
const SHOP_LIT = 0, SHOP_SHUT = 1, SHOP_NEON = 2, SHOP_PRODUCE = 3, SHOP_APTS = 4;
const shopOf = seed => {
  let kind = (seed * 7919 | 0) % 4;
  if (kind === SHOP_SHUT && fract(seed * 331) < 0.5) kind = SHOP_APTS;
  const words = kind === SHOP_PRODUCE ? PRODUCE : WORDS;
  const word = kind === SHOP_APTS ? 'No.' + (100 + (seed * 900 | 0)) : words[(seed * 104729 | 0) % words.length];
  return { kind, word, neon: kind === SHOP_APTS ? WHITE : NEON[(seed * 1000 | 0) % 4], signed: seed > 0.25 || kind === SHOP_APTS, glyphs: GLYPHS[word] || 'o#=@' };
};

// ---- map: N x N tile, repeats forever. 8x8 blocks: 2-wide streets, 2x2 lots of 3x3 buildings.
// Some blocks are left open: parks, plazas, and one 2x2-block waterfront per tile (rarer than parks).
const baseKind = (bx, by) => {
  const h = hash(bx & (NB - 1), by & (NB - 1), 7);
  // per 256-block city: ~5 parks, 4 landmarks, 3 construction sites, ~9 plazas (plus the one waterfront)
  return h < 0.01 ? 'park' : h < 0.042 ? 'landmark' : h < 0.06 ? 'construction' : h < 0.085 ? 'plaza' : '';
};
const WATER = (() => {
  let best = [3, 3], bh = 2;
  for (let bx = 0; bx < NB - 1; bx++) for (let by = 0; by < NB - 1; by++) {
    if (baseKind(bx, by) || baseKind(bx + 1, by) || baseKind(bx, by + 1) || baseKind(bx + 1, by + 1)) continue;
    const h = hash(bx, by, 81); if (h < bh) { bh = h; best = [bx, by]; }
  }
  return best;
})();
const blockKind = (bx, by) => { bx &= NB - 1; by &= NB - 1; return (bx - WATER[0]) >>> 0 < 2 && (by - WATER[1]) >>> 0 < 2 ? 'water' : baseKind(bx, by); };
const map = new Uint8Array(N * N), STY = new Uint8Array(N * N), SEED = new Float32Array(N * N), SHOP = [];
// landmarks: each landmark block gets the next type in turn, so you see a mix
// STY 3 clock tower, 4 cathedral, 5 video-screen tower, 6 construction frame (radio mast is a sprite on a plaza)
const LANDMARK_TYPES = ['clock', 'cathedral', 'screens', 'radio'], landmarkOf = new Map();
for (let bx = 0, n = 0; bx < NB; bx++) for (let by = 0; by < NB; by++)
  if (blockKind(bx, by) === 'landmark') landmarkOf.set(bx * NB + by, LANDMARK_TYPES[n++ % 4]);
function setCells(bx, by, x0, y0, x1, y1, h, sty) { // block-local cell rectangle [x0..x1] x [y0..y1]
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const i = (by * 8 + y) * N + bx * 8 + x; map[i] = h; STY[i] = sty; }
}
for (let bx = 0; bx < NB; bx++) for (let by = 0; by < NB; by++) {
  const kind = blockKind(bx, by), lm = landmarkOf.get(bx * NB + by);
  if (lm === 'clock') setCells(bx, by, 4, 4, 5, 5, 12, 3);
  if (lm === 'cathedral') { setCells(bx, by, 3, 4, 6, 7, 3, 4); setCells(bx, by, 3, 3, 3, 3, 8, 4); setCells(bx, by, 6, 3, 6, 3, 8, 4); }
  if (lm === 'screens') setCells(bx, by, 3, 3, 6, 6, 6, 5);
  if (kind === 'construction') setCells(bx, by, 2, 2, 4, 4, 3 + (hash(bx, by, 96) * 3 | 0), 6);
}
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  if (x % 8 < 2 || y % 8 < 2) continue;
  const bx = x >> 3, by = y >> 3;
  if (blockKind(bx, by)) continue;
  const lot = [bx * 2 + ((x % 8 - 2) / 3 | 0), by * 2 + ((y % 8 - 2) / 3 | 0)], i = y * N + x;
  map[i] = 1 + (hash(...lot) ** 2 * 8 | 0); // height 1..8 (10-80m)
  const s = hash(...lot, 11) * 4 | 0;
  STY[i] = s === 3 ? 7 : s; // 0 office, 1 glass, 2 brick, 7 tenement (3-6 are taken by landmarks)
  SEED[i] = hash(...lot, 5);
  SHOP[i] = shopOf(SEED[i]);
}
const idx = (x, y) => (y & (N - 1)) * N + (x & (N - 1));
// open water inside the waterfront blocks (the boardwalk ring around it is walkable)
const isWater = (wx, wy) => {
  const lx = mod(wx, 8), ly = mod(wy, 8);
  return lx > 2.35 && lx < 7.65 && ly > 2.35 && ly < 7.65 && blockKind(Math.floor(wx / 8), Math.floor(wy / 8)) === 'water';
};

// ---- ascii sprites
const pad = a => { const w = Math.max(...a.map(l => l.length)); return a.map(l => l.padEnd(w)); };
const MIR = { '/': '\\', '\\': '/', '(': ')', ')': '(', '[': ']', ']': '[' };
const mirror = a => a.map(l => [...l].reverse().map(c => MIR[c] || c).join(''));
const ART = {
  carSide: pad(['    _________', ' __/##|###|##\\___', '|]   __     __  O|', "'--(@@)---(@@)--'"]),
  carFront: pad(['  _______', ' /#######\\', '|O|=====|O|', "'(@)---(@)'"]),
  carBack: pad(['  _______', ' /#######\\', '|]|_____|[|', "'(@)---(@)'"]),
  walkA: pad([' _ ', '(_)', '/|\\', ' | ', '/ \\']),
  walkB: pad([' _ ', '(_)', '/|\\', ' | ', ' | ']),
  lamp: pad(['.-=-.', "'---'", '  |', '  |', '  |', '  |', '  |', '  |', ' _|_']),
  signal: pad(['.-.', '(O)', "'-'", ' |', ' |', ' |', ' |', '_|_']),
  tree: pad(['   ,@@%,', ' ,@%@@@%@,', '@@%@@%@@@%@', '%@@@%@@%@@@', " '@%@@@%@'", "   '\\|/'", '    |', '    |']),
  bench: pad([' _____', '|_____|', "'     '"]),
  antenna: pad([' *', ' |', '-+-', ' |', ' |', '-+-', ' |', ' |']),
  tank: pad(['  ___', ".'   '.", '|=====|', '|=====|', "'.___.'", ' /| |\\', '/ | | \\']),
  counter: pad([' .------------------------.', ' |  [$]            .---.  |', ' |                 |===|  |', ' |________________________|']),
  keeper: pad(['  ___', ' (o o)', '  \\-/', ' /|#|\\', '/ |#| \\', '  |_|', '  / \\', ' /   \\']),
  sitter: pad(['  ___', ' (o o)', '  \\-/', ' /|#|\\', " '---'"]),
  sitterBack: pad(['  ___', ' (   )', '  | |', ' /|#|\\', " '---'"]), // seen from behind
  sail: pad(['    |\\', '    | \\', '    |  \\', '    |___\\', ' ___|_____', ' \\_______/']),
  tug: pad(['    _|_', ' __|o_o|__', ' \\_o__o__/']),
  stool: pad([' ___', '(___)', '  |', '  |', ' _|_']),
  barTop: pad([' __________________________________', '|  o   o    [$]    o    o     o   o |', '|==================================|', '|                                  |', '|__________________________________|']),
  table: pad([' _________', '|_________|', '    | |', '   _|_|_']),
  jukebox: pad([' .-----.', '/ ((o)) \\', '|=======|', '|:::::::|', '|=======|', "'-------'"]),
  cart: pad([' _____', '|@@@@@|', '|_____|', ' o   o']),
  seats: pad(['[_][_][_][_][_][_][_][_][_][_]', ' |  |  |  |  |  |  |  |  |  |']),
  desk: pad([' ______________', '| [=]   BELL o |', '|______________|', '|              |', '|______________|']),
  plant: pad(['  \\|/', ' -@@@-', '  /|\\', ' [___]']),
  pole: pad(['|', '|', '|', '|', '|', '|']),
  longSeat: pad([' ____________', '|____________|', "'            '"]),
  train: pad([' ____________________________________________________',
              '|  ____   ____  |    |  ____   ____  |    |  ____   _|',
              '| |####| |####| |    | |####| |####| |    | |####| |#|',
              '| |####| |####| |    | |####| |####| |    | |####| |#|',
              '|               |    |               |    |          |',
              '|===============|====|===============|====|==========|',
              "'-(O)-----(O)---'----'-(O)-----(O)---'----'-(O)------'"]),
};
Object.assign(ART, {
  spire: pad(['   +', '   ^', '  /|\\', '  |+|', ' /|||\\', ' |||||', '/|||||\\']),
  radio: pad(['    *', '    |', '   /|\\', '   |X|', '   |X|', '  /|X|\\', '  |XXX|', '  |XXX|', ' /|XXX|\\', ' |XXXXX|', ' |XXXXX|', '/XXXXXXX\\']),
  crane: pad(['          __________________________________',
              ' ___     |\\  /\\  /\\  /\\  /\\  /\\  /\\  /\\  /|',
              '|###|====| \\/  \\/  \\/  \\/  \\/  \\/  \\/  \\/ |',
              " '-'     |_|--------------------------------'",
              '         |X|                    |', '         |X|                    |', '         |X|                   [=]',
              '         |X|', '         |X|', '         |X|', '         |X|', '         |X|', '         |X|', '         |X|',
              '         |X|', '         |X|', '        _|X|_']),
  fence: pad(['|==|==|==|==|', '|  |  |  |  |']),
  treadmill: pad(['  ____', ' |[::]|', ' |    |', '/______\\']),
  rack: pad(['|=O====O=|', '|=O====O=|', '|=O====O=|', '|_________|']),
  barberChair: pad(['  ___', ' |   |', ' |___|', '  /|\\', ' /_|_\\']),
  barberPole: pad(['(=)', '|/|', '|/|', '|/|', '|/|', '(=)']),
  bankCounter: pad(['.________.________.________.', '|  |  |  |  |  |  |  |  |  |', '|__|__|__|__|__|__|__|__|__|', '|                          |', '|__________________________|']),
  stage: pad(['.______________.', '|______________|']),
  speaker: pad(['.---.', '|(O)|', '|(o)|', "'---'"]),
  singer: pad([' _  o', '(_)/', '/|', ' |', '/ \\']),
  cage: pad(['.----.', '|####|', '|#oo#|', "'----'"]),
  dog: pad(['  /^ ^\\', ' / 0 0 \\', ' V\\ Y /V', '  / - \\', ' |    \\', ' || (__V']),
  bouquet: pad([' *@*@*', '  \\|/', '  [_]']),
});
ART.carSideL = mirror(ART.carSide);
ART.taxiSide = pad(['   _[TAXI]__', ...ART.carSide.slice(1)]);
ART.taxiSideL = mirror(ART.taxiSide).map(l => l.replace('[IXAT]', '[TAXI]'));
ART.taxiFront = pad(['  _[TAXI]_', ...ART.carFront.slice(1)]);
ART.taxiBack = pad(['  _[TAXI]_', ...ART.carBack.slice(1)]);
// arcade cabinets: 4 frames of flickering screen
ART.cab = [0, 1, 2, 3].map(f => { const s = k => [0, 1, 2].map(j => '*@#+o~%'[hash(f, k * 3 + j, 61) * 7 | 0]).join('');
  return pad([' _____', '|.---.|', `||${s(0)}||`, `||${s(1)}||`, "|'---'|", '| o o |', '|_____|']); });
const billboard = t => pad(['+' + '-'.repeat(t.length + 2) + '+', '| ' + t + ' |', '+' + '-'.repeat(t.length + 2) + '+',
                            '  |' + ' '.repeat(t.length - 2) + '|', '  |' + ' '.repeat(t.length - 2) + '|']);
const ADS = ['DRINK COLA', 'NEO PHONES', 'EAT AT JOES', 'MEGA BANK', 'FLY AIR 9', 'BUY GOLD', 'SLEEP MORE', 'ROBO TAXI', 'SHOES 50% OFF', 'VOTE NOBODY'];

// lamps stand at the curb edge of the sidewalk (sidewalk is 0..0.3), two per block side
const CURB = 0.25, LAMP_AT = [3.5, 6.5];
const lamps = [];
for (let i = 0; i < NB; i++) for (const o of [CURB, 2 - CURB]) for (let j = 0; j < NB; j++) for (const s of LAMP_AT)
  lamps.push([i * 8 + o, j * 8 + s], [j * 8 + s, i * 8 + o]);
// light pool on the ground, matches lamp positions above
function glow(wx, wy) {
  const lx = mod(wx, 8), ly = mod(wy, 8);
  const toCurb = v => Math.min(Math.abs(v - CURB), Math.abs(v - 2 + CURB), Math.abs(v - 8 - CURB));
  const toLamp = v => Math.min(...LAMP_AT.map(s => Math.abs(v - s)));
  const ex = toCurb(lx), ay = toLamp(ly), ey = toCurb(ly), ax = toLamp(lx);
  return Math.max(0, 1 - Math.sqrt(Math.min(ex * ex + ay * ay, ey * ey + ax * ax)) / 0.45);
}

// parks: grass, a cross of dirt paths through the middle (block coords 2..8, center 5), a pond, trees, benches
const POND = [3.5, 3.5, 0.85]; // block-local x, y, base radius
// a lumpy, slightly oval pond outline (different per park); `pad` grows it, for shores and keeping trees out
function inPond(lx, ly, bx, by, pad = 0) {
  const ex = (lx - POND[0]) / 1.15, ey = ly - POND[1], ang = Math.atan2(ey, ex);
  const edge = POND[2] * (0.75 + 0.55 * noise(Math.cos(ang) * 1.4 + bx * 3.1, Math.sin(ang) * 1.4 + by * 2.3, 13));
  return Math.hypot(ex, ey) < edge + pad;
}
const BENCH = [[0.35, -2], [0.35, 2], [-2, 0.35], [2, -0.35]]; // relative to block center
const parkTrees = [], benches = [], parks = [];
for (let bx = 0; bx < NB; bx++) for (let by = 0; by < NB; by++) {
  const kind = blockKind(bx, by);
  if (kind === 'water') for (const [x, y] of [[5, 2.15], [5, 7.85], [2.15, 5], [7.85, 5]]) benches.push([bx * 8 + x, by * 8 + y]); // boardwalk
  if (kind !== 'park') continue;
  parks.push([bx, by]);
  for (let k = 0; k < 40; k++) {
    const x = 2.3 + hash(bx, by, k * 2) * 5.4, y = 2.3 + hash(bx, by, k * 2 + 1) * 5.4;
    if (Math.abs(x - 5) < 0.5 || Math.abs(y - 5) < 0.5 || inPond(x, y, bx, by, 0.4)) continue;
    parkTrees.push([bx * 8 + x, by * 8 + y]);
  }
  for (const [x, y] of BENCH) benches.push([bx * 8 + 5 + x, by * 8 + 5 + y]);
}
// boats circling inside each water block
const boats = [];
for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++)
  boats.push({ cx: (WATER[0] + i) * 8 + 5, cy: (WATER[1] + j) * 8 + 5, r: 1.2 + hash(i, j, 92) * 0.8, sp: 0.04 + hash(i, j, 93) * 0.05,
               ph: hash(i, j, 94) * 6.28, sail: (i + j) % 2 === 0 });

// landmark and construction-site props
const extras = [];
for (let bx = 0; bx < NB; bx++) for (let by = 0; by < NB; by++) {
  const X = bx * 8, Y = by * 8, lm = landmarkOf.get(bx * NB + by);
  if (lm === 'cathedral') for (const x of [3.5, 6.5])
    extras.push({ x: X + x, y: Y + 3.5, z: 8, w: 0.9, h: 3, art: ART.spire, col: (c, row, L) => C(c === '+' ? YEL : GRAY, c === '+' ? Math.max(L, night * 15) : L) });
  if (lm === 'radio')
    extras.push({ x: X + 5, y: Y + 5, z: 0, w: 2.2, h: 16, art: ART.radio, col: (c, row, L) => c === '*' ? C(RED, fract(T * 0.7) < 0.5 ? 15 : 3) : C(row & 2 ? RED : WHITE, L) });
  if (blockKind(bx, by) === 'construction') {
    extras.push({ x: X + 7, y: Y + 6.2, z: 0, w: 6.5, h: 9, art: ART.crane, col: (c, row, L) => C(c === '#' || c === '=' && row > 3 ? GRAY : YEL, L) });
    for (const s of [3.5, 5, 6.5]) for (const [x, y] of [[s, 2.1], [s, 7.9], [2.1, s], [7.9, s]])
      extras.push({ x: X + x, y: Y + y, z: 0, w: 1.4, h: 0.22, art: ART.fence, col: (c, row, L) => C(c === '=' ? ORANGE : GRAY, L) });
  }
}

// street food: a rare cart at the curb, a few kinds. Two art frames each so the steam/umbrella shimmer.
const VENDOR_TYPES = [
  { name: 'HOT DOGS', item: 'a hot dog', price: 3, color: RED, w: 0.32, art: [
    ['  ~  ~', ' .-~~~~-.', '/HOT DOGS\\', "'---||---'", ' [=====]|', ' |o o o||', " '-O---O'"],
    [' ~  ~', ' .-~~~~-.', '/HOT DOGS\\', "'---||---'", ' [=====]|', ' |o o o||', " '-O---O'"]] },
  { name: 'TACOS', item: 'two tacos', price: 5, color: ORANGE, w: 0.5, art: [
    ['   ~   ~', ' ___________', '|  TACOS  |\\', '|[##] [##]| |', '|_________|_|', ' (O)     (O)'],
    ['  ~   ~', ' ___________', '|  TACOS  |\\', '|[##] [##]| |', '|_________|_|', ' (O)     (O)']] },
  { name: 'ICE CREAM', item: 'a double scoop', price: 4, color: MAG, w: 0.3, art: [
    ['  .-~~-.', ' / ICE  \\', "'---||---'", ' |*@*@*|', ' |_____|', '  O   O'],
    ['  .-~~-.', ' /CREAM \\', "'---||---'", ' |@*@*@|', ' |_____|', '  O   O']] },
  { name: 'COFFEE', item: 'a coffee', price: 2, color: BRICK, w: 0.26, art: [
    ['   ~', '  ______', ' |COFFEE|', ' |[] ~~ |', ' |______|', '  O    O'],
    ['    ~', '  ______', ' |COFFEE|', ' |[] ~~ |', ' |______|', '  O    O']] },
  { name: 'NOODLES', item: 'a bowl of noodles', price: 6, color: YEL, w: 0.4, art: [
    ['  ~  ~  ~', ' /\\/\\/\\/\\/\\', '| NOODLES  |', '|~~  ##  ~~|', '|__________|'],
    ['   ~  ~  ~', ' /\\/\\/\\/\\/\\', '| NOODLES  |', '|~~  ##  ~~|', '|__________|']] },
].map(v => ({ ...v, art: v.art.map(pad) }));
const vendors = [];

// ---- traffic lights. 24s cycle: vertical green 0-10, yellow 10-11, all red 11-12, horizontal green 12-22, yellow, all red.
const CYCLE = 24;

const walkSig = (bx, by, vert, t) => { const p = phase(bx, by, t) - (vert ? 0 : 12); return p >= 0 && p < 4; };

for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {

  lights.push([bx + 2 - CURB, by - 0.25, true, bx, by], [bx + CURB, by + 2.25, true, bx, by],
              [bx - 0.25, by + CURB, false, bx, by], [bx + 2.25, by + 2 - CURB, false, bx, by]);
}

// ---- pedestrians: walk a graph of sidewalk corners (offsets 0.12 / 1.88 from each street base).
// Short legs (1.76) cross a street and wait for the walk signal; long legs (6.24) run along a block,
// sometimes detouring through a park (bench rest) or into a shop (hidden for a while).
const people = [];
function spawnPerson() {
  const vert = Math.random() < 0.5, line = (Math.random() * NB | 0) * 8 + pick([0.12, 1.88]);
  const k = Math.random() * NB | 0, along = k * 8 + 2 + Math.random() * 6, dir = pick([-1, 1]), end = dir > 0 ? k * 8 + 8.12 : k * 8 + 1.88;
  people.push({ x: vert ? line : along, y: vert ? along : line, path: [vert ? { x: line, y: end } : { x: end, y: line }],
                last: vert ? [0, dir] : [dir, 0], wait: 0, hidden: false, sp: 0.1 + Math.random() * 0.06,
                shirt: pick([RED, BLUE, GREEN, MAG, ORANGE, WHITE, YEL]), pants: pick([BLUE, GRAY]), ph: Math.random() * 9 });
}
for (let n = 0; n < 300; n++) spawnPerson();

function planPerson(p) {

    const lo = mx ? lx < 1 : ly < 1, crossing = lo ? (mx || my) > 0 : (mx || my) < 0;
    opts.push({ mx, my, crossing, w: crossing ? 1 : 1.5 });

  for (const q of opts) { r -= q.w; if (r <= 0) { o = q; break; } }

    p.path.push({ x: p.x + o.mx * 1.76, y: p.y + o.my * 1.76, fast: true, gate: t => walkSig(bx, by, o.my !== 0, t) });
    return;

  const cx = p.x + o.mx * 3.12 + nrm[0] * 3.12, cy = p.y + o.my * 3.12 + nrm[1] * 3.12; // block center
  const kind = blockKind(Math.floor(mod(cx, N) / 8), Math.floor(mod(cy, N) / 8));
  if (kind === 'park' && Math.random() < 0.6) {
    const [bx_, by_] = pick(BENCH), [sx, sy] = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]), side = pick([-1, 1]);
    const exit = { x: cx + sx * 3.12, y: cy + sy * 3.12 };
    p.path.push({ x: p.x + o.mx * 3.12, y: p.y + o.my * 3.12 }, { x: cx, y: cy },

function stepPeople(dt, t) {
  for (const p of people) {
    if (p.wait > 0) { p.wait -= dt; if (p.wait <= 0) p.hidden = false; continue; }
    if (!p.path.length) planPerson(p);
    const w = p.path[0];
    if (w.gate && !w.go) { if (!w.gate(t)) continue; w.go = true; }
    const ex = rel(w.x - p.x), ey = rel(w.y - p.y), dist = Math.hypot(ex, ey), step = p.sp * (w.fast ? 2.2 : 1) * dt;
    if (dist <= step) {
      p.x = mod(w.x, N); p.y = mod(w.y, N); p.path.shift();
      if (w.stay) { p.wait = w.stay; p.hidden = !!w.hide; }
    } else { p.x = mod(p.x + ex / dist * step, N); p.y = mod(p.y + ey / dist * step, N); p.ph += dt * 4; }

// ---- cars. Lanes: right-hand traffic, lane = street base + 1 +/- 0.4.
// Choose straight/right/left for the next intersection (taxis with a fare steer toward it). B = the intersection's

function plan(c) {

    c.nh = opts.reduce((b, o) => o[0] * ex + o[1] * ey > b[0] * ex + b[1] * ey ? o : b);
  } else { const r = Math.random(); c.nh = opts[r < 0.6 ? 0 : r < 0.8 ? 1 : 2]; }

const cars = [];
while (cars.length < 160) {
  const vert = Math.random() < 0.5, dir = pick([-1, 1]);
  const lane = (Math.random() * NB | 0) * 8 + 1 + (vert ? 0.4 : -0.4) * dir;
  const along = (Math.random() * NB | 0) * 8 + 2.5 + Math.random() * 4.5;
  const x = vert ? lane : along, y = vert ? along : lane;
  if (cars.some(o => Math.hypot(rel(o.x - x), rel(o.y - y)) < 1)) continue;
  const c = { id: cars.length, x, y, hx: vert ? 0 : dir, hy: vert ? dir : 0, v: 0, brake: false,
              cruise: 1 + Math.random() * 0.5, body: pick([RED, BLUE, WHITE, TAXI, TAXI, GREEN, GRAY]) };

// distance ahead of car c to point (x,y) if it's inside c's path (half-width `band`), else Infinity
function ahead(c, x, y, band) {
  const rx = rel(x - c.x), ry = rel(y - c.y), al = rx * c.hx + ry * c.hy;
  return al > 0 && al < 2 && Math.abs(rx * c.hy - ry * c.hx) < band ? al : Infinity;
}

function stepTraffic(dt, t) {

  if (mode === 'walk') obs.push([px, py, 0.2, 0.4]);
  for (const m of people) if (!m.hidden) obs.push([m.x, m.y, 0.12, 0.35]);
  // a car crossing our path sideways is long (0.45), one in line with us is narrow (0.2)
  const cross = (c, o) => Math.abs(c.hx * o.hy - c.hy * o.hx);
  const carGap = (c, o) => ahead(c, o.x, o.y, 0.12 + 0.25 * cross(c, o)) - (0.55 - 0.13 * cross(c, o));
  for (const c of cars) {

    for (const o of cars) if (o !== c) { const g = carGap(c, o); if (g < best) { best = g; c.blk = o; } }
  }
  for (const c of cars) {
    if (c.player) continue; // driven by you
    let room_ = Infinity;
    // both stopped, each waiting on the other: lower id goes

    for (const o of cars) if (o !== c && !stuck(o)) room_ = Math.min(room_, carGap(c, o));
    for (const [x, y, band, gap] of obs) room_ = Math.min(room_, ahead(c, x, y, band) - gap);

    const vert = c.hx === 0, along = vert ? c.y : c.x, dir = c.hx + c.hy;
    const line = mod(((dir > 0 ? c.B : c.B + 2) - along) * dir, N);

      if (s === 'R' || s === 'Y' && line > 0.5) room_ = Math.min(room_, line - 0.25);

// run selfTest() in the console: 3 simulated minutes, reports collisions / stuck cars
function selfTest() {

  const still = new Map();
  for (let k = 0, t = 0; k < 9000; k++, t += 0.02) {
    const before = cars.map(c => c.hx + ',' + c.hy);
    stepTraffic(0.02, t);
    cars.forEach((c, i) => {
      if (before[i] !== c.hx + ',' + c.hy) turns++;
      const s = c.v < 0.01 ? (still.get(c) || 0) + 0.02 : 0; still.set(c, s); worst = Math.max(worst, s);
    });
    for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++)
      if (Math.hypot(rel(cars[i].x - cars[j].x), rel(cars[i].y - cars[j].y)) < 0.3) crashes++;

// ---- game state
let mode = 'walk'; // walk | drive | taxi | room (any interior) | roof
let px = 0.3, py = 4, a = Math.PI / 2, pitch = 0, look = 0;
let T = 0, tod = 20, weather = 'clear', wTimer = 90, rain = 0, fogAmt = 0, wet = 0;
let day, night, dusk, amb, vis, lampsOn, overcast, litT;
let me = null, room = null, roofH = 0, msgText = '', msgT = 0;
let third = true, chaseOn = false, camYaw = 0; // in a car: third-person chase camera (V toggles)

function env(dt) {
  tod = mod(tod + dt * (K.KeyT ? 2 : 0.05), 24); // 20s per game hour; hold T to fast-forward
  if ((wTimer -= dt) < 0) { weather = pick(['clear', 'clear', 'rain', 'fog']); wTimer = 60 + Math.random() * 90; }
  rain += clamp((weather === 'rain') - rain, -dt / 6, dt / 6);
  fogAmt += clamp((weather === 'fog') - fogAmt, -dt / 6, dt / 6);

let cols, rows, cw, CH, COL, BG, ZB, FL, FOGS, BASE;
function resize() {

addEventListener('resize', resize); resize();

let tf, projX, projY, hor, dx, dy, eye, lookHit;
const set = (i, c, col) => { CH[i] = c; COL[i] = col; };

// fog: at draw time every cell's text and background colors are mixed toward the fog color by distance.
// 8 blend levels, with a Bayer dither between neighbouring levels so the gradient stays smooth.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

function fogSteps() {

// ===== city world =====
const sk0 = seed => seed * 1e4 | 0;

function facade(i, u, uStep, z, h, d, side, mx, my, fog, wc) {

  for (const s of stations) dot(s.x, s.y, '#3f3', 5);
  for (const v of vendors) dot(v.x, v.y, '#fa3', 4);
  if (me && me.dest) dot(me.dest[0], me.dest[1], '#f4f', 5);
  // you: an arrow pointing where you face (map y runs down = +y in the world, so world angles draw as-is)
  const [cx, cy] = sx(px, py), ang = me ? Math.atan2(me.hy, me.hx) : a;
  g.fillStyle = '#ff5'; g.beginPath();
  g.moveTo(cx + Math.cos(ang) * 6, cy + Math.sin(ang) * 6);
  g.lineTo(cx + Math.cos(ang + 2.5) * 4, cy + Math.sin(ang + 2.5) * 4);
  g.lineTo(cx + Math.cos(ang - 2.5) * 4, cy + Math.sin(ang - 2.5) * 4);
  g.fill();
  g.fillStyle = '#bbb'; g.fillText('N', x0 + size / 2 - 3, y0 + 1);
}

function hud() {
  minimap();
  const hh = Math.floor(tod), mm = Math.floor(fract(tod) * 60);
  const lines = [`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}  ${weather}`,
                 'WASD move | mouse or arrows look | R/F up/down | shift run | E use | H hail taxi | hold T: time | Y: weather | M: map'];
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, g.measureText(lines[1]).width + 8, FS * 2 + 6);
  g.fillStyle = '#bbb'; lines.forEach((l, k) => g.fillText(l, 4, 3 + k * FS));
  const p = promptText(), y = (mode === 'drive' || mode === 'taxi' ? rows - 6 : rows - 3) * FS;
  for (const [s, yy, col] of [[p, y, '#ff8'], [msgT > 0 ? msgText : '', FS * 4, '#fff']]) {
    if (!s) continue;
    const w = g.measureText(s).width;
    g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect((cv.width - w) / 2 - 6, yy - 3, w + 12, FS + 6);
    g.fillStyle = col; g.fillText(s, (cv.width - w) / 2, yy);
  }
}

// ---- actions
function curbOf(c) { // sidewalk spot on the car's right, next to its lane
  const vert = Math.abs(c.hy) > Math.abs(c.hx), dir = Math.sign(vert ? c.hy : c.hx) || 1;
  return vert ? [mod(Math.round((c.x - 1) / 8) * 8 + 1 + 0.88 * dir, N), c.y] : [c.x, mod(Math.round((c.y - 1) / 8) * 8 + 1 - 0.88 * dir, N)];
}
function toLane(c) { // snap a car onto the nearest lane in the direction it points and hand it back to the AI
  const vert = Math.abs(c.hy) > Math.abs(c.hx), dir = Math.sign(vert ? c.hy : c.hx) || 1;
  if (vert) { c.x = mod(Math.round((c.x - 1) / 8) * 8 + 1 + 0.4 * dir, N); c.hx = 0; c.hy = dir; }
  else { c.y = mod(Math.round((c.y - 1) / 8) * 8 + 1 - 0.4 * dir, N); c.hx = dir; c.hy = 0; }
  plan(c);
}
function leaveCar() {
  const c = me;
  [px, py] = curbOf(c);
  if (mode === 'drive') { c.player = false; c.v = 0; toLane(c); a += Math.PI / 2; }
  else { say(`Fare: $${(3 + c.fare * 0.6).toFixed(2)}. Thanks!`); c.rider = c.dest = c.arrived = false; plan(c); }
  me = null; mode = 'walk';
}
function setDest(n) {
  const c = me, nearest = pts => pts.reduce((b, p) => Math.hypot(rel(p[0] - c.x), rel(p[1] - c.y)) < Math.hypot(rel(b[0] - c.x), rel(b[1] - c.y)) ? p : b);
  if (n === 1) { c.dest = nearest(parks.map(([bx, by]) => [bx * 8 + 1, by * 8 + 5])); c.destName = 'the park'; }
  else if (n === 4) { c.dest = [WATER[0] * 8 + 1, WATER[1] * 8 + 5]; c.destName = 'the waterfront'; }
  else {
    let p; do p = [(Math.random() * NB | 0) * 8 + 1, (Math.random() * NB | 0) * 8 + 5]; while (n === 2 && Math.hypot(rel(p[0] - c.x), rel(p[1] - c.y)) < 18);
    c.dest = p; c.destName = n === 2 ? 'across town' : 'somewhere';
  }
  plan(c);
}
function enterRoom(kind, extra, spawn) { room = makeRoom(kind, extra); mode = 'room'; [px, py, a] = spawn; pitch = 0; }
function interact() {
  if (mode === 'room') {
    if (room.kind === 'train') return;
    if (nearElevator()) { // up to the roof, standing in the middle of the lot you walked into
      const [mx, my] = room.cell, ox = (mod(mx, 8) - 2) % 3, oy = (mod(my, 8) - 2) % 3;
      roofH = map[idx(mx, my)]; mode = 'roof'; px = mx - ox + 1.5; py = my - oy + 1.5; pitch = 0;
      return say(`Roof, ${roofH * 10}m up`);
    }
    if (canBoard()) {
      const from = room.st;
      return enterRoom('train', { st: from, opts: [1, 2, 3, 4, 5].map(k => (from + k) % stations.length), dest: null, track: 0 }, [2, 2.5, 0.25]);
    }
    return leaveRoom();
  }
  if (mode === 'roof') { mode = 'room'; px = room.def.ex; py = 1.7; a = Math.PI / 2; return; }
  if (mode === 'drive') { if (Math.abs(me.v) < 0.3) leaveCar(); else say('Slow down first.'); return; }
  if (mode === 'taxi') return leaveCar();
  const c = nearestCar(0.5);
  if (c && c.v < 0.6) {
    me = c;
    if (c.body === TAXI) { mode = 'taxi'; c.rider = true; c.hail = false; c.fare = 0; c.dest = null; look = 0; }
    else { mode = 'drive'; c.player = true; c.v = 0; a = Math.atan2(c.hy, c.hx); }
    px = c.x; py = c.y;
    return;
  }
  const ven = nearVendor();
  if (ven) return say(pick([`You buy ${ven.type.item}. Delicious.`, `${ven.type.item[0].toUpperCase() + ven.type.item.slice(1)}, $${ven.type.price}. Worth it.`, `"Enjoy!" says the ${ven.type.name.toLowerCase()} vendor.`]));
  const st = nearStation();
  if (st) return enterRoom('station', { st: stations.indexOf(st), word: st.name, t0: T - 30, ret: [px, py, a] }, [2, 1.7, Math.PI / 2]);
  if (lookHit && lookHit.d < 0.35 && SHOP[idx(lookHit.mx, lookHit.my)]) {
    const sh = SHOP[idx(lookHit.mx, lookHit.my)];
    if (sh.kind === SHOP_SHUT) return say('Closed.');
    const kind = sh.kind === SHOP_APTS ? 'apts' : ROOM_FOR[sh.word] || 'store';
    const r = { ...sh, cell: [lookHit.mx, lookHit.my], ret: [px, py, a], line: pick(LINES).replace('{}', sh.word) };
    enterRoom(kind, r, [0, 0, -Math.PI / 2]);
    px = room.W / 2; py = room.H - 1.6;
  }
}
function leaveRoom() {
  if (room.kind === 'station') { const s = stations[room.st]; px = s.x; py = s.y - 0.12; a = -Math.PI / 2; }
  else { [px, py, a] = room.ret; a += Math.PI; }
  room = null; mode = 'walk';
}
function arriveAt(n) { // off the train onto the destination platform; the train pulls out a few seconds later
  enterRoom('station', { st: n, word: stations[n].name, t0: T - 13 }, [15, 3.6, -Math.PI / 2]); // back from the edge, so E means leave
  say(`${stations[n].name}`);
}
function hail() {
  if (mode !== 'walk') return;
  let best = null, bd = 5;
  for (const c of cars) if (c.body === TAXI && !c.rider && !c.player) { const d = Math.hypot(rel(c.x - px), rel(c.y - py)); if (d < bd) { bd = d; best = c; } }
  if (best) { best.hail = true; say('TAXI!'); } else say('No taxi nearby.');
}

const K = {};
onkeydown = e => {
  K[e.code] = 1;
  if (e.repeat) return;
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyH') hail();
  if (e.code === 'KeyV' && me) third = !third;
  if (e.code === 'KeyM') showMap = !showMap;
  if (e.code === 'KeyY') { weather = { clear: 'rain', rain: 'fog', fog: 'clear' }[weather]; wTimer = 150; say(`Weather: ${weather}`); }
  const n = /^Digit([1-5])$/.exec(e.code);
  if (n && mode === 'taxi' && !me.dest && +n[1] <= 4) setDest(+n[1]);
  if (n && mode === 'room' && room.kind === 'train' && room.dest == null && +n[1] <= room.opts.length) { room.dest = room.opts[n[1] - 1]; room.rideT = 9; }
};
onkeyup = e => K[e.code] = 0;
cv.onclick = () => cv.requestPointerLock();
const clampPitch = () => pitch = clamp(pitch, -1.2, 1.6);
onmousemove = e => {
  if (!document.pointerLockElement) return;
  if (mode === 'taxi') look += e.movementX * 0.003; else if (mode !== 'drive') a += e.movementX * 0.003;
  pitch -= e.movementY * 0.002; clampPitch();
};

const free = (x, y) => {
  if (mode === 'room') return !ROOMW.cell(Math.floor(x), Math.floor(y)) && !(room.def.block && room.def.block(x, y));
  if (mode === 'roof') return map[idx(Math.floor(x), Math.floor(y))] === roofH; // stay on this roof
  return !map[idx(Math.floor(x), Math.floor(y))] && !isWater(x, y);
};
function move(fx, fy) {
  const m = mode === 'room' ? 0.25 : 0.05;
  if (mode === 'room' && roomAt(Math.floor(px + fx * 3), Math.floor(py + fy * 3)) === 'D') return leaveRoom();
  if (free(px + fx + Math.sign(fx) * m, py)) px += fx;
  if (free(px, py + fy + Math.sign(fy) * m)) py += fy;
}
function drive(dt) {
  const c = me, f = (K.KeyW || K.ArrowUp ? 1 : 0) - (K.KeyS || K.ArrowDown ? 1 : 0), s = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
  if (f > 0) c.v += (c.v < 0 ? 2.5 : 1) * dt; else if (f < 0) c.v -= (c.v > 0 ? 2.5 : 0.8) * dt; else c.v *= 1 - 0.7 * dt;
  c.v = clamp(c.v, -0.5, K.ShiftLeft || K.ShiftRight ? 3.2 : 2.2);
  a += s * dt * 1.8 * clamp(c.v / 0.5, -1, 1);
  const hx = Math.cos(a), hy = Math.sin(a), nx = c.x + hx * c.v * dt, ny = c.y + hy * c.v * dt;
  const fx = nx + hx * 0.22 * Math.sign(c.v), fy = ny + hy * 0.22 * Math.sign(c.v); // bumper
  const hit = !free(fx, fy) || cars.some(o => o !== c && Math.hypot(rel(o.x - fx), rel(o.y - fy)) < 0.3)
           || people.some(p => !p.hidden && Math.hypot(rel(p.x - fx), rel(p.y - fy)) < 0.15);
  if (hit) { if (Math.abs(c.v) > 0.8) say('*CRUNCH*', 1); c.v = 0; } else { c.x = mod(nx, N); c.y = mod(ny, N); }
  c.hx = hx; c.hy = hy; c.brake = f < 0; px = c.x; py = c.y;
}

let t0 = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - t0) / 1000); t0 = t; T += dt; msgT -= dt;
  env(dt);
  pitch += ((K.KeyR ? 1 : 0) - (K.KeyF ? 1 : 0)) * dt; clampPitch();
  if (mode === 'walk' || mode === 'room' || mode === 'roof') {
    a += ((K.ArrowRight ? 1 : 0) - (K.ArrowLeft ? 1 : 0)) * 2 * dt;
    const run = K.ShiftLeft || K.ShiftRight, sp = (mode === 'room' ? (run ? 2.5 : 1.6) : run ? 0.8 : 0.5) * dt; // sprint 29 km/h, cars top out at 79
    const f = (K.KeyW || K.ArrowUp ? 1 : 0) - (K.KeyS || K.ArrowDown ? 1 : 0), s = (K.KeyD ? 1 : 0) - (K.KeyA ? 1 : 0);
    const cx = Math.cos(a), cy = Math.sin(a);
    move((cx * f - cy * s) * sp, (cy * f + cx * s) * sp);
  } else if (mode === 'drive') drive(dt);
  stepTraffic(dt, T);
  if (mode === 'taxi') {
    px = me.x; py = me.y;
    const target = Math.atan2(me.hy, me.hx) + look; // camera eases round corners
    a += (mod(target - a + Math.PI, 2 * Math.PI) - Math.PI) * Math.min(1, dt * 4);
    if (me.arrived && me.v < 0.02) leaveCar();
  }
  if (mode === 'room' && room.kind === 'train' && room.dest != null) { // the ride: speed up, cruise, slow down, arrive
    room.rideT -= dt;
    room.track += dt * 2.5 * clamp(room.rideT / 2, 0, 1) * clamp((9 - room.rideT) / 2, 0, 1);
    if (room.rideT <= 0) arriveAt(room.dest);
  }
  chaseOn = !!me && third;
  if (chaseOn) { // render from behind the car, then put the real position back
    const saved = [px, py, a], [cx, cy, yaw] = chaseCam(dt);
    px = cx; py = cy; a = yaw; render(dt); [px, py, a] = saved;
  } else { camYaw = a; render(dt); }
  requestAnimationFrame(loop);
}
// third person: behind and above the car, easing round corners; pulled in if a wall is in the way
function chaseCam(dt) {
  const target = mode === 'taxi' ? a : Math.atan2(me.hy, me.hx);
  camYaw += (mod(target - camYaw + Math.PI, 2 * Math.PI) - Math.PI) * Math.min(1, dt * 5);
  const bx = Math.cos(camYaw), by = Math.sin(camYaw);
  let back = 1.1;
  while (back > 0.15 && !free(me.x - bx * back, me.y - by * back)) back -= 0.05;
  return [me.x - bx * back, me.y - by * back, camYaw];
}
requestAnimationFrame(loop);
</script>

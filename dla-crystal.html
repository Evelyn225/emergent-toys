<body>

<a href="/"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.2)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.2)'">
  <img src="/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>

<div id="stats"></div>
<canvas id="c"></canvas>
<canvas id="glow"></canvas>

<div id="ui">
  <div id="hint"></div>
  <div id="bar">
    <button id="resetBtn" title="one seed in the middle [R]">reset</button>
    <button id="clearBtn" title="empty screen, plant your own [C]">clear</button>
    <button id="pauseBtn" title="[space]">pause</button>
    <label id="stickLabel" title="how likely a walker sticks on contact; lower grows denser, fuzzier crystals">
      stick <input id="stickSlider" type="range" min="5" max="100" value="100"> <span id="stickValue">100%</span>
    </label>
  </div>
</div>

<script>
// ── DLA Crystal ──────────────────────────────────────────────────────
// Diffusion-Limited Aggregation: particles random-walk until they touch
// the growing crystal, then stick forever.
//
// Two ways of feeding walkers to the crystal:
//
//   radial  The classic picture: one seed in the middle, walkers released
//           on a circle just outside it. Fast, because everything is
//           measured from one centre.
//   field   As soon as you plant a seed or draw, crystals can be anywhere,
//           so walkers are released at random spots far from all of them.
//           A coarse distance field over 8x8 blocks says how far each block
//           is from the nearest crystal, which gives every walker a safe
//           free-flight jump the same way the bounding circle does in
//           radial mode.
//
// Speed tricks:
//   · 800 simultaneous walkers so the crystal never waits for one particle
//   · up to 40 sim steps per animation frame
//   · Uint8Array grid for O(1) 8-connected neighbour lookup
//   · Uint32Array view of the pixel buffer: 1 write per pixel vs 4
//   · Radial: spawn radius tracks the crystal edge; kill radius is kept
//     tight so walkers that wander off are quickly recycled
//   · Free-flight jumps: a walker known to be d px clear of every crystal
//     pixel leaps up to d-1 px in one go, collapsing the long approach walk
//   · Squared-distance fast-path avoids sqrt for walkers near the surface
//   · xorshift32 PRNG replaces Math.random() in the hot loop

const canvas    = document.getElementById('c');
const ctx       = canvas.getContext('2d');
const glowCv    = document.getElementById('glow');
const glowCtx   = glowCv.getContext('2d');
const statsEl   = document.getElementById('stats');
const hintEl    = document.getElementById('hint');
const pauseBtn  = document.getElementById('pauseBtn');
const stickSlider = document.getElementById('stickSlider');
const stickValue  = document.getElementById('stickValue');
const TOUCH     = matchMedia('(pointer: coarse)').matches;
const PLANT     = TOUCH ? 'tap to plant a seed  ·  drag to draw' : 'click to plant a seed  ·  drag to draw';
const HINTS = {
  growing: PLANT,
  empty:   (TOUCH ? 'tap' : 'click') + ' to plant a seed  ·  drag to draw something for it to grow on',
  done:    'fully grown  ·  ' + (TOUCH ? 'tap' : 'click') + ' to plant more, or reset',
  paused:  'paused  ·  ' + PLANT,
};

const N_WALKERS     = 800;  // simultaneous random walkers
const STEPS_PER_RAF = 40;   // sim steps per animation frame
const SPAWN_GAP     = 4;    // px beyond maxR where new walkers spawn
const KILL_MARGIN   = 30;   // px beyond spawnR where stray walkers die
const SCALE         = 2;    // sim pixels per screen pixel (chunky low-res look)
const BS            = 3;    // field mode: blocks are 2^BS = 8 sim px square
const B             = 1 << BS;
const FAR           = 255;  // block distance meaning "no crystal anywhere"

// xorshift32 PRNG - ~3x faster than Math.random() in tight loops
let _r = 0xDEADBEEF ^ (Date.now() & 0xFFFFFF);
function rnd()    { _r ^= _r << 13; _r ^= _r >>> 17; _r ^= _r << 5; return (_r >>> 0) / 4294967296; }
function rnd4()   { _r ^= _r << 13; _r ^= _r >>> 17; _r ^= _r << 5; return _r & 3; }
function rndDir() { _r ^= _r << 13; _r ^= _r >>> 17; _r ^= _r << 5; return _r & 255; }

// Precomputed unit-vector table — replaces Math.cos/sin in the hot jump loop
const DIRCOS = new Float32Array(256);
const DIRSIN = new Float32Array(256);
for (let i = 0; i < 256; i++) {
  const a = i * 6.2831853 / 256;
  DIRCOS[i] = Math.cos(a);
  DIRSIN[i] = Math.sin(a);
}

let W, H, cx, cy;
let grid;     // Uint8Array  — 1 if crystal, 0 if empty
let imgData;
let pixels;   // Uint8ClampedArray from ImageData (shared buffer)
let u32;      // Uint32Array view of the same buffer (faster per-pixel writes)

let BW, BH;   // field: size of the block grid
let bdist;    // field: Uint8Array, Chebyshev distance in blocks to the nearest crystal block
let bqueue;   // field: Int32Array BFS queue

let wx, wy;   // Int32Arrays — walker x/y positions
let maxR, maxR2, spawnR, killR2;
let count;    // total particles stuck so far
let lastCount, lastMs, stepBudget;
let rafId = 0;
let done;     // nowhere left to grow
let paused = false;
let mode;     // 'radial' | 'field'
let stickP = 1;   // chance of sticking on contact
let frameNo = 0;

// ── Colour ───────────────────────────────────────────────────────────
// Hue cycles slowly with count so the growth history is visible as
// colour bands: the trunk is one colour, tips are always the newest hue.
function hsl2u32(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (h < 60)  { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  // Pack RGBA into little-endian Uint32: bytes [R,G,B,A] → 0xAABBGGRR
  return (0xFF000000 |
    (((b + m) * 255 | 0) << 16) |
    (((g + m) * 255 | 0) << 8)  |
     ((r + m) * 255 | 0));
}

// ── Field: distance from every block to the nearest crystal block ─────
// Distances only ever shrink as the crystal grows, so each newly occupied
// block just spreads its own distances outward until they stop improving.
function spreadFrom(b0) {
  let head = 0, tail = 0;
  bdist[b0] = 0;
  bqueue[tail++] = b0;
  while (head < tail) {
    const b = bqueue[head++];
    const bx = b % BW, by = (b - bx) / BW;
    const nd = bdist[b] + 1;
    for (let oy = -1; oy <= 1; oy++) {
      const ny = by + oy;
      if (ny < 0 || ny >= BH) continue;
      for (let ox = -1; ox <= 1; ox++) {
        const nx = bx + ox;
        if (nx < 0 || nx >= BW) continue;
        const n = ny * BW + nx;
        if (bdist[n] > nd) { bdist[n] = nd; bqueue[tail++] = n; }
      }
    }
  }
}

function rebuildField() {
  BW = (W + B - 1) >> BS;
  BH = (H + B - 1) >> BS;
  bdist  = new Uint8Array(BW * BH).fill(FAR);
  bqueue = new Int32Array(BW * BH);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!grid[y * W + x]) continue;
      const b = (y >> BS) * BW + (x >> BS);
      if (bdist[b] !== 0) spreadFrom(b);
    }
  }
}

// ── Crystal helpers ──────────────────────────────────────────────────
function stick(x, y) {
  const idx = y * W + x;
  if (grid[idx]) return;
  grid[idx] = 1;
  const hue       = (195 + count * 0.006 + rnd() * 40 - 20) % 360;
  const sat       = 80 + (rnd() * 20 | 0);
  const lightness = 35 + (rnd() * 50 | 0);
  u32[idx]  = hsl2u32(hue, sat, lightness);
  count++;
  const b = (y >> BS) * BW + (x >> BS);
  if (bdist[b] !== 0) spreadFrom(b);
  const dx = x - cx, dy = y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 > maxR2) {
    maxR2  = d2;
    maxR   = Math.sqrt(d2);
    spawnR = maxR + SPAWN_GAP;
    killR2 = (spawnR + KILL_MARGIN) * (spawnR + KILL_MARGIN);
  }
}

function spawnWalker(i) {
  if (mode === 'field') {
    // Somewhere well clear of every crystal: at least 2 blocks away
    let x = 1, y = 1;
    for (let tries = 0; tries < 24; tries++) {
      x = 1 + (rnd() * (W - 2) | 0);
      y = 1 + (rnd() * (H - 2) | 0);
      if (bdist[(y >> BS) * BW + (x >> BS)] >= 3 && !grid[y * W + x]) break;
    }
    wx[i] = x; wy[i] = y;
    return;
  }
  const r  = Math.max(5, spawnR);
  const di = rndDir();
  wx[i] = Math.max(1, Math.min(W - 2, (cx + r * DIRCOS[di]) | 0));
  wy[i] = Math.max(1, Math.min(H - 2, (cy + r * DIRSIN[di]) | 0));
}

// ── Simulation step ──────────────────────────────────────────────────
const DX = new Int8Array([1, -1, 0, 0]);
const DY = new Int8Array([0, 0, 1, -1]);

// A walker next to the crystal sticks, or with low stickiness sometimes
// slides off and keeps walking (which is what makes the crystal denser).
function touching(base) {
  return grid[base - 1]     | grid[base + 1]     |
         grid[base - W]     | grid[base + W]      |
         grid[base - W - 1] | grid[base - W + 1]  |
         grid[base + W - 1] | grid[base + W + 1];
}

function stepRadial() {
  for (let i = 0; i < N_WALKERS; i++) {
    const x   = wx[i], y = wy[i];
    const ddx = x - cx, ddy = y - cy;
    const d2  = ddx * ddx + ddy * ddy;

    // Free-flight jump: walker is outside the crystal bounding circle,
    // so it can safely leap up to clearance pixels in any direction.
    if (d2 > maxR2) {
      const clearance = (Math.sqrt(d2) - maxR - 1) | 0;
      if (clearance > 2) {
        const di = rndDir();
        const nx = Math.max(1, Math.min(W - 2, (x + clearance * DIRCOS[di]) | 0));
        const ny = Math.max(1, Math.min(H - 2, (y + clearance * DIRSIN[di]) | 0));
        const ex = nx - cx, ey = ny - cy;
        if (ex * ex + ey * ey > killR2) { spawnWalker(i); continue; }
        wx[i] = nx; wy[i] = ny;
        continue;
      }
    }

    // Normal single step near the crystal surface
    const d  = rnd4();
    const nx = x + DX[d];
    const ny = y + DY[d];

    // Hit the canvas border → respawn
    if (nx < 1 || nx >= W - 1 || ny < 1 || ny >= H - 1) {
      spawnWalker(i); continue;
    }

    // Wandered past kill radius → respawn
    const ex = nx - cx, ey = ny - cy;
    if (ex * ex + ey * ey > killR2) {
      spawnWalker(i); continue;
    }

    // Touching crystal (8-connected) → stick
    const base = ny * W + nx;
    if (!grid[base] && touching(base) && (stickP >= 1 || rnd() < stickP)) {
      stick(nx, ny);
      spawnWalker(i);
      continue;
    }

    wx[i] = nx;
    wy[i] = ny;
  }
}

function stepField() {
  for (let i = 0; i < N_WALKERS; i++) {
    const x = wx[i], y = wy[i];

    // Free-flight jump: every crystal pixel is at least (d-1)*B px away
    // (Chebyshev, so Euclidean too), so a jump shorter than that is safe.
    const d = bdist[(y >> BS) * BW + (x >> BS)];
    if (d >= 2) {
      const reach = (d - 1) * B - 1;
      const di = rndDir();
      wx[i] = Math.max(1, Math.min(W - 2, (x + reach * DIRCOS[di]) | 0));
      wy[i] = Math.max(1, Math.min(H - 2, (y + reach * DIRSIN[di]) | 0));
      continue;
    }

    const k  = rnd4();
    const nx = x + DX[k];
    const ny = y + DY[k];
    if (nx < 1 || nx >= W - 1 || ny < 1 || ny >= H - 1) continue;   // bump the edge

    const base = ny * W + nx;
    if (grid[base]) continue;   // drawn over: step elsewhere next time
    if (touching(base) && (stickP >= 1 || rnd() < stickP)) {
      stick(nx, ny);
      spawnWalker(i);
      continue;
    }
    wx[i] = nx;
    wy[i] = ny;
  }
}

// ── Init / reset ─────────────────────────────────────────────────────
function allocate() {
  W  = canvas.width  = glowCv.width  = Math.ceil(window.innerWidth  / SCALE);
  H  = canvas.height = glowCv.height = Math.ceil(window.innerHeight / SCALE);
  cx = W >> 1;
  cy = H >> 1;

  grid    = new Uint8Array(W * H);
  imgData = ctx.createImageData(W, H);
  pixels  = imgData.data;
  u32     = new Uint32Array(pixels.buffer);
  u32.fill(0xFF000000); // all pixels → black opaque
}

function start(withSeed) {
  cancelAnimationFrame(rafId);
  rafId = 0;
  allocate();
  rebuildField();
  done = false;
  mode = withSeed ? 'radial' : 'field';

  maxR = 0; maxR2 = 0;
  spawnR = 5;
  killR2 = (5 + KILL_MARGIN) * (5 + KILL_MARGIN);
  count = 0; lastCount = 0; lastMs = performance.now(); stepBudget = 0;

  wx = new Int32Array(N_WALKERS);
  wy = new Int32Array(N_WALKERS);

  if (withSeed) stick(cx, cy); // single seed at centre
  for (let i = 0; i < N_WALKERS; i++) spawnWalker(i);

  render();
  showStats();
  wake();
}

const reset = () => start(true);
const clear = () => start(false);

function setHint() {
  hintEl.textContent = count === 0 ? HINTS.empty
                     : paused      ? HINTS.paused
                     : done        ? HINTS.done
                     :               HINTS.growing;
}

// Run the loop if there is anything for it to do
function wake() {
  setHint();
  if (rafId || paused || done || count === 0) return;
  lastMs = performance.now(); lastCount = count;
  rafId = requestAnimationFrame(frame);
}

// A resize (rotating a phone, or its address bar sliding in and out) keeps
// the crystal: it is copied into the new canvas, re-centred, and growth
// carries on from where it was.
function resize() {
  const oldW = W, oldH = H, oldGrid = grid, oldU32 = u32;
  const oldCx = cx, oldCy = cy;
  if (Math.ceil(window.innerWidth / SCALE) === oldW && Math.ceil(window.innerHeight / SCALE) === oldH) return;
  allocate();
  const dx = cx - oldCx, dy = cy - oldCy;
  for (let y = 0; y < oldH; y++) {
    const ny = y + dy;
    if (ny < 0 || ny >= H) continue;
    for (let x = 0; x < oldW; x++) {
      const nx = x + dx;
      if (nx < 0 || nx >= W || !oldGrid[y * oldW + x]) continue;
      grid[ny * W + nx] = 1;
      u32[ny * W + nx]  = oldU32[y * oldW + x];
    }
  }
  rebuildField();
  for (let i = 0; i < N_WALKERS; i++) spawnWalker(i);
  render();
  // A bigger screen may have room to keep growing.
  if (done) { done = false; wake(); }
}

// ── Render loop ──────────────────────────────────────────────────────
function render() {
  ctx.putImageData(imgData, 0, 0);
  glowCtx.clearRect(0, 0, W, H);
  glowCtx.drawImage(canvas, 0, 0);
}

function showStats(rate) {
  statsEl.textContent =
    `PARTICLES  ${count.toLocaleString()}\n` +
    (mode === 'radial' ? `RADIUS     ${maxR.toFixed(0)}px\n` : '') +
    `RATE       ${rate === undefined ? '-' : rate}`;
}

// Field mode is finished once no block is left that is 2 or more blocks
// from a crystal: walkers would have nowhere to come from.
function fieldFull() {
  for (let b = 0; b < bdist.length; b++) if (bdist[b] >= 2) return false;
  return true;
}

function frame() {
  rafId = 0;
  frameNo++;
  if (mode === 'radial') {
    const t = Math.min(1, maxR / 110);
    stepBudget += Math.max(0.35, t * t * STEPS_PER_RAF);
  } else {
    stepBudget += STEPS_PER_RAF;
  }
  const stepsThisFrame = stepBudget | 0;
  stepBudget -= stepsThisFrame;
  const step = mode === 'radial' ? stepRadial : stepField;
  for (let s = 0; s < stepsThisFrame; s++) step();
  render();

  // Once it fills its space there is nowhere left to grow, so stop
  // instead of spinning walkers forever.
  if ((mode === 'radial' && maxR >= Math.max(cx, cy) - 2) ||
      (mode === 'field' && frameNo % 30 === 0 && fieldFull())) {
    done = true;
    showStats('done');
    setHint();
    return;
  }

  // Update stats at ~4 Hz so DOM writes don't eat into frame budget
  const now = performance.now();
  if (now - lastMs >= 250) {
    const pps = ((count - lastCount) / (now - lastMs) * 1000) | 0;
    showStats(pps.toLocaleString() + ' p/s');
    lastCount = count;
    lastMs    = now;
  }

  rafId = requestAnimationFrame(frame);
}

// ── Planting and drawing ─────────────────────────────────────────────
// Anything planted or drawn means crystals can be anywhere, so growth
// switches to field mode for the rest of this crystal.
function toField() {
  if (mode === 'field') return;
  mode = 'field';
  for (let i = 0; i < N_WALKERS; i++) spawnWalker(i);
}

function plant(x, y) {
  if (x < 1 || x >= W - 1 || y < 1 || y >= H - 1) return;
  stick(x, y);
}

// Bresenham between two sim points, so a fast drag draws an unbroken line
function plantLine(x0, y0, x1, y1) {
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    plant(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

const toSim = (e) => [
  Math.floor(e.clientX / window.innerWidth  * W),
  Math.floor(e.clientY / window.innerHeight * H),
];

let pen = null;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (pen) return;
  canvas.setPointerCapture(e.pointerId);
  toField();
  const [x, y] = toSim(e);
  pen = { id: e.pointerId, x, y };
  plant(x, y);
  done = false;
  render();
  wake();
});
canvas.addEventListener('pointermove', (e) => {
  if (!pen || e.pointerId !== pen.id) return;
  const [x, y] = toSim(e);
  if (x === pen.x && y === pen.y) return;
  plantLine(pen.x, pen.y, x, y);
  pen.x = x; pen.y = y;
  render();
});
const lift = (e) => { if (pen && e.pointerId === pen.id) pen = null; };
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);

// ── Controls ─────────────────────────────────────────────────────────
function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? 'play' : 'pause';
  if (paused) { cancelAnimationFrame(rafId); rafId = 0; }
  wake();
}

function setStick(v) {
  stickP = v / 100;
  stickValue.textContent = v + '%';
}

document.getElementById('resetBtn').addEventListener('click', reset);
document.getElementById('clearBtn').addEventListener('click', clear);
pauseBtn.addEventListener('click', togglePause);
stickSlider.addEventListener('input', () => setStick(+stickSlider.value));
// buttons shouldn't keep focus, or space/enter would press them again
document.querySelectorAll('#bar button').forEach(b => b.addEventListener('click', () => b.blur()));

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'c' || e.key === 'C') clear();
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
});
window.addEventListener('resize', resize);

setStick(+stickSlider.value);
reset();
</script>
</body>
</html>

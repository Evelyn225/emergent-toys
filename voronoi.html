<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #controls {
            position: fixed;
            left: 12px;
            top: 12px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 10px;
            z-index: 102;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 4px;
            padding: 7px 13px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.07em;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
            text-align: left;
        }
        @media (hover: hover) {
            button:hover {
                background: rgba(20, 250, 170, 0.1);
                border-color: rgba(20, 250, 170, 0.4);
                color: rgba(20, 250, 170, 0.95);
            }
        }
        button:active {
            transform: scale(0.96);
            background: rgba(20, 250, 170, 0.16);
        }
        button[hidden] { display: none; }
        #hint {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            line-height: 1.5;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 3px;
            max-width: 160px;
        }
        @media (max-width: 640px) {
            #controls { left: 8px; top: 8px; padding: 7px; gap: 4px; }
            button { padding: 6px 9px; font-size: 10px; letter-spacing: 0.04em; }
            #hint { font-size: 9px; max-width: 130px; }
        }
    </style>
</head>
<body>
    <a href="/"
  style="position: fixed; top: 10px; right: 10px; z-index: 1000;
         line-height: 0; text-decoration: none;
         transition: transform 0.2s cubic-bezier(0.68,-0.55,0.265,1.55);"
  onmouseover="this.style.transform='scale(1.2)'"
  onmouseout="this.style.transform='scale(1)'"
  onmousedown="this.style.transform='scale(0.95)'"
  onmouseup="this.style.transform='scale(1.2)'">
  <img src="/images/go-home.png"
       alt="home" style="width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; display: block;">
</a>
    <div id="controls">
        <button onclick="randomizePoints()">Randomize Points</button>
        <button id="animButton" onclick="toggleAnimation()">Pause</button>
        <button onclick="randomizeColors()">Randomize Colors</button>
        <button id="waveButton" onclick="waveColors()" hidden>Wave Colors</button>
        <div id="hint">click to add a cell<br>drag to move one<br>right-click to remove</div>
    </div>
    <script>
        let points = [];
        let numPoints = 50;
        let delaunay;
        let voronoi;
        let isAnimating = true;
        let time = 0;
        let activeIndex = -1;
        let randomCellColors = null;
        let randomBaseHue = 0;
        let press = null;           // the pointer currently held on the canvas
        const MAX_POINTS = 100;
        const MIN_POINTS = 3;

        // Wave parameters
        const waveParams = {
            frequency: 0.02,
            amplitude: 2,
            colorSpeed: 0.03,
            phaseOffset: 0.5
        };

        function setup() {
            const cnv = createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 1);
            setupPointer(cnv.elt);
            if (matchMedia('(pointer: coarse)').matches) {
                document.getElementById('hint').innerHTML =
                    'tap to add a cell<br>drag to move one<br>hold to remove';
            }
            
            for (let i = 0; i < numPoints; i++) {
                const padding = 50;
                points.push([
                    random(padding, width - padding),
                    random(padding, height - padding)
                ]);
            }
            
            updateVoronoi();
        }

        function updateVoronoi() {
            try {
                delaunay = new d3.Delaunay(points.flat());
                voronoi = delaunay.voronoi([0, 0, width, height]);
            } catch (error) {
                console.error("Error in updateVoronoi:", error);
            }
        }

        function findActiveCell(x = mouseX, y = mouseY) {
            let minDist = Infinity;
            let closestIndex = -1;
            
            for (let i = 0; i < points.length; i++) {
                const d = dist(x, y, points[i][0], points[i][1]);
                if (d < minDist) {
                    minDist = d;
                    closestIndex = i;
                }
            }
            
            return closestIndex;
        }

        function getBaseColor(x, y, index) {
            if (randomCellColors && randomCellColors[index]) {
                return randomCellColors[index];
            }
            // Create wave-based color pattern
            const angleFromCenter = atan2(y - height/2, x - width/2);
            const distFromCenter = dist(x, y, width/2, height/2);
            const normalizedDist = constrain(map(distFromCenter, 0, width/2, 0, 1), 0, 1);
            // Add smaller wave motion to colors
            const waveOffset = sin(time * waveParams.colorSpeed + index * 0.2) * 5; 
            const satWave = sin(time * waveParams.colorSpeed * 0.5 + index * 0.3) * 5; 
            const briWave = cos(time * waveParams.colorSpeed * 0.7 + index * 0.4) * 6; 
            return {
                hue: (map(angleFromCenter, -PI, PI, 80, 105) + waveOffset + 27) % 360,
                saturation: 70 + normalizedDist * 15 + satWave,
                brightness: 80 - normalizedDist * 10 + briWave
            };
        }

        function randomCellColor() {
            return {
                hue: (randomBaseHue + random(-8, 8) + 360) % 360,
                saturation: 70 + random(-8, 8),
                brightness: 80 + random(-8, 8)
            };
        }

        function randomizeColors() {
            randomCellColors = [];
            // Pick a new base hue for all cells
            randomBaseHue = random(0, 360);
            for (let i = 0; i < points.length; i++) {
                randomCellColors.push(randomCellColor());
            }
            document.getElementById('waveButton').hidden = false;
        }

        function waveColors() {
            randomCellColors = null;
            document.getElementById('waveButton').hidden = true;
        }

        function draw() {
            background(0);

            try {
                if (!voronoi) return;

                activeIndex = press ? press.index : findActiveCell();

                // Update point positions with wave motion
                if (isAnimating) {
                    for (let i = 0; i < points.length; i++) {
                        const baseX = points[i][0];
                        const baseY = points[i][1];
                        const phase = i / numPoints * TWO_PI;
                        
                        const xOffset = sin(time * waveParams.frequency + phase) * 
                                      waveParams.amplitude * sin(time * 0.5);
                        const yOffset = cos(time * waveParams.frequency + phase + waveParams.phaseOffset) * 
                                      waveParams.amplitude * cos(time * 0.5);
                        
                        points[i][0] = baseX + xOffset;
                        points[i][1] = baseY + yOffset;
                        
                        points[i][0] = constrain(points[i][0], 0, width);
                        points[i][1] = constrain(points[i][1], 0, height);
                    }
                    time += 0.016;
                    updateVoronoi();
                }

                for (let i = 0; i < points.length; i++) {
                    const cell = voronoi.cellPolygon(i);
                    if (cell) {
                        const [centerX, centerY] = points[i];
                        // Always use a copy for highlight so original is not mutated
                        let baseColor = getBaseColor(centerX, centerY, i);
                        let drawColor = { ...baseColor };
                        if (i === activeIndex) {
                            const pulseWave = sin(time * 4) * 0.5 + 0.5;
                            drawColor.saturation = lerp(drawColor.saturation, 100, pulseWave);
                            drawColor.brightness = lerp(drawColor.brightness, 100, pulseWave);
                        }

                        beginShape();
                        noStroke();
                        fill(drawColor.hue, drawColor.saturation, drawColor.brightness);
                        for (const [x, y] of cell) {
                            vertex(x, y);
                        }
                        endShape(CLOSE);

                        if (i === activeIndex) {
                            stroke(0);
                            strokeWeight(4);
                            point(centerX, centerY);
                        }
                    }
                }

            } catch (error) {
                console.error("Error in draw:", error);
            }
        }

        function randomizePoints() {
            const padding = 50;
            for (let i = 0; i < points.length; i++) {
                points[i] = [
                    random(padding, width - padding),
                    random(padding, height - padding)
                ];
            }
            updateVoronoi();
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            document.getElementById('animButton').textContent = isAnimating ? 'Pause' : 'Play';
        }

        function addPoint(x, y) {
            if (points.length >= MAX_POINTS) return;
            points.push([x, y]);
            if (randomCellColors) randomCellColors.push(randomCellColor());
            updateVoronoi();
        }

        function removePoint(index) {
            if (index < 0 || points.length <= MIN_POINTS) return;
            points.splice(index, 1);
            if (randomCellColors) randomCellColors.splice(index, 1);
            updateVoronoi();
        }

        // Mouse and touch alike: a tap or click adds a cell, a drag moves the
        // nearest one, holding still (or a right-click) removes it.
        function setupPointer(el) {
            const DRAG_START = 6;   // px a press moves before it counts as a drag
            const HOLD_MS = 500;

            el.addEventListener('contextmenu', (e) => e.preventDefault());

            el.addEventListener('pointerdown', (e) => {
                if (press) return;  // ignore a second finger
                if (e.pointerType === 'mouse' && e.button === 2) {
                    removePoint(findActiveCell(e.clientX, e.clientY));
                    return;
                }
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                el.setPointerCapture(e.pointerId);
                press = {
                    id: e.pointerId,
                    x: e.clientX,
                    y: e.clientY,
                    index: findActiveCell(e.clientX, e.clientY),
                    dragging: false,
                    done: false
                };
                // Holding still removes a cell on touch screens; a mouse has right-click
                if (e.pointerType === 'mouse') return;
                const p = press;
                p.timer = setTimeout(() => {
                    if (press !== p || p.dragging) return;
                    p.done = true;
                    removePoint(p.index);
                    p.index = -1;
                }, HOLD_MS);
            });

            el.addEventListener('pointermove', (e) => {
                if (!press || e.pointerId !== press.id || press.done) return;
                if (!press.dragging &&
                    Math.hypot(e.clientX - press.x, e.clientY - press.y) < DRAG_START) return;
                press.dragging = true;
                clearTimeout(press.timer);
                if (press.index >= 0) {
                    points[press.index] = [
                        constrain(e.clientX, 0, width),
                        constrain(e.clientY, 0, height)
                    ];
                    updateVoronoi();
                }
            });

            const release = (e, add) => {
                if (!press || e.pointerId !== press.id) return;
                clearTimeout(press.timer);
                if (add && !press.dragging && !press.done) addPoint(press.x, press.y);
                press = null;
            };
            el.addEventListener('pointerup', (e) => release(e, true));
            el.addEventListener('pointercancel', (e) => release(e, false));
        }

        // Rotating a phone or resizing the window keeps the cells where they
        // were relative to the screen instead of stranding them off the edge.
        function windowResized() {
            const sx = windowWidth / width;
            const sy = windowHeight / height;
            resizeCanvas(windowWidth, windowHeight);
            for (const pt of points) {
                pt[0] *= sx;
                pt[1] *= sy;
            }
            updateVoronoi();
        }
    </script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/favicon-16x16.png">
  <link rel="manifest" href="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/site.webmanifest">
  <title>Substructure</title>
  <style>
    @font-face { font-family: 'ISOCPEUR'; src: url('ISOCPEUR.ttf') format('truetype'); font-display: block; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #141818; color: #e5e9df; font: 11px 'ISOCPEUR', 'Courier New', monospace; }
    canvas { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; touch-action: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    #sound { position: fixed; top: 24px; right: 64px; z-index: 110; background: #141818b8; border: 1px solid #e5e9df40; padding: 7px 10px; font-size: 9px; letter-spacing: .1em; }
    #hud { position: fixed; top: 25px; left: 26px; pointer-events: none; z-index: 10; }
    #altitude { font-size: 11px; font-weight: 500; text-align: left; letter-spacing: .12em; }
    #altitude span { display: block; margin-top: 7px; font-size: 9px; font-weight: 400; opacity: .5; }
    #altitude #carry { opacity: .9; }
    #altitude span[hidden] { display: none; }
    #hud > div { background: #141818c9; padding: 10px 12px; border-left: 2px solid #e5e9df60; }
    #reticle { position: fixed; left: 50%; top: 50%; width: 3px; height: 3px; background: #e5e9df80; pointer-events: none; z-index: 10; }
    #prompt { position: fixed; top: calc(50% + 28px); left: 50%; transform: translateX(-50%); padding: 9px 13px; background: #141818dd; font-size: 10px; white-space: nowrap; z-index: 10; pointer-events: none; }
    #prompt:empty { display: none; }
    #veil { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0c111160; backdrop-filter: blur(2px); }
    #veil[hidden] { display: none; }
    #end { position: fixed; inset: 0; z-index: 999; background: #000; }
    #end[hidden] { display: none; }
    /* A few seconds into the black, the name drifts down from above the screen and off the bottom. */
    #credits { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .5em; text-indent: .5em; color: #e5e9df; pointer-events: none; transform: translateY(-100%); animation: credits 30s linear 4s forwards; }
    @keyframes credits { to { transform: translateY(100dvh); } }
    #card { width: min(430px, calc(100vw - 40px)); padding: 32px; background: #151a18ed; border: 1px solid #e5e9df50; box-shadow: 0 20px 80px #0007; }
    h1 { font-size: 32px; line-height: 1.14; font-weight: 400; letter-spacing: .02em; margin: 0 0 20px; }
    #enter { width: 100%; margin: 26px 0 22px; padding: 13px 18px; background: #e5e9df; border: 0; color: #151a18; text-align: left; display: flex; justify-content: space-between; font-weight: 500; }
    #enter:hover { background: #fff; }
    #enter:disabled { opacity: .4; cursor: wait; }
    .controls { display: grid; grid-template-columns: 110px 1fr; gap: 9px; font-size: 9px; }
    .controls dt { color: #e5e9df; }
    .controls dd { opacity: .55; }
    .settings { display: grid; grid-template-columns: 110px 1fr; gap: 9px; align-items: center; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e5e9df20; font-size: 9px; }
    .settings label { color: #e5e9df; cursor: pointer; }
    .setting { display: flex; align-items: center; gap: 10px; height: 12px; min-width: 0; }
    .setting output { width: 34px; text-align: right; opacity: .55; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 12px; margin: 0; background: transparent; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #e5e9df60; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 7px; height: 11px; margin-top: -5px; border: 0; border-radius: 0; background: #e5e9df; }
    input[type=range]::-moz-range-track { height: 1px; background: #e5e9df60; }
    input[type=range]::-moz-range-thumb { width: 7px; height: 11px; border: 0; border-radius: 0; background: #e5e9df; }
    input[type=checkbox] { -webkit-appearance: none; appearance: none; display: grid; place-content: center; width: 11px; height: 11px; margin: 0; border: 1px solid #e5e9df80; background: transparent; cursor: pointer; }
    input[type=checkbox]::after { content: ''; width: 5px; height: 5px; background: #e5e9df; opacity: 0; }
    input[type=checkbox]:checked::after { opacity: 1; }
    input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #notice { margin-top: 18px; font-size: 9px; line-height: 1.7; color: #bec6b9; }
    #notice:empty { display: none; }
    #forget { margin-top: 16px; padding: 0; background: none; border: 0; font-size: 9px; letter-spacing: .1em; opacity: .5; }
    #forget:hover { opacity: .9; }
    #mobile { display: none; position: fixed; inset: auto 18px 82px; z-index: 25; justify-content: space-between; pointer-events: none; }
    #mobile button { pointer-events: auto; touch-action: none; width: 50px; height: 50px; background: #141818b8; border: 1px solid #e5e9df60; }
    #pad { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
    #pad button:first-child { grid-column: 2; }
    #pad button:nth-child(2) { grid-column: 1; }
    @media (pointer: coarse) { body.playing #mobile { display: flex; } }
    @media (max-width: 550px) { #hud { top: 18px; left: 18px; } #sound { top: 14px; right: 48px; } }
  </style>
</head>
<body>
  <a href="/" aria-label="Home" style="position:fixed;top:10px;right:10px;z-index:1000;line-height:0;text-decoration:none;transition:transform .2s cubic-bezier(.68,-.55,.265,1.55)" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'" onmousedown="this.style.transform='scale(.95)'" onmouseup="this.style.transform='scale(1.2)'">
    <img src="https://raw.githubusercontent.com/Evelyn225/emergent-toys/main/images/go-home.png" alt="home" style="width:22px;height:22px;object-fit:contain;image-rendering:pixelated;display:block">
  </a>
  <button id="sound" aria-pressed="false">SOUND OFF</button>
  <div id="hud"><div id="altitude">LEVEL +00.0 M<span>WASD MOVE / ESC PAUSE</span><span id="carry" hidden>CARRYING KEY</span></div></div>
  <div id="reticle" hidden></div><div id="prompt"></div><div id="end" hidden><div id="credits">SUBSTRUCTURE</div></div>
  <div id="veil"><div id="card">
    <h1>Substructure</h1>
    <button id="enter" disabled><span id="enter-label">LOADING</span><span aria-hidden="true">↗</span></button>
    <dl class="controls"><dt>W A S D</dt><dd>Walk in any direction</dd><dt>MOUSE</dt><dd>Look around</dd><dt>SHIFT / E</dt><dd>Walk faster / interact</dd><dt>ESC</dt><dd>Pause and release cursor</dd></dl>
    <div class="settings">
      <label for="look-speed">LOOK SPEED</label><span class="setting"><input id="look-speed" type="range" min="0.25" max="3" step="0.05"><output id="look-speed-value" for="look-speed"></output></span>
      <label for="invert-look">INVERT Y</label><span class="setting"><input id="invert-look" type="checkbox"></span>
      <label for="volume">VOLUME</label><span class="setting"><input id="volume" type="range" min="0" max="100" step="5"><output id="volume-value" for="volume"></output></span>
    </div>
    <p id="notice" role="status"></p>
    <button id="forget" hidden>FORGET AND START AGAIN</button>
  </div></div>
  <div id="mobile"><div id="pad"><button data-key="KeyW" aria-label="Forward">↑</button><button data-key="KeyA" aria-label="Left">←</button><button data-key="KeyS" aria-label="Back">↓</button><button data-key="KeyD" aria-label="Right">→</button></div><button id="touch-use" aria-label="Interact">E</button><button id="touch-pause" aria-label="Pause">Ⅱ</button></div>
  <script type="module" src="corridor.bundle.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
